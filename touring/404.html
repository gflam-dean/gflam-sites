<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Page not found | Gflam Touring</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2750%27%20fill%3D%27%23fe65c3%27%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  A REAL NOT-FOUND PAGE (23 Oct 2026 website audit).

  Without a 404.html at the root, Cloudflare Pages treats the site as a single-page app and
  answers ANY unknown address with the homepage and a 200, so a dead ticket link or a mistyped
  show address looked like the homepage and search engines could index junk addresses as
  copies of it. With this file present, Pages serves it with a real 404 status.

  Every link here is absolute (/...), because this page is served AT the missing address.
-->
<style>
  :root{--pink:#fe65c3;--dark:#111;--dark2:#1a1a1a;--white:#fff;--muted:rgba(255,255,255,0.55);--border:rgba(255,255,255,0.1)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--dark);color:var(--white);font:16px/1.6 "DM Sans",system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px}
  .card{background:var(--dark2);border:1px solid var(--border);border-radius:12px;max-width:520px;width:100%;padding:32px 26px}
  .brand{display:block;margin-bottom:22px}
  .brand img{height:40px;width:auto;display:block}
  h1{font-family:"DM Serif Display",serif;font-weight:400;font-size:30px;line-height:1.2;margin:0 0 10px}
  h1 span{color:var(--pink)}
  p{margin:0 0 14px;color:var(--muted)}
  .go{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  .go a{display:block;padding:13px 16px;border-radius:6px;text-decoration:none;font-weight:600;text-align:center}
  .go a.main{background:var(--pink);color:#111}
  .go a.alt{border:1px solid var(--border);color:var(--white)}
  .go a.alt:hover{border-color:var(--pink)}
  .foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
  .foot a{color:var(--white)}
</style>
</head>
<body>
<main class="card">
  <a class="brand" href="/"><img src="/logo.png" alt="Gflam Touring"></a>
  <h1>We could not find that page<span>.</span></h1>
  <p>The address may be mistyped, or the show has moved.</p>
  <div class="go">
    <a class="main" href="/current-tours">See what is on now</a>
    <a class="alt" href="/drag-bingo-at-the-bowlo">Drag Bingo at the Bowlo</a>
    <a class="alt" href="/">Go to the Gflam Touring homepage</a>
  </div>
  <p class="foot">Looking for tickets? Email <a href="mailto:hello@gflamtouring.com.au">hello@gflamtouring.com.au</a> and we will point you to the right show.</p>
</main>
</body>
</html>
