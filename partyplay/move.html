<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Move your party | PartyPlay</title>
<link rel="icon" href="/logos/partyplay-appicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#12101A;--ink2:#1B1826;--paper:#FFF1E6;--mute:#B6ADC2;--faint:#847A98;
    --pink:#FF1F8E;--teal:#17C4B4;--line:rgba(255,241,230,.14)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:Manrope,system-ui,sans-serif;font-size:17px;line-height:1.55}
  .wrap{max-width:520px;margin:0 auto;padding:40px 20px 90px}
  h1{font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:800;font-size:32px;letter-spacing:-.02em;margin:0 0 8px}
  .mark{width:54px;height:46px;margin-bottom:16px}
  p{color:var(--mute);margin:0 0 22px}
  label{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
  input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--ink2);
    color:var(--paper);font:inherit;font-size:17px}
  input:focus{outline:2px solid var(--pink);outline-offset:1px}
  button{width:100%;padding:16px;margin-top:18px;border:0;border-radius:12px;background:var(--pink);color:#fff;
    font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:18px;cursor:pointer}
  button:disabled{background:#2A2438;color:var(--faint)}
  .now{background:var(--ink2);border-left:3px solid var(--teal);border-radius:0 12px 12px 0;padding:14px 17px;margin-bottom:20px}
  .now p{margin:0;color:var(--paper);font-size:16px}
  .err{background:rgba(255,90,110,.12);border:1px solid rgba(255,90,110,.4);border-radius:12px;
    padding:13px 15px;color:#FFC2CC;margin-top:14px;font-size:15.5px}
  .ok{background:rgba(23,196,180,.12);border:1px solid rgba(23,196,180,.4);border-radius:12px;
    padding:13px 15px;color:#9FEBE0;margin-top:14px;font-size:15.5px}
</style>
</head>
<body>
<div class="wrap">
  <img class="mark" src="/logos/partyplay-mark.svg" alt="">
  <h1>Move your party</h1>
  <p>Free, and as many times as you need. Your games and your code stay exactly as they are.</p>
  <div class="now"><p id="now">Loading...</p></div>
  <label for="date">New date</label>
  <input id="date" type="date">
  <button id="go" disabled>Move it</button>
  <div id="msg"></div>
</div>
<script src="/lib/pp-config.js"></script>
<script src="/lib/pp-licence.js"></script>
<script>
(function(){
  var API = PPConfig.API, $=function(i){return document.getElementById(i);};
  var q=new URLSearchParams(location.search);
  var CODE=(q.get("code")||"").toUpperCase(), KEY=q.get("key")||"";
  var STATE=null, DAYS=1;
  var f=new Intl.DateTimeFormat("en-AU",{weekday:"long",day:"numeric",month:"long"});

  if(!CODE||!KEY){ $("now").textContent="This link is missing something. Open it from your confirmation email."; return; }

  fetch(API+"/licence?code="+encodeURIComponent(CODE)).then(function(r){return r.json();}).then(function(j){
    if(j.error) throw new Error(j.error);
    STATE=j.state; DAYS=j.days;
    var s=new Date(j.startsAt), e=new Date(j.endsAt);
    if(Date.now()>=s.getTime()){
      $("now").textContent="This party has already started, so the date cannot be moved.";
      $("date").disabled=true; return;
    }
    $("now").textContent="Right now it runs from midnight on "+f.format(new Date(s.getTime()+12*36e5))+
      " until 6am on "+f.format(e)+".";
    // Never offer a date that is already gone, judged in THEIR state.
    $("date").min=new Intl.DateTimeFormat("en-CA",{timeZone:PPLicence.zoneFor(STATE),
      year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
    $("go").disabled=false;
  }).catch(function(e){ $("now").textContent=e.message; });

  $("date").addEventListener("change",function(){
    $("msg").innerHTML="";
    if(!$("date").value||!STATE) return;
    try{
      var w=PPLicence.windowFor(STATE,$("date").value,DAYS);
      $("msg").innerHTML='<div class="ok">New dates: '+PPLicence.describe(w)+'</div>';
    }catch(e){}
  });

  $("go").addEventListener("click",function(){
    if(!$("date").value){ $("msg").innerHTML='<div class="err">Pick a new date first.</div>'; return; }
    $("go").disabled=true; $("go").textContent="Moving...";
    fetch(API+"/licence/move",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({code:CODE,key:KEY,date:$("date").value})})
      .then(function(r){return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||"Could not move it."); return j; });})
      .then(function(j){
        $("msg").innerHTML='<div class="ok">Done. '+j.described+'</div>';
        $("go").textContent="Moved";
      })
      .catch(function(e){
        $("msg").innerHTML='<div class="err">'+e.message+'</div>';
        $("go").disabled=false; $("go").textContent="Move it";
      });
  });
})();
</script>
</body>
</html>
