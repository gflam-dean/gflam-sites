<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Page not found | PartyPlay</title>
<link rel="icon" href="/logos/partyplay-appicon.svg">
<!--
  A REAL NOT-FOUND PAGE (23 Oct 2026 website audit).

  Without a 404.html at the root, Cloudflare Pages treats the site as a single-page app and
  answers ANY unknown address with the homepage and a 200. A mistyped party link looked like
  the homepage, and search engines could index junk addresses as copies of it. With this file
  present, Pages serves it with a real 404 status for every address it has no file for.

  Every link here is absolute (/...), because this page is served AT the missing address.
  Same shape as venueplay/404.html, in PartyPlay's own palette.
-->
<style>
  :root{--ink:#12101A;--ink2:#1B1826;--hair:rgba(255,241,230,.13);--paper:#FFF1E6;--mute:#B6ADC2;--pink:#FF1F8E}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.6 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px}
  .card{background:var(--ink2);border:1px solid var(--hair);border-radius:16px;max-width:520px;width:100%;padding:32px 26px}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:22px;color:var(--paper);text-decoration:none}
  .brand img{width:26px;height:23px;display:block}
  .brand span{font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:700;font-size:15px}
  h1{font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:24px;line-height:1.25;margin:0 0 10px}
  p{margin:0 0 14px;color:var(--mute)}
  .go{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  .go a{display:block;padding:13px 16px;border-radius:10px;text-decoration:none;font-weight:700;text-align:center}
  .go a.main{background:var(--pink);color:#fff}
  .go a.alt{border:1px solid var(--hair);color:var(--paper)}
  .go a.alt:hover{border-color:rgba(255,31,142,.55)}
  .foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--hair);font-size:13px;color:var(--mute)}
  .foot a{color:var(--paper)}
</style>
</head>
<body>
<main class="card">
  <a class="brand" href="/"><img src="/logos/partyplay-mark.svg" alt=""><span>PartyPlay</span></a>
  <h1>We could not find that page</h1>
  <p>The address may be mistyped, or the page has moved.</p>
  <div class="go">
    <a class="main" href="/play">Joining a party? Enter the code</a>
    <a class="alt" href="/run">Hosting? Sign in to your party</a>
    <a class="alt" href="/">Go to the PartyPlay homepage</a>
  </div>
  <p class="foot">Stuck? Email <a href="mailto:hello@partyplay.com.au">hello@partyplay.com.au</a> and we will sort it out.</p>
</main>
</body>
</html>
