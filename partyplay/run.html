<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Run the night | PartyPlay</title>
<link rel="icon" href="/logos/partyplay-appicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#12101A;--ink2:#1B1826;--ink3:#262234;--paper:#FFF1E6;--mute:#B6ADC2;--faint:#847A98;
    --pink:#FF1F8E;--teal:#17C4B4;--yellow:#FFD23F;--line:rgba(255,241,230,.14)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:Manrope,system-ui,sans-serif;
    font-size:16.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:620px;margin:0 auto;padding:22px 18px 40px}
  h1,h2,h3,.num{font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .top .l{display:flex;align-items:center;gap:10px}
  .top img{width:38px;height:33px}
  .top b{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:18px}
  .tvbtn{background:none;border:1px solid var(--line);color:var(--mute);border-radius:10px;
    padding:9px 13px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}

  .strip{display:flex;gap:10px;align-items:center;background:var(--ink2);border:1px solid var(--line);
    border-radius:13px;padding:13px 16px;margin-bottom:14px;flex-wrap:wrap}
  .strip .code{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:23px;letter-spacing:.09em;color:var(--pink)}
  .strip .n{margin-left:auto;color:var(--mute);font-size:15px}

  .card{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px}
  .card h3{font-size:17px;margin-bottom:3px}
  .card p{color:var(--faint);font-size:14.5px;margin:0}
  .card .row{display:flex;align-items:center;gap:12px}
  .card .row .meta{flex:1 1 auto;min-width:0}
  button.play{background:var(--pink);border:0;color:#fff;border-radius:10px;padding:11px 18px;
    font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:15px;cursor:pointer}
  button.sec{background:none;border:1px solid var(--line);color:var(--mute);border-radius:10px;
    padding:11px 15px;font:inherit;font-size:15px;cursor:pointer}
  button:disabled{opacity:.45;cursor:not-allowed}

  .gate{text-align:center;padding:46px 18px;color:var(--mute)}
  .gate .big{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:23px;color:var(--paper);margin-bottom:8px}

  /* ---- bingo ---- */
  .caller{text-align:center;padding:10px 0 4px}
  .caller .num{font-size:clamp(74px,26vw,150px);line-height:1;color:var(--pink)}
  .caller .said{color:var(--mute);font-size:16px;min-height:24px}
  .callbtn{width:100%;padding:20px;border:0;border-radius:15px;background:var(--pink);color:#fff;
    font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:21px;cursor:pointer;margin:12px 0}
  .board{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px}
  .board i{font-style:normal;text-align:center;padding:6px 0;border-radius:6px;background:var(--ink3);
    color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums}
  .board i.hit{background:var(--pink);color:#fff;font-weight:700}
  .bar2{display:flex;gap:9px;margin-top:12px}
  .bar2 button{flex:1 1 0}

  /* ---- trivia ---- */
  .q{background:var(--ink3);border-radius:13px;padding:16px 18px;margin-bottom:10px}
  .q .qn{color:var(--faint);font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
  .q .qt{font-size:18px;font-weight:700}
  .q .qa{color:var(--teal);font-size:16px;margin-top:8px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink3);
    border:1px solid var(--line);border-radius:22px;padding:10px 18px;font-size:14.5px;opacity:0;
    transition:opacity .18s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="l"><img src="/logos/partyplay-mark.svg" alt=""><b>PartyPlay</b></div>
    <div style="display:flex;gap:8px">
      <a class="tvbtn" id="buildlink">Games</a>
      <a class="tvbtn" id="tvlink" target="_blank" rel="noopener">Open the screen</a>
    </div>
  </div>
  <div id="app"><div class="gate">Loading...</div></div>
</div>
<div class="toast" id="toast"></div>

<script src="/lib/pp-config.js"></script>
<script src="/lib/pp-licence.js"></script>
<script src="/lib/pp-quiz.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  var API = PPConfig.API;
  var SUPA_URL=PPConfig.SUPA_URL, SUPA_ANON=PPConfig.SUPA_ANON;
  var $=function(i){return document.getElementById(i);};
  var q=new URLSearchParams(location.search);
  var CODE=(q.get("code")||"").toUpperCase(), KEY=q.get("key")||"";
  var PARTY=null, GAMES=[], players=[], ch=null, G=null;
  /* The night's running total, kept outside G so it survives one game ending and
     the next starting. Stored too, because the host's tablet WILL get locked,
     backgrounded or reloaded halfway through the night. */
  var NIGHT = {};
  function nightKey(){ return "ppNight:" + CODE; }
  function nightLoad(){ try{ NIGHT = JSON.parse(localStorage.getItem(nightKey())||"{}") || {}; }catch(e){ NIGHT={}; } }
  function nightSave(){ try{ localStorage.setItem(nightKey(), JSON.stringify(NIGHT)); }catch(e){} }
  function nightAdd(rows){
    (rows||[]).forEach(function(r){ NIGHT[r.name] = (NIGHT[r.name]||0) + (r.score||0); });
    nightSave();
  }
  function nightBoard(){
    return Object.keys(NIGHT).map(function(n){ return {name:n, score:NIGHT[n]}; })
      .sort(function(a,b){ return b.score-a.score || a.name.localeCompare(b.name); });
  }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("show");
    clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("show");},1700); }
  function api(p,o){ return fetch(API+p,Object.assign({headers:{"content-type":"application/json"}},o||{}))
    .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||"Something went wrong"); return j; }); }); }
  function send(o){ if(ch){ try{ ch.send({type:"broadcast",event:"msg",payload:o}); }catch(e){} } }

  /* PartyPlay draws in the browser, unlike VenuePlay which had to move its draw
     to a server for OLGR. A private party is not regulated gaming, there is no
     stake and no regulator to satisfy, so the tablet is a perfectly good barrel.
     Still rejection sampled, because a biased draw is just a worse game. */
  function pick(n){
    var a=new Uint32Array(1), lim=Math.floor(4294967296/n)*n, x;
    do{ crypto.getRandomValues(a); x=a[0]; }while(x>=lim);
    return x%n;
  }

  function connect(){
    if(!SUPA_ANON) return;
    try{
      var c=supabase.createClient(SUPA_URL,SUPA_ANON);
      ch=c.channel(PPConfig.channel(CODE),{config:{broadcast:{self:false}}});
      ch.on("broadcast",{event:"msg"},function(e){
        var m=e.payload||{};
        if(m.t==="hello" && m.name){
          if(players.indexOf(m.name)<0){ players.push(m.name); paintStrip(); send({t:"players",names:players}); }
          /* Somebody has just walked in and picked up their phone. Tell them what
             is happening, or they stare at a waiting screen until the next round
             wondering whether it is broken. Not every game can do this, so it is
             opt in per game. */
          if(G && G.resend){ try{ G.resend(); }catch(e){} }
        }
        if(m.t==="tv-here"){ send({t:"players",names:players}); if(G) G.repaint&&G.repaint(); }
        /* An answer from a phone. First one per person per question counts: a
           guest who taps twice has changed their mind after seeing a face, and
           letting that through makes the whole board meaningless. */
        if(m.t==="claim" && m.name){ onClaim(m.name, m.kind); }
        if(m.t==="photoguess" && G && G.mode==="photos" && m.name){
          if(!G.answers.some(function(a){ return a.name===m.name && a.i===m.i; })){
            G.answers.push({name:m.name,i:m.i,answer:m.answer}); paintPhotos();
          }
        }
        if(m.t==="song" && G && G.mode==="playlist" && m.name && m.text){
          G.songs.push({ title:String(m.text).slice(0,80), by:m.name, played:false });
          send({t:"queue", songs:G.songs.slice(-12).map(function(s){ return {t:s.title,by:s.by}; })});
          paintPlaylist();
        }
        if(m.t==="hand" && G && G.mode==="whohere" && m.name && m.i===G.i){
          if(!G.hands.some(function(x){ return x.i===m.i && x.name===m.name; })){
            G.hands.push({i:m.i,name:m.name});
            send({t:"big",text:esc(G.items[G.i].q),
                  sub:G.hands.filter(function(x){return x.i===G.i;}).map(function(x){return x.name;}).join(", ")});
            paintWhoHere();
          }
        }
        if(m.t==="truths" && G && G.mode==="truths" && m.name && m.lines && m.lines.length===3){
          if(!G.subs.some(function(x){ return x.name===m.name; })){
            G.subs.push({ name:m.name, lines:m.lines.map(function(x){return String(x).slice(0,120);}),
                          lie: Math.max(0, Math.min(2, parseInt(m.lie,10)||0)) });
            paintTruths();
          }
        }
        if(m.t==="truthvote" && G && G.mode==="truths" && m.name && G.phase==="play"){
          var t=G.subs[G.turn];
          if(t && m.name!==t.name && !G.votes.some(function(x){ return x.turn===G.turn && x.name===m.name; })){
            G.votes.push({ turn:G.turn, name:m.name, right: (parseInt(m.pick,10)===t.lie) });
            paintTruths();
          }
        }
        if(m.t==="pick" && G && G.mode==="heads" && m.name && G.inPlay.indexOf(m.name)>=0){
          G.picks[m.name]=m.side; paintHeads();
        }
        if(m.t==="answer" && G && G.items && m.name){
          var dup = G.answers.some(function(a){ return a.name===m.name && a.i===m.i; });
          if(!dup){ G.answers.push({name:m.name,i:m.i,answer:m.answer}); paintTrivia(); }
        }
      });
      ch.subscribe();
    }catch(e){}
  }

  /* SIGNING IN, which did not exist.

     A host arrives here from a link in their welcome email that carries the
     code and the host key. Lose that email and this page said "open this from
     the link in your email" and stopped: no way in, no way to get the email
     again, on a product somebody has already paid for. The Worker has had a
     resend endpoint the whole time and nothing on the site reached it.

     The tips are here rather than only in the setup guide because this is the
     screen a host is looking at when they are getting ready, which is exactly
     when the advice is worth having. */
  function signIn(err){
    $("app").innerHTML =
      '<div class="gate" style="text-align:left">' +
        '<div class="big" style="text-align:center">Open your party</div>' +
        '<p style="text-align:center">Both of these are in your welcome email.</p>' +
        '<label for="siCode" style="display:block;margin:18px 0 6px;color:var(--faint);font-size:14px">Party code</label>' +
        '<input id="siCode" maxlength="10" autocapitalize="characters" autocomplete="off" ' +
          'spellcheck="false" placeholder="ABC123" style="width:100%;padding:14px;border-radius:11px;' +
          'border:1px solid var(--line);background:rgba(255,255,255,.05);color:inherit;font:inherit;text-align:center">' +
        '<label for="siKey" style="display:block;margin:14px 0 6px;color:var(--faint);font-size:14px">Host key</label>' +
        '<input id="siKey" autocomplete="off" spellcheck="false" placeholder="the long one" ' +
          'style="width:100%;padding:14px;border-radius:11px;border:1px solid var(--line);' +
          'background:rgba(255,255,255,.05);color:inherit;font:inherit;text-align:center">' +
        (err ? '<p style="color:var(--pink);margin-top:12px">' + esc(err) + '</p>' : '') +
        '<button class="callbtn" id="siGo" style="margin-top:18px;width:100%">Open my party</button>' +
        '<p style="margin-top:16px;text-align:center">Lost the email? ' +
          '<a href="#" id="siResend">Send it again</a></p>' +
        '<div style="margin-top:26px;padding-top:20px;border-top:1px solid var(--line)">' +
          '<div style="font-weight:800;margin-bottom:10px">Twenty minutes before people arrive</div>' +
          '<ul style="margin:0;padding-left:20px;color:var(--faint);line-height:1.75">' +
            '<li><b>Get the screen working</b> with nobody watching. It is the only part worth doing early.</li>' +
            '<li><b>Have a practice run</b> so the first game in front of people is not your first ever. ' +
              '<a href="/practice">Try one now</a>, it does not use any of your time.</li>' +
            '<li><b>Plug the laptop in.</b> A flat battery halfway through the bingo is a sad way to end a game.</li>' +
            '<li><b>Turn off the screen saver</b> on the telly or the laptop.</li>' +
            '<li><b>Decide what they are playing for</b> and put it where everyone can see it.</li>' +
          '</ul>' +
        '</div>' +
      '</div>';

    function go(){
      var c = ($("siCode").value || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
      var k = ($("siKey").value || "").trim();
      if(c.length < 4 || !k) return signIn("Put in both the code and the host key.");
      // Straight into the address the rest of the page already reads, so there
      // is one way in and nothing new to keep in step.
      location.search = "?code=" + encodeURIComponent(c) + "&key=" + encodeURIComponent(k);
    }
    $("siGo").addEventListener("click", go);
    $("siKey").addEventListener("keydown", function(e){ if(e.key === "Enter") go(); });
    $("siResend").addEventListener("click", function(e){
      e.preventDefault();
      var c = ($("siCode").value || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
      if(c.length < 4) return signIn("Put your party code in first, then press send it again.");
      api("/licence/resend", { method:"POST", body: JSON.stringify({ code:c }) })
        .then(function(){ toast("If that code is one of ours, the email is on its way."); })
        .catch(function(){ toast("If that code is one of ours, the email is on its way."); });
    });
    $("siCode").focus();
  }

  function load(){
    if(!CODE||!KEY){ signIn(); return; }
    $("tvlink").href="/tv?code="+encodeURIComponent(CODE);
    $("buildlink").href="/host?code="+encodeURIComponent(CODE)+"&key="+encodeURIComponent(KEY);
    nightLoad();
    api("/games?code="+encodeURIComponent(CODE)+"&key="+encodeURIComponent(KEY))
      .then(function(d){ PARTY=d.party; GAMES=d.games||[]; connect(); render(); })
      .catch(function(e){ $("app").innerHTML='<div class="gate">'+esc(e.message)+'</div>'; });
  }

  function paintStrip(){
    var s=$("strip"); if(s) s.querySelector(".n").textContent=players.length+" playing";
  }

  function startClock(){
    if(!window.confirm(PARTY.startWarning)) return;
    var btn = $("startnow");
    if(btn){ btn.disabled = true; btn.textContent = "Starting..."; }
    api("/licence/start", { method:"POST", body: JSON.stringify({ code:CODE, key:KEY }) })
      .then(function(j){
        PARTY.status = "live"; PARTY.startsAt = j.startsAt; PARTY.endsAt = j.endsAt;
        PARTY.timeLeft = j.timeLeft;
        render(); toast("You are running");
      })
      .catch(function(e){
        if(btn){ btn.disabled = false; btn.textContent = "Start the party"; }
        toast(e.message);
      });
  }

  function render(){
    /* Three states. "ready" is where a licence spends most of its life: bought,
       built, and waiting for somebody to say go. */
    if(PARTY.status === "ready"){
      $("app").innerHTML =
        '<div class="gate"><div class="big">Ready when you are</div>'+
        '<p>Nothing is ticking yet. Your <b>'+(PARTY.days===3?"3 days":"24 hours")+
        '</b> begins the moment you press this, so leave it alone until the party is actually happening.</p>'+
        '<p style="margin-top:6px">You can keep building games without starting it.</p>'+
        '<button class="callbtn" id="startnow" style="margin-top:22px">Start the party</button>'+
        '<p style="margin-top:14px"><a href="/host?code='+encodeURIComponent(CODE)+'&key='+encodeURIComponent(KEY)+'">Build your games first</a></p></div>';
      return;
    }
    if(PARTY.status === "finished"){
      $("app").innerHTML='<div class="gate"><div class="big">That is a wrap</div>'+
        '<p>Your time is up. Hope it was a good one.</p></div>';
      return;
    }

    var h='<div class="strip" id="strip"><span style="color:var(--faint);font-size:14px">Code</span>'+
      '<span class="code">'+esc(PARTY.code)+'</span><span class="n">'+players.length+' playing</span></div>'+
      '<div class="strip" style="padding:9px 16px"><span style="color:var(--faint);font-size:14px">Time</span>'+
      '<span id="clock" style="font-weight:700">'+esc(PARTY.timeLeft||"")+'</span></div>';
    if(!GAMES.length){
      h+='<div class="gate"><div class="big">No games yet</div><p>Add one and come back.</p>'+
         '<p style="margin-top:14px"><a href="/host?code='+encodeURIComponent(CODE)+'&key='+encodeURIComponent(KEY)+'">Build your games</a></p></div>';
    }
    GAMES.forEach(function(g,i){
      var n=(g.config&&g.config.items&&g.config.items.length)||0;
      h+='<div class="card"><div class="row"><div class="meta"><h3>'+esc(g.title||g.format)+'</h3>'+
         '<p>'+esc(g.format)+(n?" &middot; "+n+" ready":"")+'</p></div>'+
         '<button class="play" data-run="'+i+'">Start</button></div></div>';
    });
    var nb = nightBoard();
    if(nb.length){
      h+='<div class="card"><div class="row"><div class="meta"><h3>Tonight so far</h3>'+
         '<p>'+nb.length+(nb.length===1?" player":" players")+'</p></div>'+
         '<button class="sec" id="shownight">Put it up</button></div>'+
         nb.slice(0,8).map(function(r,i){ return '<div style="display:flex;justify-content:space-between;'+
           'padding:4px 0;color:var(--mute);font-size:15px"><span>'+(i+1)+'. '+esc(r.name)+'</span><b>'+r.score+'</b></div>'; }).join("")+
         '<button class="sec" id="resetnight" style="width:100%;margin-top:10px">Clear the scores</button></div>';
    }
    if(PARTY.status === "live"){
      h+='<div class="card"><div class="row"><div class="meta"><h3>The photos</h3>'+
         '<p>Ask everyone if they want tonight\'s album sent to them</p></div>'+
         '<button class="sec" id="askphotos">Ask the room</button></div></div>';
    }
    $("app").innerHTML=h;
    send({t:"lobby"});
  }

  /* Keep the clock honest without hammering the Worker: recompute locally from
     the end time we already hold, and only every half minute. */
  setInterval(function(){
    if(!PARTY || PARTY.status !== "live" || !PARTY.endsAt) return;
    var lic = { startsAt: Date.parse(PARTY.startsAt), endsAt: Date.parse(PARTY.endsAt) };
    var el = $("clock");
    if(el) el.textContent = PPLicence.timeLeft(lic);
    if(!PPLicence.isLive(lic)){ PARTY.status = "finished"; G = null; render(); }
  }, 30000);

  /* ------------------------------------------------------------------ bingo -- */
  function runBingo(g){
    G={ pool:[], called:[], repaint:paintBingo };
    for(var i=1;i<=90;i++) G.pool.push(i);
    // Tell the phones to build their tickets BEFORE the first ball, so nobody is
    // still staring at a lobby when a number goes up.
    send({t:"bingo"});
    send({t:"big",text:"Bingo",sub:"Grab your ticket"});
    paintBingo();
  }
  /* A claim from a phone. Without this the shout goes nowhere and the host never
     knows anybody has won. */
  function onClaim(name, kind){
    toast((name||"Someone") + (kind === "full" ? " has a full house!" : " has a line!"));
    send({t:"big", text:esc(name||"Winner"), sub: kind === "full" ? "Full house" : "Line"});
  }

  function callName(n){
    /* The bit that makes it feel like bingo rather than a number generator. */
    var names={1:"Kelly's eye",2:"One little duck",7:"Lucky seven",8:"Garden gate",
      10:"Uncle Ben",11:"Legs eleven",22:"Two little ducks",25:"Duck and dive",
      44:"Droopy drawers",55:"All the fives",66:"Clickety click",77:"Sunset strip",
      88:"Two fat ladies",90:"Top of the shop"};
    return names[n] || (n<10 ? "Number "+n : String(n).split("").join(" and ")+", "+n);
  }

  function paintBingo(){
    var last=G.called.length?G.called[G.called.length-1]:null;
    var h='<div class="caller"><div class="num">'+(last==null?"--":last)+'</div>'+
      '<div class="said">'+(last==null?"Tap to call the first number":esc(callName(last)))+'</div></div>'+
      '<button class="callbtn" id="call">'+(G.called.length?"Next number":"Start calling")+'</button>'+
      '<div class="board">';
    for(var i=1;i<=90;i++) h+='<i class="'+(G.called.indexOf(i)>=0?"hit":"")+'">'+i+'</i>';
    h+='</div><div class="bar2"><button class="sec" id="back">Back to games</button>'+
       '<button class="sec" id="again">Start over</button></div>';
    $("app").innerHTML=h;
    if(!G.pool.length){ $("call").disabled=true; $("call").textContent="All 90 called"; }
  }
  function nextBall(){
    if(!G.pool.length) return;
    var n=G.pool.splice(pick(G.pool.length),1)[0];
    G.called.push(n);
    send({t:"big",text:String(n),sub:callName(n)});
    paintBingo();
  }

  /* -------------------------------------------------- guess the photo ------- */
  /* Rounds are built from the album, which is the point: the host prepares
     nothing, and the photos are ones the room took tonight. Guesses are player
     names, so the options build themselves out of who is actually here. */
  function runPhotos(g){
    G={ mode:"photos", items:(g.config&&g.config.items)||[], i:-1, shown:false,
        answers:[], seed:Math.floor(Math.random()*1e6), repaint:paintPhotos };
    if(!G.items.length){
      $("app").innerHTML='<div class="gate"><div class="big">Nothing set up</div>'+
        '<p>Build this one from your album first: pick a few photos and say who each is.</p>'+
        '<p style="margin-top:14px"><a href="/host?code='+encodeURIComponent(CODE)+'&key='+encodeURIComponent(KEY)+'">Build it</a></p>'+
        '</div><div class="bar2"><button class="sec" id="back">Back to games</button></div>';
      return;
    }
    paintPhotos();
  }
  function photoOptions(i){
    var it=G.items[i]||{};
    var correct=String(it.a||"").trim();
    /* Decoys are other people at the party. If the answer is not somebody here,
       fall back to the other answers in the round. */
    var pool=players.filter(function(n){ return n!==correct; });
    if(pool.length<3){
      G.items.forEach(function(o,j){ if(j!==i && o.a && o.a!==correct && pool.indexOf(o.a)<0) pool.push(o.a); });
    }
    var r=(G.seed+i)>>>0;
    function rnd(){ r=(r*1103515245+12345)>>>0; return r/4294967296; }
    var picked=pool.slice().sort(function(){ return rnd()-0.5; }).slice(0,3);
    return { correct:correct,
             options:[correct].concat(picked).sort(function(){ return rnd()-0.5; }) };
  }
  function paintPhotos(){
    var it=G.items[G.i];
    var h='';
    if(G.i<0) h='<div class="gate"><div class="big">'+G.items.length+' photos</div><p>Ready when you are.</p></div>';
    else if(!it) h='<div class="gate"><div class="big">That is the lot</div></div>';
    else {
      var n=G.answers.filter(function(a){ return a.i===G.i; }).length;
      h='<div class="q"><div class="qn">'+(G.i+1)+' of '+G.items.length+
        '<span style="float:right;text-transform:none;letter-spacing:0">'+n+' of '+players.length+' guessed</span></div>'+
        '<div class="qt">'+esc(it.q||"Who is this?")+'</div>'+
        (G.shown?'<div class="qa">'+esc(it.a||"")+'</div>':'')+'</div>';
    }
    h+='<div class="bar2">'+
       (G.i>=0 && it && !G.shown ? '<button class="play" id="photoreveal" style="flex:1">Show who it is</button>' : '')+
       (G.i<0 || G.shown || !it ? '<button class="play" id="photonext" style="flex:1">'+
          (G.i<0?"First photo":(it?"Next photo":"Done"))+'</button>' : '')+
       '</div><div class="bar2"><button class="sec" id="back">Back to games</button></div>';
    $("app").innerHTML=h;
  }

  /* ------------------------------------------------------- prize draw ------- */
  /* Deliberately draws from people who are actually IN the room, not a list typed
     up earlier. The commonest way a party draw goes wrong is the winner having
     gone home an hour ago. */
  function runDraw(g){
    G={ mode:"draw", won:[], last:null, repaint:paintDraw };
    send({t:"big",text:"Prize draw",sub:"Everyone in the room is in it"});
    paintDraw();
  }
  function paintDraw(){
    var pool=players.filter(function(n){ return G.won.indexOf(n)<0; });
    var h='<div class="caller"><div class="num" style="font-size:clamp(34px,11vw,74px)">'+
      (G.last?esc(G.last):"--")+'</div><div class="said">'+
      (G.last?"That is the winner":pool.length+" in the hat")+'</div></div>';
    h+= pool.length
      ? '<button class="callbtn" id="drawnow">'+(G.won.length?"Draw another":"Draw a winner")+'</button>'
      : '<div class="q"><div class="qt">Everybody has won something. Good party.</div></div>';
    if(G.won.length){
      h+='<div class="q"><div class="qn">Winners so far</div>'+
         G.won.map(function(n,i){ return '<div style="padding:3px 0">'+(i+1)+'. '+esc(n)+'</div>'; }).join("")+'</div>';
    }
    h+='<div class="bar2"><button class="sec" id="back">Back to games</button>'+
       '<button class="sec" id="drawreset">Start over</button></div>';
    $("app").innerHTML=h;
  }
  function drawWinner(){
    var pool=players.filter(function(n){ return G.won.indexOf(n)<0; });
    if(!pool.length) return;
    var w=pool[pick(pool.length)];
    G.won.push(w); G.last=w;
    send({t:"big",text:esc(w),sub:"Come and get it"});
    paintDraw();
  }

  /* --------------------------------------------------------- playlist ------- */
  /* We show the queue. We do NOT play anything: PartyPlay supplies no music and
     no lyrics, which is what keeps a private party out of licensing entirely. */
  function runPlaylist(g){
    G={ mode:"playlist", songs:[], repaint:paintPlaylist };
    send({t:"ask-text", kind:"song", title:"Add a song",
          hint:"Whatever you want to hear. Add as many as you like."});
    send({t:"big",text:"The playlist",sub:"Add songs on your phone"});
    paintPlaylist();
  }
  function paintPlaylist(){
    var h='<div class="q"><div class="qn">The queue<span style="float:right;text-transform:none;'+
      'letter-spacing:0">'+G.songs.length+'</span></div>'+
      (G.songs.length? G.songs.map(function(s,i){
        return '<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;'+
          (s.played?"opacity:.4;text-decoration:line-through":"")+'">'+
          '<span>'+esc(s.title)+'</span><span style="color:var(--faint);font-size:13px">'+esc(s.by)+'</span></div>';
      }).join("") : '<div class="qt" style="font-size:16px;font-weight:400;color:var(--mute)">Nothing yet. It appears here as people add it.</div>')+
      '</div><div class="bar2"><button class="sec" id="back">Back to games</button>'+
      '<button class="sec" id="showqueue">Put it up</button></div>';
    $("app").innerHTML=h;
  }

  /* -------------------------------------------------- who here has ever ----- */
  function runWhoHere(g){
    G={ mode:"whohere", items:(g.config&&g.config.items)||[], i:-1, hands:[], repaint:paintWhoHere };
    paintWhoHere();
  }
  function paintWhoHere(){
    var it=G.items[G.i];
    var h='';
    if(G.i<0) h='<div class="gate"><div class="big">'+G.items.length+' to get through</div><p>Ready when you are.</p></div>';
    else if(!it) h='<div class="gate"><div class="big">That is the lot</div></div>';
    else {
      var hands=G.hands.filter(function(x){ return x.i===G.i; });
      h='<div class="q"><div class="qn">'+(G.i+1)+' of '+G.items.length+'</div>'+
        '<div class="qt">'+esc(it.q)+'</div>'+
        '<div class="qa">'+(hands.length? hands.map(function(x){return esc(x.name);}).join(", ")
          : "Nobody yet")+'</div></div>';
    }
    h+='<div class="bar2">'+
       (G.i<0 || !it ? '' : '<button class="sec" id="whonext" style="flex:1">Next one</button>')+
       (G.i<0 ? '<button class="play" id="whonext" style="flex:1">Start</button>' : '')+
       '</div><div class="bar2"><button class="sec" id="back">Back to games</button></div>';
    $("app").innerHTML=h;
  }

  /* ---------------------------------------------------------- charades ------
     The word must reach exactly one phone and no screen at all. It is broadcast
     with the actor's name attached and every other phone throws it away, which
     is honest enough for a lounge room: nobody is going to read the network
     traffic at their mate's fortieth. The television is told who is acting and
     nothing else. */
  function runCharades(g){
    G={ mode:"charades", items:(g.config&&g.config.items)||[], i:-1, actor:null, got:[],
        repaint:paintCharades, resend:resendCharades };
    warnScreens("charades");
    paintCharades();
  }
  function nextActor(){
    /* Straight around the room in join order, so nobody is picked twice before
       everybody has had a go, and nobody has to volunteer. */
    if(!players.length) return null;
    var used=G.got.length;
    return players[used % players.length];
  }
  function paintCharades(){
    var it=G.items[G.i], h='';
    if(G.i<0){
      h='<div class="gate"><div class="big">'+G.items.length+' to act out</div>'+
        '<p>One phone gets the word. Nothing goes on the telly, so turn any screen '+
        'the actor can see away from them.</p></div>'+
        '<button class="callbtn" id="charstart"'+(players.length?'':' disabled')+'>'+
        (players.length? 'Start' : 'Waiting for someone to join')+'</button>';
    } else if(!it){
      h='<div class="gate"><div class="big">That is the lot</div></div>';
    } else {
      h='<div class="q"><div class="qn">'+(G.i+1)+' of '+G.items.length+'</div>'+
        '<div class="qt">'+esc(it.q)+'</div>'+
        '<div class="qa">'+esc(G.actor||"nobody")+' is acting it out</div></div>'+
        '<div class="bar2">'+
        '<button class="play" id="charnext" style="flex:1">Got it</button>'+
        '<button class="sec" id="charskip" style="flex:1">Skip</button></div>';
    }
    h+='<div class="bar2"><button class="sec" id="back">Back to games</button></div>';
    $("app").innerHTML=h;
  }
  /* Say the current round again, for a phone that has only just joined. Safe to
     repeat: every phone works out what to show from the same message, so the
     actor sees the word again and everybody else sees who to watch again. */
  function resendCharades(){
    var it = G.items[G.i];
    if(!it || !G.actor) return;
    send({t:"charades", i:G.i, of:G.items.length, word:it.q, actor:G.actor});
  }
  function charadesGo(){
    G.i++;
    var it=G.items[G.i];
    if(!it){ send({t:"big",text:"Charades done",sub:""}); paintCharades(); return; }
    G.actor=nextActor();
    G.got.push(G.actor);
    // The word goes to the phones, tagged with whose it is. The TV gets the name only.
    send({t:"charades", i:G.i, of:G.items.length, word:it.q, actor:G.actor});
    send({t:"big", text:(G.actor||"Someone")+" is acting", sub:"Shout your guesses"});
    paintCharades();
  }

  /* ----------------------------------------------------------- who am I? ----
     The mirror image of charades. The answer goes on the big screen so the whole
     room can see it, and on every phone EXCEPT the person guessing. They ask yes
     or no questions out loud. The only way this fails is the guesser looking at
     the telly, so say so, twice. */
  function runGuessWho(g){
    G={ mode:"guesswho", items:(g.config&&g.config.items)||[], i:-1, guesser:null, done:[],
        repaint:paintGuessWho, resend:resendGuessWho };
    warnScreens("guesswho");
    paintGuessWho();
  }
  function paintGuessWho(){
    var it=G.items[G.i], h='';
    if(G.i<0){
      h='<div class="gate"><div class="big">'+G.items.length+' to guess</div>'+
        '<p>The answer goes on the big screen and on every phone but theirs. '+
        'Sit them with their back to it.</p></div>'+
        '<button class="callbtn" id="gwstart"'+(players.length?'':' disabled')+'>'+
        (players.length? 'Start' : 'Waiting for someone to join')+'</button>';
    } else if(!it){
      h='<div class="gate"><div class="big">That is the lot</div></div>';
    } else {
      h='<div class="q"><div class="qn">'+(G.i+1)+' of '+G.items.length+'</div>'+
        '<div class="qt">'+esc(it.q)+'</div>'+
        '<div class="qa">'+esc(G.guesser||"nobody")+' is guessing</div></div>'+
        '<div class="bar2">'+
        '<button class="play" id="gwnext" style="flex:1">Got it</button>'+
        '<button class="sec" id="gwpass" style="flex:1">Pass</button></div>';
    }
    h+='<div class="bar2"><button class="sec" id="back">Back to games</button></div>';
    $("app").innerHTML=h;
  }
  function resendGuessWho(){
    var it = G.items[G.i];
    if(!it || !G.guesser) return;
    send({t:"guesswho", i:G.i, of:G.items.length, answer:it.q, guesser:G.guesser});
  }
  function guessWhoGo(){
    G.i++;
    var it=G.items[G.i];
    if(!it){ send({t:"big",text:"That is the lot",sub:""}); paintGuessWho(); return; }
    if(!players.length){ toast("Nobody has joined yet"); G.i--; return; }
    G.guesser=players[G.done.length % players.length];
    G.done.push(G.guesser);
    send({t:"guesswho", i:G.i, of:G.items.length, answer:it.q, guesser:G.guesser});
    send({t:"big", text:it.q, sub:esc(G.guesser||"They")+", eyes off the screen"});
    paintGuessWho();
  }

  /* Both games are ruined by a screen the player can see, and a host reading a
     line of small print on a busy night will miss it. So it is a thing you have
     to tap past, once, before the first round. */
  function warnScreens(kind){
    var who = kind==="charades" ? "the person acting" : "the person guessing";
    var why = kind==="charades"
      ? "The word goes to their phone only. Nothing appears on the television."
      : "The answer goes on the television and on everyone else's phone.";
    send({t:"big", text:"Screens off", sub:"for "+who});
    var w=document.createElement("div");
    w.className="ask";
    w.innerHTML='<div class="askbox"><h3>Before you start</h3>'+
      '<p>'+why+' Make sure '+who+' cannot see any screen: turn their phone face '+
      'down, or sit them with their back to the telly.</p>'+
      '<div class="row2"><button id="warnok">Got it</button></div></div>';
    document.body.appendChild(w);
    w.querySelector("#warnok").addEventListener("click", function(){ try{ w.remove(); }catch(e){} });
  }

  /* What each person earned across the whole of two truths and a lie.

     This was written inline and threw its own answer away: it added the points up
     per player, then Object.keys() kept only the NAMES and the map handed
     everybody a flat hundred. Somebody who spotted five lies finished the night
     level with somebody who spotted one. Out here as a named function so it can
     be tested, which is the other half of why it went unnoticed. */
  function truthsTally(votes){
    var by = (votes||[]).reduce(function(a, v){
      if(v && v.right && v.name) a[v.name] = (a[v.name] || 0) + PPQuiz.CORRECT_POINTS;
      return a;
    }, {});
    return Object.keys(by).map(function(n){ return { name:n, score:by[n] }; });
  }

  /* ------------------------------------------- two truths and a lie --------- */
  /* Two phases. Everyone writes their three first, because doing it person by
     person leaves twenty people watching one person type. */
  function runTruths(g){
    G={ mode:"truths", phase:"collect", subs:[], turn:-1, votes:[], repaint:paintTruths };
    send({t:"ask-truths"});
    send({t:"big",text:"Two truths and a lie",sub:"Write yours on your phone"});
    paintTruths();
  }
  function paintTruths(){
    var h='';
    if(G.phase==="collect"){
      h='<div class="gate"><div class="big">'+G.subs.length+' of '+players.length+' ready</div>'+
        '<p>Everyone writes two true things and one lie. Start when enough of them have.</p></div>'+
        '<button class="callbtn" id="truthsgo"'+(G.subs.length<2?' disabled':'')+'>'+
        (G.subs.length<2?"Waiting for two people":"Start reading them out")+'</button>';
    } else {
      var t=G.subs[G.turn];
      if(!t){
        var tally={};
        G.votes.forEach(function(v){ if(v.right) tally[v.name]=(tally[v.name]||0)+PPQuiz.CORRECT_POINTS; });
        var board=Object.keys(tally).map(function(n){return {name:n,score:tally[n]};})
          .sort(function(a,b){return b.score-a.score;});
        h='<div class="gate"><div class="big">Done</div></div>';
        if(board.length) h+='<div class="q"><div class="qn">Best liar spotters</div>'+
          board.slice(0,8).map(function(r,i){ return '<div style="display:flex;justify-content:space-between;padding:3px 0">'+
            '<span>'+(i+1)+'. '+esc(r.name)+'</span><b>'+r.score+'</b></div>'; }).join("")+'</div>';
      } else {
        var v=G.votes.filter(function(x){ return x.turn===G.turn; });
        h='<div class="q"><div class="qn">'+(G.turn+1)+' of '+G.subs.length+
          '<span style="float:right;text-transform:none;letter-spacing:0">'+v.length+' voted</span></div>'+
          '<div class="qt">'+esc(t.name)+'</div>'+
          t.lines.map(function(line,i){
            return '<div class="qa" style="color:'+(G.shown && i===t.lie ? "var(--pink)":"var(--mute)")+'">'+
              (i+1)+'. '+esc(line)+(G.shown && i===t.lie ? "  &larr; the lie" : "")+'</div>'; }).join("");
        h+='</div>';
      }
      h+='<div class="bar2">'+
         (t && !G.shown ? '<button class="play" id="truthreveal" style="flex:1">Show the lie</button>' : '')+
         (!t || G.shown ? '<button class="play" id="truthnext" style="flex:1">'+(t?"Next person":"Done")+'</button>' : '')+
         '</div>';
    }
    h+='<div class="bar2"><button class="sec" id="back">Back to games</button></div>';
    $("app").innerHTML=h;
  }

  /* --------------------------------------------------- heads or tails -------- */
  /* The pub version makes you stand up and touch your head, which quietly rules
     out anyone who cannot easily do either. On a phone everybody plays. */
  function runHeads(g){
    G={ mode:"heads", round:0, inPlay:players.slice(), picks:{}, last:null, repaint:paintHeads };
    send({t:"heads", round:0});
    send({t:"big", text:"Heads or tails", sub:"Pick one on your phone"});
    paintHeads();
  }
  function paintHeads(){
    var picked=Object.keys(G.picks).length;
    var h='<div class="caller"><div class="num" style="font-size:clamp(40px,14vw,90px)">'+
      (G.last? (G.last==="heads"?"HEADS":"TAILS") : "--")+'</div>'+
      '<div class="said">'+(G.last? G.last+" wins the round" : "Waiting on picks")+'</div></div>'+
      '<div class="q"><div class="qn">Still in</div><div class="qt">'+G.inPlay.length+
      '<span style="float:right;font-size:15px;font-weight:400;color:var(--faint)">'+
      picked+' of '+G.inPlay.length+' picked</span></div></div>';
    if(G.inPlay.length<=1){
      h+='<div class="q"><div class="qn">Winner</div><div class="qt">'+
         (G.inPlay.length? esc(G.inPlay[0]) : "Nobody, everyone went out together")+'</div></div>';
    } else {
      h+='<button class="callbtn" id="flip">Flip it</button>';
    }
    h+='<div class="bar2"><button class="sec" id="back">Back to games</button>'+
       '<button class="sec" id="hstart">Start again</button></div>';
    $("app").innerHTML=h;
  }
  function flip(){
    var side = pick(2) ? "tails" : "heads";
    G.last = side;
    /* Anyone who did not pick stays in. Knocking out the guest who was at the bar
       is the fastest way to have someone stop playing for the night. */
    var out = G.inPlay.filter(function(n){ return G.picks[n] && G.picks[n] !== side; });
    G.inPlay = G.inPlay.filter(function(n){ return out.indexOf(n) < 0; });
    G.picks = {}; G.round++;
    send({t:"heads", round:G.round, result:side, out:out, inPlay:G.inPlay.slice()});
    if(G.inPlay.length<=1){
      var w = G.inPlay[0];
      if(w){ nightAdd([{name:w, score:PPQuiz.CORRECT_POINTS}]); }
      send({t:"big", text: w?esc(w):"All out", sub: w?"Heads or tails winner":""});
    } else {
      send({t:"big", text:side.toUpperCase(), sub:G.inPlay.length+" still in"});
    }
    paintHeads();
  }

  /* ----------------------------------------------------------------- trivia -- */
  function runTrivia(g){
    // One seed for the night, so the host, the television and every phone build
    // the same four options in the same order without sending them three times.
    G={ items:(g.config&&g.config.items)||[], i:-1, shown:false, answers:[],
        seed: Math.floor(Math.random()*1e6), title:(g.title||"Trivia"), repaint:paintTrivia };
    paintTrivia();
  }
  function answeredCount(){
    return G.answers.filter(function(a){ return a.i===G.i; }).length;
  }
  function board(){ return PPQuiz.score(G.answers, G.items, G.seed); }
  function paintTrivia(){
    var it=G.items[G.i];
    var h='';
    if(G.i<0){
      h='<div class="gate"><div class="big">'+esc(G.items.length)+' questions</div><p>Ready when you are.</p></div>';
    } else if(!it){
      h='<div class="gate"><div class="big">That is the lot</div><p>All '+G.items.length+' done.</p></div>';
    } else {
      h='<div class="q"><div class="qn">Question '+(G.i+1)+' of '+G.items.length+
        '<span style="float:right;text-transform:none;letter-spacing:0">'+
        answeredCount()+' of '+players.length+' answered</span></div>'+
        '<div class="qt">'+esc(it.q)+'</div>'+
        (G.shown?'<div class="qa">'+esc(it.a||"")+'</div>':'')+'</div>';
      if(G.shown){
        var b=board().slice(0,6);
        if(b.length){
          h+='<div class="q"><div class="qn">Scores</div>'+
             b.map(function(r,i){ return '<div style="display:flex;justify-content:space-between;padding:3px 0">'+
               '<span>'+(i+1)+'. '+esc(r.name)+'</span><b>'+r.score+'</b></div>'; }).join("")+'</div>';
        }
      }
    }
    h+='<div class="bar2">'+
       (G.i>=0 && it && !G.shown ? '<button class="play" id="reveal" style="flex:1">Show the answer</button>' : '')+
       (G.i<0 || G.shown || !it ? '<button class="play" id="next" style="flex:1">'+(G.i<0?"First question":(it?"Next question":"Done"))+'</button>' : '')+
       '</div><div class="bar2"><button class="sec" id="back">Back to games</button></div>';
    $("app").innerHTML=h;
  }

  document.addEventListener("click",function(ev){
    var el=ev.target.closest?ev.target.closest("[data-run],#call,#back,#again,#reveal,#next,#shownight,#resetnight,#flip,#hstart"):null;
    if(!el) return;
    if(el.hasAttribute("data-run")){
      var g=GAMES[+el.getAttribute("data-run")];
      if(g.format==="bingo90") runBingo(g);
      else if(g.format==="trivia"||g.format==="howwell") runTrivia(g);
      else if(g.format==="headstails") runHeads(g);
      else if(g.format==="draw") runDraw(g);
      else if(g.format==="playlist") runPlaylist(g);
      else if(g.format==="whohere") runWhoHere(g);
      else if(g.format==="truths") runTruths(g);
      else if(g.format==="photos") runPhotos(g);
      else if(g.format==="charades") runCharades(g);
      else if(g.format==="guesswho") runGuessWho(g);
      else { send({t:"big",text:esc(g.title||g.format),sub:"Off we go"}); toast("Running "+(g.title||g.format)); }
      return;
    }
    if(el.id==="charstart" || el.id==="charnext"){ charadesGo(); return; }
    if(el.id==="charskip"){ G.got.pop(); charadesGo(); return; }   // a skip should not use up their turn
    if(el.id==="gwstart" || el.id==="gwnext"){ guessWhoGo(); return; }
    if(el.id==="gwpass"){ G.done.pop(); guessWhoGo(); return; }
    if(el.id==="startnow"){ startClock(); return; }
    if(el.id==="photoreveal"){
      G.shown=true;
      var pit=G.items[G.i], po=photoOptions(G.i);
      var right=G.answers.filter(function(a){ return a.i===G.i && a.answer===po.correct; });
      send({t:"photoresult", i:G.i, correct:po.correct,
            board:right.map(function(a){ return {name:a.name, score:PPQuiz.CORRECT_POINTS}; })});
      send({t:"big", text:esc(po.correct), sub:right.length+(right.length===1?" got it":" got it")});
      paintPhotos(); return;
    }
    if(el.id==="photonext"){
      G.i++; G.shown=false;
      var nit=G.items[G.i];
      if(nit){
        var no=photoOptions(G.i);
        send({t:"photo", i:G.i, q:nit.q||"Who is this?", url:nit.url||"",
              options:no.options, n:G.i+1, of:G.items.length});
        send({t:"photoscreen", url:nit.url||"", q:nit.q||"Who is this?", n:G.i+1, of:G.items.length});
      } else {
        var tally={};
        G.answers.forEach(function(a){
          if(a.answer===photoOptions(a.i).correct) tally[a.name]=(tally[a.name]||0)+PPQuiz.CORRECT_POINTS; });
        var fin=Object.keys(tally).map(function(n){return {name:n,score:tally[n]};})
          .sort(function(a,b){return b.score-a.score;});
        if(!G.banked){ nightAdd(fin); G.banked=true; }
        send({t:"final", board:fin.slice(0,10), night:nightBoard().slice(0,10)});
        send({t:"big", text:fin.length?esc(fin[0].name):"Done", sub:fin.length?fin[0].score+" points":""});
      }
      paintPhotos(); return;
    }
    if(el.id==="drawnow"){ drawWinner(); return; }
    if(el.id==="drawreset"){ runDraw(); return; }
    if(el.id==="showqueue"){
      send({t:"queue", songs:G.songs.map(function(s){ return {t:s.title,by:s.by}; }), big:true});
      toast("On the screen"); return;
    }
    if(el.id==="whonext"){
      G.i++;
      var it=G.items[G.i];
      if(it) send({t:"hands", i:G.i, q:it.q});
      else send({t:"lobby"});
      send({t:"big", text: it?esc(it.q):"That is the lot", sub: it?"Tap if it is you":""});
      paintWhoHere(); return;
    }
    if(el.id==="truthsgo"){
      G.phase="play"; G.turn=0; G.shown=false;
      var t0=G.subs[0];
      send({t:"truthvote", turn:0, name:t0.name, lines:t0.lines});
      send({t:"big", text:esc(t0.name), sub:"Which one is the lie?"});
      paintTruths(); return;
    }
    if(el.id==="truthreveal"){
      G.shown=true;
      var tt=G.subs[G.turn];
      send({t:"truthresult", turn:G.turn, lie:tt.lie, line:tt.lines[tt.lie]});
      send({t:"big", text:esc(tt.lines[tt.lie]), sub:"was the lie"});
      paintTruths(); return;
    }
    if(el.id==="truthnext"){
      G.turn++; G.shown=false;
      var tn=G.subs[G.turn];
      if(tn){ send({t:"truthvote", turn:G.turn, name:tn.name, lines:tn.lines});
              send({t:"big", text:esc(tn.name), sub:"Which one is the lie?"}); }
      else { send({t:"lobby"}); nightAdd(truthsTally(G.votes)); }
      paintTruths(); return;
    }
    if(el.id==="askphotos"){ send({t:"askphotos"}); toast("Asked everyone"); return; }
    if(el.id==="shownight"){ send({t:"board", title:"Tonight", rows:nightBoard().slice(0,12)}); toast("On the screen"); return; }
    if(el.id==="resetnight"){
      if(!window.confirm("Clear tonight's scores? The games stay, only the running total goes.")) return;
      NIGHT={}; nightSave(); render(); toast("Scores cleared"); return;
    }
    if(el.id==="call"){ nextBall(); return; }
    if(el.id==="again"){ runBingo(); return; }
    if(el.id==="flip"){ flip(); return; }
    if(el.id==="hstart"){ runHeads(); return; }
    if(el.id==="back"){ G=null; render(); return; }
    if(el.id==="reveal"){
      G.shown=true;
      var it=G.items[G.i];
      var o=PPQuiz.options(G.items,G.i,G.seed);
      // Tell the phones what was right, so each guest sees their own result
      // rather than having to find themselves on a list on the television.
      send({t:"result", i:G.i, correct:o.correct, board:board().slice(0,10)});
      send({t:"big", text:esc(it.a||""), sub:it.q});
      paintTrivia(); return; }
    if(el.id==="next"){
      G.i++; G.shown=false;
      var it2=G.items[G.i];
      if(it2){
        var o2=PPQuiz.options(G.items,G.i,G.seed);
        send({t:"ask", i:G.i, q:it2.q, options:o2.options, n:G.i+1, of:G.items.length});
        send({t:"big", text:esc(it2.q), sub:"Question "+(G.i+1)+" of "+G.items.length});
      } else {
        var fin=board();
        // Bank it once. G.banked stops a host who taps Next again at the end from
        // adding the same round to the night twice.
        if(!G.banked){ nightAdd(fin); G.banked=true; }
        send({t:"final", board:fin.slice(0,10), night:nightBoard().slice(0,10)});
        send({t:"big", text: fin.length?esc(fin[0].name):"That is the lot",
              sub: fin.length? fin[0].score+" points" : ""});
      }
      paintTrivia(); return;
    }
  });

  if(navigator.wakeLock) navigator.wakeLock.request("screen").catch(function(){});
  load();
})();
</script>
</body>
</html>
