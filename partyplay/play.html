<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Play | PartyPlay</title>
<link rel="icon" href="/logos/partyplay-appicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#12101A;--ink2:#1B1826;--paper:#FFF1E6;--mute:#B6ADC2;--faint:#847A98;
    --pink:#FF1F8E;--teal:#17C4B4;--yellow:#FFD23F;--line:rgba(255,241,230,.14)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:Manrope,system-ui,sans-serif;
    font-size:17px;-webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:520px;margin:0 auto;padding:26px 20px 60px}
  h1,h2{font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
  .mark{width:56px;height:48px;display:block;margin:0 auto 14px}
  h1{font-size:30px;text-align:center}
  .sub{color:var(--mute);text-align:center;margin:8px 0 26px}
  label{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
  input{width:100%;padding:15px;border-radius:12px;border:1px solid var(--line);background:var(--ink2);
    color:var(--paper);font:inherit;font-size:17px}
  /* Codes go in as capitals whatever the phone thinks, and the number pad never
     appears for a code that has letters in it. */
  #code{text-transform:uppercase;letter-spacing:.22em;font-family:'Hanken Grotesk',sans-serif;
    font-weight:800;font-size:26px;text-align:center}
  input:focus{outline:2px solid var(--pink);outline-offset:1px}
  button.go{width:100%;padding:16px;margin-top:18px;border:0;border-radius:12px;background:var(--pink);
    color:#fff;font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:18px;cursor:pointer}
  button.go:disabled{background:#2A2438;color:var(--faint)}
  .err{background:rgba(255,90,110,.12);border:1px solid rgba(255,90,110,.4);border-radius:12px;
    padding:13px 15px;color:#FFC2CC;margin-top:14px;font-size:15.5px}
  .field{margin-bottom:16px}
  .waiting{text-align:center;padding:40px 0;color:var(--mute)}
  .waiting .who{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:24px;color:var(--paper);
    margin-bottom:6px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);margin-right:7px}

  .called{text-align:center;margin:6px 0 14px}
  .called .n{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:56px;line-height:1;color:var(--pink)}
  .called .s{color:var(--mute);font-size:15px;min-height:20px}
  .ticket{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:0 0 12px}
  .ticket b{font-weight:400;aspect-ratio:1;display:grid;place-items:center;border-radius:8px;
    background:var(--ink2);border:1px solid var(--line);font-family:'Hanken Grotesk',sans-serif;
    font-weight:800;font-size:clamp(13px,4.2vw,20px);cursor:pointer;user-select:none;
    font-variant-numeric:tabular-nums}
  .ticket b.blank{background:transparent;border-color:transparent;cursor:default}
  .ticket b.on{background:var(--pink);border-color:var(--pink);color:#fff}
  /* Called but not yet tapped. Outlined, not filled: it is a nudge, not a mark,
     and filling it would be marking the card for them. */
  .ticket b.miss{border-color:var(--yellow);border-style:dashed;color:var(--yellow)}
  .hint2{background:rgba(255,210,63,.1);border:1px solid rgba(255,210,63,.35);border-radius:11px;
    padding:11px 14px;color:#FFE9A8;font-size:15px;margin-bottom:12px}
  .claim{width:100%;padding:16px;border:0;border-radius:13px;background:var(--teal);color:#06231F;
    font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:18px;cursor:pointer}
  .status{text-align:center;color:var(--faint);font-size:14.5px;margin-top:10px}

  .qn2{color:var(--faint);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    text-align:center;margin-bottom:8px}
  .qt2{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:23px;text-align:center;margin-bottom:20px}
  .opts{display:grid;gap:10px}
  .opts button{padding:17px 16px;border-radius:13px;border:1px solid var(--line);background:var(--ink2);
    color:var(--paper);font:inherit;font-size:17px;font-weight:700;cursor:pointer;text-align:left}
  .opts button:disabled{cursor:default}
  .opts button.mine{border-color:var(--pink);background:rgba(255,31,142,.14)}
  .opts button.right{border-color:var(--teal);background:rgba(23,196,180,.16)}
  .opts button.wrong{opacity:.45}
  .verdict{text-align:center;font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:22px;margin:18px 0 4px}
  .verdict.yes{color:var(--teal)} .verdict.no{color:var(--mute)}
  .tin{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--ink2);
    color:var(--paper);font:inherit;font-size:16.5px;margin-bottom:9px}
  .tin:focus{outline:2px solid var(--pink);outline-offset:1px}
  .tgo{width:100%;padding:15px;border:0;border-radius:12px;background:var(--pink);color:#fff;
    font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:17px;cursor:pointer}
  .tgo:disabled{background:#2A2438;color:var(--faint)}
  .lielabel{display:flex;gap:9px;align-items:center;color:var(--mute);font-size:14.5px;margin:-2px 0 12px}
  .lielabel input{width:18px;height:18px;accent-color:var(--pink)}
  .lb{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  .lb div{display:flex;justify-content:space-between;padding:5px 0;color:var(--mute);font-size:15.5px}
  .lb div.me{color:var(--paper);font-weight:700}

  /* The camera lives in a corner, on every screen, all night. Burying it in a
     menu means it gets used once by the host and never by anyone else. */
  .cam{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
    width:58px;height:58px;border-radius:50%;border:0;background:var(--pink);color:#fff;
    font-size:25px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:20}
  .cam:disabled{opacity:.6}
  .camnote{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(22px + env(safe-area-inset-bottom));background:var(--ink3);border:1px solid var(--line);
    border-radius:22px;padding:9px 17px;font-size:14.5px;opacity:0;transition:opacity .2s;
    pointer-events:none;z-index:21;max-width:80vw;text-align:center}
  .camnote.show{opacity:1}

  .ask{position:fixed;inset:0;background:rgba(6,4,10,.78);display:grid;place-items:end center;z-index:30;padding:16px}
  .askbox{background:var(--ink2);border:1px solid var(--line);border-radius:20px;padding:24px 22px;
    width:100%;max-width:440px;margin-bottom:env(safe-area-inset-bottom)}
  .askbox h3{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:22px;margin:0 0 6px}
  .askbox p{color:var(--mute);margin:0 0 16px;font-size:15.5px}
  .askbox input[type=email]{width:100%;padding:14px;border-radius:11px;border:1px solid var(--line);
    background:var(--ink);color:var(--paper);font:inherit;font-size:16.5px}
  .askbox .tick{display:flex;gap:10px;align-items:flex-start;margin-top:13px;color:var(--mute);font-size:14.5px}
  .askbox .tick input{width:19px;height:19px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--pink)}
  .askbox .row2{display:flex;gap:9px;margin-top:16px}
  .askbox button{flex:1 1 0;padding:14px;border-radius:11px;border:0;background:var(--pink);color:#fff;
    font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:16px;cursor:pointer}
  .askbox button.no{background:none;border:1px solid var(--line);color:var(--mute);flex:0 0 auto;padding:14px 18px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="camfile" accept="image/*" capture="environment" hidden multiple>
<button class="cam" id="cam" hidden title="Add a photo to the party album">&#128247;</button>
<div class="camnote" id="camnote"></div>

<script src="/lib/pp-config.js"></script>
<script src="/lib/pp-ticket.js"></script>
<script src="/lib/pp-quiz.js"></script>
<script src="/lib/pp-photo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  var API = PPConfig.API;
  var SUPA_URL  = PPConfig.SUPA_URL;
  var SUPA_ANON = PPConfig.SUPA_ANON;
  var $ = function(id){ return document.getElementById(id); };
  var qs = new URLSearchParams(location.search);

  /* localStorage, not sessionStorage. A phone backgrounded for an hour at a party
     discards the tab, and sessionStorage goes with it: the guest would come back
     as a brand new player with no score. */
  var SAVE = "ppPlayer";
  function load(){ try{ return JSON.parse(localStorage.getItem(SAVE)||"null"); }catch(e){ return null; } }
  function save(o){ try{ localStorage.setItem(SAVE, JSON.stringify(o)); }catch(e){} }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

  function api(path, opts){
    return fetch(API+path, Object.assign({ headers:{ "content-type":"application/json" } }, opts||{}))
      .then(function(r){ return r.json().then(function(j){
        if(!r.ok) throw new Error(j&&j.error ? j.error : "Something went wrong"); return j; }); });
  }

  function joinScreen(prefillCode, err){
    var saved = load() || {};
    $("app").innerHTML =
      '<img class="mark" src="/logos/partyplay-mark.svg" alt="">' +
      '<h1>Join the party</h1><p class="sub">Whatever is on the telly, put the code in.</p>' +
      '<div class="field"><label for="code">Party code</label>' +
      '<input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" ' +
      'inputmode="text" maxlength="9" value="' + esc(prefillCode||"") + '"></div>' +
      '<div class="field"><label for="name">Your name</label>' +
      '<input id="name" autocomplete="nickname" maxlength="24" value="' + esc(saved.nickname||"") + '"></div>' +
      '<button class="go" id="go">Join</button>' +
      (err ? '<div class="err">' + esc(err) + '</div>' : '');
    $("go").addEventListener("click", doJoin);
    $("code").addEventListener("keydown", function(e){ if(e.key==="Enter") $("name").focus(); });
    $("name").addEventListener("keydown", function(e){ if(e.key==="Enter") doJoin(); });
    ($("code").value ? $("name") : $("code")).focus();
  }

  function doJoin(){
    var code = ($("code").value||"").trim(), nickname = ($("name").value||"").trim();
    if(!code) return joinScreen(code, "Put in the code from the screen.");
    if(!nickname) return joinScreen(code, "Put in a name so everyone knows who you are.");
    $("go").disabled = true; $("go").textContent = "Joining...";
    api("/join", { method:"POST", body: JSON.stringify({ code:code, nickname:nickname }) })
      .then(function(j){
        save({ code:code.toUpperCase(), nickname:j.nickname, token:j.token });
        waiting(j.nickname);
        showCamera();
        connect(code.toUpperCase(), j.nickname);
      })
      .catch(function(e){ joinScreen(code, e.message); });
  }

  function waiting(nickname){
    $("app").innerHTML =
      '<img class="mark" src="/logos/partyplay-mark.svg" alt="">' +
      '<div class="waiting"><div class="who">' + esc(nickname) + '</div>' +
      '<p><span class="dot"></span>You are in. Watch the big screen.</p></div>';
  }

  function connect(code, nickname){
    if(!SUPA_ANON) return;
    try{
      var client = supabase.createClient(SUPA_URL, SUPA_ANON);
      var ch = client.channel(PPConfig.channel(code), { config:{ broadcast:{ self:false } } });
      ch.on("broadcast", { event:"msg" }, function(e){ onMsg(e.payload); });
      ch.subscribe(function(s){
        if(s === "SUBSCRIBED") ch.send({ type:"broadcast", event:"msg", payload:{ t:"hello", name:nickname } });
      });
      window._ppSend = function(o){ try{ ch.send({ type:"broadcast", event:"msg", payload:o }); }catch(e){} };
    }catch(e){}
  }

  /* Bingo state. `called` is what the host has called, `marked` is what THIS
     guest has actually tapped. Keeping them apart is the whole game: the app
     knowing a number was called is not the same as the player noticing. */
  var B = null;   // bingo
  var Q = null;   // the question on screen right now
  var H = null;   // heads or tails
  var T = null;   // text prompt: a song, or three statements
  var W = null;   // who here has ever
  var V = null;   // voting on somebody's two truths

  function bingoStart(){
    var s = load() || {};
    if(!s.token) return;
    B = { grid: PPTicket.build(s.token), called: [], marked: {}, last: null, lastSaid: "" };
    // Marks survive a reload, because a phone at a party gets reloaded.
    try{
      var keep = JSON.parse(localStorage.getItem("ppBingo:"+s.code) || "null");
      if(keep && keep.token === s.token){ B.marked = keep.marked || {}; B.called = keep.called || []; }
    }catch(e){}
    paintBingo();
  }
  function bingoSave(){
    var s = load() || {};
    try{ localStorage.setItem("ppBingo:"+s.code,
      JSON.stringify({ token:s.token, marked:B.marked, called:B.called })); }catch(e){}
  }

  function paintBingo(){
    if(!B) return;
    var p = PPTicket.progress(B.grid, Object.keys(B.marked).map(Number));
    var h = '<div class="called"><div class="n">' + (B.last==null ? "--" : B.last) + '</div>' +
            '<div class="s">' + esc(B.lastSaid||"") + '</div></div>';

    /* Only nudge when they are close. A permanent glow on every called number is
       just marking the card for them, and then it is not a game. */
    var missed = [];
    B.grid.forEach(function(row){ row.forEach(function(n){
      if(n && B.called.indexOf(n)>=0 && !B.marked[n]) missed.push(n); }); });
    if(p.bestLineNeeds<=2 && p.bestLineNeeds>0 && missed.length){
      h += '<div class="hint2">' + (missed.length===1 ? missed[0] + " has been called" :
           missed.slice(0,3).join(", ") + " have been called") + ' and you have not marked ' +
           (missed.length===1 ? "it" : "them") + '.</div>';
    }

    h += '<div class="ticket">';
    B.grid.forEach(function(row){
      row.forEach(function(n){
        if(!n){ h += '<b class="blank"></b>'; return; }
        var cls = B.marked[n] ? "on" : (B.called.indexOf(n)>=0 ? "miss" : "");
        h += '<b class="' + cls + '" data-n="' + n + '">' + n + '</b>';
      });
    });
    h += '</div>';

    if(p.fullHouse) h += '<button class="claim" data-claim="full">Full house! Shout out</button>';
    else if(p.hasLine) h += '<button class="claim" data-claim="line">Line! Shout out</button>';
    else h += '<div class="status">' + p.bestLineNeeds + ' to go for a line, ' +
              p.fullHouseNeeds + ' for the full house</div>';
    $("app").innerHTML = h;
  }

  function paintQuestion(){
    var s = load()||{};
    var h = '<div class="qn2">Question ' + Q.n + ' of ' + Q.of + '</div>' +
            '<div class="qt2">' + esc(Q.q) + '</div><div class="opts">';
    Q.options.forEach(function(o){
      var cls = "";
      if(Q.correct != null){
        if(PPQuiz.isRight(o, Q.correct)) cls = "right";
        else if(o === Q.mine) cls = "mine wrong";
        else cls = "wrong";
      } else if(o === Q.mine) cls = "mine";
      h += '<button class="' + cls + '" data-opt="' + esc(o) + '"' +
           ((Q.mine != null || Q.correct != null) ? ' disabled' : '') + '>' + esc(o) + '</button>';
    });
    h += '</div>';
    if(Q.correct != null){
      var got = Q.mine != null && PPQuiz.isRight(Q.mine, Q.correct);
      h += '<div class="verdict ' + (got ? "yes" : "no") + '">' +
           (got ? "Correct" : (Q.mine == null ? "You did not answer" : "Not that one")) + '</div>';
      if(Q.board && Q.board.length){
        h += '<div class="lb">' + Q.board.map(function(r,i){
          return '<div class="' + (r.name === s.nickname ? "me" : "") + '"><span>' +
                 (i+1) + '. ' + esc(r.name) + '</span><b>' + r.score + '</b></div>'; }).join("") + '</div>';
      }
    } else if(Q.mine != null){
      h += '<div class="status">Locked in. Watch the big screen.</div>';
    }
    $("app").innerHTML = h;
  }

  function paintHeads(){
    if(H.out){
      $("app").innerHTML='<img class="mark" src="/logos/partyplay-mark.svg" alt="">'+
        '<div class="waiting"><div class="who">Out</div><p>Bad luck. Stick around for the next one.</p></div>';
      return;
    }
    var h='<div class="qn2">Heads or tails</div>'+
      '<div class="qt2">'+(H.picked? "Locked in" : "Pick one")+'</div><div class="opts">'+
      ['heads','tails'].map(function(sd){
        return '<button class="'+(H.picked===sd?"mine":"")+'" data-side="'+sd+'"'+
               (H.picked?' disabled':'')+'>'+sd.charAt(0).toUpperCase()+sd.slice(1)+'</button>'; }).join("")+
      '</div>'+(H.picked?'<div class="status">Watch the big screen.</div>':'');
    $("app").innerHTML=h;
  }

  /* One text box, used by the playlist and anything else that wants a line of
     text. Stays on screen after sending so people can add another without
     waiting to be asked again. */
  function paintText(){
    $("app").innerHTML =
      '<div class="qn2">'+esc(T.title||"")+'</div>'+
      '<div class="qt2" style="font-size:17px;font-weight:400;color:var(--mute)">'+esc(T.hint||"")+'</div>'+
      '<input class="tin" id="tval" maxlength="80" autocomplete="off">'+
      '<button class="tgo" id="tgo">Add it</button>'+
      (T.sent ? '<div class="status">'+T.sent+(T.sent===1?" added":" added")+'. Add another if you like.</div>' : '');
    var go=$("tgo"), val=$("tval");
    function send(){
      var v=(val.value||"").trim(); if(!v) return;
      var s=load()||{};
      if(window._ppSend) window._ppSend({ t:T.kind==="song"?"song":"text", name:s.nickname, text:v });
      T.sent++; paintText();
    }
    go.addEventListener("click", send);
    val.addEventListener("keydown", function(e){ if(e.key==="Enter") send(); });
    val.focus();
  }

  function paintTruthsForm(){
    if(T.done){
      $("app").innerHTML='<img class="mark" src="/logos/partyplay-mark.svg" alt="">'+
        '<div class="waiting"><div class="who">Sent</div><p>Watch the big screen and see who gets caught.</p></div>';
      return;
    }
    $("app").innerHTML =
      '<div class="qn2">Two truths and a lie</div>'+
      '<div class="qt2" style="font-size:17px;font-weight:400;color:var(--mute)">Three things about you. Two true, one not.</div>'+
      [0,1,2].map(function(i){
        return '<input class="tin" id="t'+i+'" maxlength="120" placeholder="Number '+(i+1)+'" autocomplete="off">'+
               '<label class="lielabel"><input type="radio" name="lie" value="'+i+'"'+(i===2?" checked":"")+
               '><span>this one is the lie</span></label>'; }).join("")+
      '<button class="tgo" id="tgo">Send it in</button>';
    $("tgo").addEventListener("click", function(){
      var lines=[0,1,2].map(function(i){ return ($("t"+i).value||"").trim(); });
      if(lines.some(function(x){ return !x; })){ $("t"+lines.indexOf("")).focus(); return; }
      var lie=parseInt((document.querySelector('input[name=lie]:checked')||{}).value||"2",10);
      var s=load()||{};
      if(window._ppSend) window._ppSend({ t:"truths", name:s.nickname, lines:lines, lie:lie });
      T.done=true; paintTruthsForm();
    });
    $("t0").focus();
  }

  function paintHands(){
    $("app").innerHTML =
      '<div class="qn2">Who here has ever</div>'+
      '<div class="qt2">'+esc(W.q)+'</div>'+
      '<div class="opts"><button class="'+(W.raised?"mine":"")+'" id="hand"'+(W.raised?" disabled":"")+'>'+
      (W.raised?"That is you":"That is me")+'</button></div>'+
      (W.raised?'<div class="status">Go and find someone else who did.</div>':'');
    if(!W.raised) $("hand").addEventListener("click", function(){
      var s=load()||{}; W.raised=true; paintHands();
      if(window._ppSend) window._ppSend({ t:"hand", name:s.nickname, i:W.i });
    });
  }

  function paintVote(){
    var me=(load()||{}).nickname;
    if(V.who===me){
      $("app").innerHTML='<img class="mark" src="/logos/partyplay-mark.svg" alt="">'+
        '<div class="waiting"><div class="who">Your turn</div><p>Keep a straight face.</p></div>';
      return;
    }
    var h='<div class="qn2">Which one is the lie?</div><div class="qt2">'+esc(V.who)+'</div><div class="opts">';
    V.lines.forEach(function(line,i){
      var cls="";
      if(V.lie!=null){ cls = i===V.lie ? "right" : (i===V.picked ? "mine wrong" : "wrong"); }
      else if(i===V.picked) cls="mine";
      h+='<button class="'+cls+'" data-lie="'+i+'"'+((V.picked!=null||V.lie!=null)?" disabled":"")+'>'+esc(line)+'</button>';
    });
    h+='</div>';
    if(V.lie!=null){
      var got=V.picked===V.lie;
      h+='<div class="verdict '+(got?"yes":"no")+'">'+
         (got?"Got them":(V.picked==null?"You did not vote":"They got you"))+'</div>';
    }
    $("app").innerHTML=h;
  }

  function paintFinal(b, night){
    var s = load()||{};
    var me = b.filter(function(r){ return r.name === s.nickname; })[0];
    $("app").innerHTML = '<img class="mark" src="/logos/partyplay-mark.svg" alt="">' +
      '<div class="waiting"><div class="who">' + (b.length ? esc(b[0].name) + " wins" : "All done") + '</div>' +
      (me ? '<p>You finished on ' + me.score + '.</p>' : '') + '</div>' +
      (b.length ? '<div class="lb">' + b.map(function(r,i){
        return '<div class="' + (r.name === s.nickname ? "me" : "") + '"><span>' +
               (i+1) + '. ' + esc(r.name) + '</span><b>' + r.score + '</b></div>'; }).join("") + '</div>' : "");
  }

  function onMsg(m){
    if(!m || !m.t) return;
    if(m.t === "lobby"){ B = null; Q = null; H = null; T = null; W = null; V = null; var s = load()||{}; waiting(s.nickname||""); return; }
    if(m.t === "bingo"){ Q=null; H=null; bingoStart(); return; }
    if(m.t === "ask-text"){
      B=null;Q=null;H=null;V=null;W=null;
      T={ kind:m.kind, title:m.title, hint:m.hint, sent:0 };
      paintText(); return;
    }
    if(m.t === "ask-truths"){
      B=null;Q=null;H=null;V=null;W=null;
      T={ kind:"truths", title:"Two truths and a lie", hint:"Write three things about you. Two true, one not.", sent:0 };
      paintTruthsForm(); return;
    }
    if(m.t === "hands"){
      B=null;Q=null;H=null;T=null;V=null;
      W={ i:m.i, q:m.q, raised:false }; paintHands(); return;
    }
    if(m.t === "truthvote"){
      B=null;Q=null;H=null;T=null;W=null;
      V={ turn:m.turn, who:m.name, lines:m.lines||[], picked:null, lie:null }; paintVote(); return;
    }
    if(m.t === "truthresult"){
      if(V && V.turn===m.turn){ V.lie=m.lie; paintVote(); }
      return;
    }
    if(m.t === "queue"){ return; }          // the queue is a television thing
    if(m.t === "heads"){
      B=null; Q=null;
      var me=(load()||{}).nickname;
      if(m.inPlay && m.inPlay.indexOf(me)<0 && m.round>0){ H={out:true}; paintHeads(); return; }
      H={ out:false, picked:null, round:m.round||0, result:m.result||null };
      paintHeads(); return;
    }
    if(m.t === "board"){
      var s2=load()||{};
      $("app").innerHTML='<img class="mark" src="/logos/partyplay-mark.svg" alt="">'+
        '<div class="waiting"><div class="who">'+esc(m.title||"Scores")+'</div></div>'+
        '<div class="lb">'+(m.rows||[]).map(function(r,i){
          return '<div class="'+(r.name===s2.nickname?"me":"")+'"><span>'+(i+1)+'. '+esc(r.name)+
                 '</span><b>'+r.score+'</b></div>'; }).join("")+'</div>';
      return;
    }
    if(m.t === "ask"){ B=null; H=null; Q={ i:m.i, q:m.q, options:m.options||[], n:m.n, of:m.of, mine:null, correct:null };
      paintQuestion(); return; }
    if(m.t === "result"){
      if(Q && Q.i===m.i){ Q.correct=m.correct; Q.board=m.board||[]; paintQuestion(); }
      return; }
    if(m.t === "final"){ paintFinal(m.board||[], m.night||[]); return; }
    // The host can ask the room at the end of the night, which is the other
    // moment people actually want the photos.
    if(m.t === "askphotos"){ setTimeout(askForEmail, 400); return; }
    if(m.t === "big"){
      var n = parseInt(m.text,10);
      // A number on its own during a bingo game is a ball. Anything else is a
      // message for the screen and the phone just shows it.
      if(B && !isNaN(n) && n>=1 && n<=90 && String(n)===String(m.text).trim()){
        if(B.called.indexOf(n)<0) B.called.push(n);
        B.last = n; B.lastSaid = m.sub||"";
        bingoSave(); paintBingo(); return;
      }
      $("app").innerHTML = '<img class="mark" src="/logos/partyplay-mark.svg" alt="">' +
        '<div class="waiting"><div class="who">' + esc(m.text||"") + '</div>' +
        '<p>' + esc(m.sub||"") + '</p></div>';
      return;
    }
    if(m.t === "say"){
      $("app").innerHTML = '<img class="mark" src="/logos/partyplay-mark.svg" alt="">' +
        '<div class="waiting"><div class="who">' + esc(m.title||"") + '</div>' +
        '<p>' + esc(m.text||"") + '</p></div>';
      return;
    }
  }

  document.addEventListener("click", function(ev){
    var el = ev.target.closest ? ev.target.closest("[data-n],[data-claim],[data-opt],[data-side],[data-lie]") : null;
    if(!el) return;
    if(el.hasAttribute("data-lie")){
      if(!V || V.picked!=null || V.lie!=null) return;
      var sv=load()||{};
      V.picked=+el.getAttribute("data-lie");
      paintVote();
      if(window._ppSend) window._ppSend({ t:"truthvote", name:sv.nickname, turn:V.turn, pick:V.picked });
      return;
    }
    if(el.hasAttribute("data-side")){
      if(!H || H.out || H.picked) return;
      var s1 = load() || {};
      H.picked = el.getAttribute("data-side");
      paintHeads();
      if(window._ppSend) window._ppSend({ t:"pick", name:s1.nickname, side:H.picked });
      return;
    }
    if(el.hasAttribute("data-opt")){
      if(!Q || Q.mine != null || Q.correct != null) return;
      var s0 = load() || {};
      Q.mine = el.getAttribute("data-opt");
      // Repaint first, so the tap feels instant even if the send is slow.
      paintQuestion();
      if(window._ppSend) window._ppSend({ t:"answer", name:s0.nickname, i:Q.i, answer:Q.mine });
      return;
    }
    if(!B) return;
    if(el.hasAttribute("data-n")){
      var n = +el.getAttribute("data-n");
      if(B.marked[n]) delete B.marked[n]; else B.marked[n] = 1;
      bingoSave(); paintBingo(); return;
    }
    if(el.hasAttribute("data-claim")){
      var s = load() || {};
      if(window._ppSend) window._ppSend({ t:"claim", name:s.nickname, kind:el.getAttribute("data-claim") });
      el.textContent = "Told them. Give us a yell too.";
      el.disabled = true;
    }
  });

  /* Someone who has already joined this party should not be asked again, because
     "it made me put my name in twice" is the sort of thing that becomes an email. */
  var saved = load(), fromUrl = (qs.get("code")||"").toUpperCase();
  if(saved && saved.token && (!fromUrl || fromUrl === saved.code)){
    waiting(saved.nickname); showCamera(); connect(saved.code, saved.nickname);
  } else {
    joinScreen(fromUrl, null);
  }
})();
</script>
</body>
</html>
