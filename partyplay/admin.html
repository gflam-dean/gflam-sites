<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PartyPlay admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/logos/partyplay-appicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#12101A;--ink2:#1B1826;--ink3:#262234;--paper:#FFF1E6;--mute:#B6ADC2;--faint:#847A98;
    --pink:#FF1F8E;--teal:#17C4B4;--yellow:#FFD23F;--line:rgba(255,241,230,.14)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.5}
  .wrap{max-width:880px;margin:0 auto;padding:26px 18px 90px}
  h1,h2{font-family:'Hanken Grotesk',sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
  h1{font-size:26px} h2{font-size:19px;margin:0 0 10px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
  .top .l{display:flex;align-items:center;gap:11px}
  .top img{width:38px;height:33px}
  section{background:var(--ink2);border:1px solid var(--line);border-radius:15px;padding:20px 22px;margin-bottom:14px}
  p{color:var(--mute);margin:0 0 12px;font-size:15px}
  label{display:block;font-weight:700;font-size:13.5px;margin:0 0 5px}
  input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--ink);
    color:var(--paper);font:inherit;font-size:16px}
  input:focus,select:focus{outline:2px solid var(--pink);outline-offset:1px}
  .row{display:grid;gap:11px;margin-bottom:11px}
  @media(min-width:600px){.row.two{grid-template-columns:1fr 1fr}.row.three{grid-template-columns:1fr 1fr 1fr}}
  button{border:0;border-radius:10px;padding:12px 18px;background:var(--pink);color:#fff;
    font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:15px;cursor:pointer}
  button.sec{background:none;border:1px solid var(--line);color:var(--mute)}
  button:disabled{opacity:.5;cursor:not-allowed}
  table{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:6px}
  th{text-align:left;color:var(--faint);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
    padding:0 8px 7px 0;border-bottom:1px solid var(--line);font-weight:700}
  td{padding:9px 8px 9px 0;border-bottom:1px solid rgba(255,241,230,.07);font-variant-numeric:tabular-nums}
  td:first-child,th:first-child{font-family:'JetBrains Mono',monospace}
  .jobs{display:flex;gap:9px;flex-wrap:wrap}
  button.sm{padding:7px 12px;font-size:13px;width:auto;margin:0}
  .tiny{font-size:13px;color:var(--mute);margin:16px 0 0}
  .tiny a{color:var(--mute)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin:0 0 22px}
  .tile{border:1px solid var(--line);border-radius:12px;padding:14px 15px}
  .tile b{display:block;font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:30px;line-height:1}
  .tile span{display:block;margin-top:5px;font-size:12.5px;color:var(--mute);line-height:1.35}
  .tile.live{border-color:var(--teal)} .tile.live b{color:var(--teal)}
  .tile.warn{border-color:#F5A524} .tile.warn b{color:#F5A524}
  td.warn{color:#F5A524;font-weight:700}
  h3{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:17px;margin:26px 0 8px}
  .out{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--teal);background:var(--ink);
    border-radius:9px;padding:11px 13px;margin-top:11px;white-space:pre-wrap;word-break:break-word;display:none}
  .out.show{display:block}
  .out.bad{color:#FF8FA3}
  .note{background:var(--ink3);border-left:3px solid var(--yellow);border-radius:0 10px 10px 0;padding:12px 15px;margin-top:12px}
  .note p{margin:0;color:var(--paper);font-size:14.5px}
  .party{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:12px}
  .phead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .phead b{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:21px;letter-spacing:.08em;color:var(--pink)}
  .phead span{color:var(--mute);font-size:15px}
  .phead i{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
  .phead i.live{background:var(--pink);color:#fff;border-color:var(--pink)}
  .party table{margin:0 0 12px}
  .party td:first-child{color:var(--faint);width:1%;white-space:nowrap;padding-right:16px;font-size:13px}
  .links,.acts{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
  .links button,.acts button{padding:9px 13px;font-size:13.5px}
  .cpy{border-color:rgba(23,196,180,.4);color:var(--teal)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="l"><img src="/logos/partyplay-mark.svg" alt=""><h1>Admin</h1></div>
    <button class="sec" id="forget" hidden>Sign out</button>
  </div>
  <div id="app"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/lib/pp-config.js"></script>
<script>
(function(){
  "use strict";
  var $=function(i){return document.getElementById(i);};
  var KEYSTORE="ppAdminKey";
  function key(){ try{ return localStorage.getItem(KEYSTORE)||""; }catch(e){ return ""; } }
  function setKey(v){ try{ v?localStorage.setItem(KEYSTORE,v):localStorage.removeItem(KEYSTORE); }catch(e){} }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

  /* The key travels in a header, never in the URL. A key in a query string is in
     browser history, in the Worker's logs, and in any screenshot of the tab. */
  function rawApi(path, opts){
    opts = opts || {};
    /* Two ways in, and the page does not care which it has. A staff member signs
       in with their mobile and travels on a Supabase token; the shared key is
       kept as the way to add the first person and the way back in when a phone
       is flat. Both go in headers, never the URL: a key in a query string is in
       browser history, in the Worker's logs, and in any screenshot of the tab. */
    var h = { "content-type":"application/json" };
    var tok = token();
    if(tok) h["Authorization"] = "Bearer " + tok;
    else if(key()) h["X-Admin-Key"] = key();
    return fetch(PPConfig.API+path, {
      method: opts.method || "GET",
      headers: Object.assign(h, opts.headers||{}),
      body: opts.body
    }).then(function(r){ return r.json().then(function(j){
      if(!r.ok){
        var er = new Error(j && j.error ? j.error : ("HTTP "+r.status));
        er.status = r.status; throw er;
      }
      return j; }); });
  }

  /* A Supabase access token lasts about an hour, and this console is a page
     somebody leaves open all evening. Before this, the first thing clicked after
     that hour came back as the Worker's bare word "no" - its word for "not you" -
     which reads as the button refusing rather than the sign-in having run out.
     That is exactly what "I cannot remove anyone, it just says no" was.

     Now an auth failure spends the refresh token once, quietly, and retries. Only
     if that fails does it fall back to the shared key, and only if there is no key
     does it say in plain words that the sign-in ran out. */
  function refreshSession(){
    var rt = refreshTok();
    if(!rt || !supa() || !supa().auth.refreshSession) return Promise.resolve(false);
    return supa().auth.refreshSession({ refresh_token: rt }).then(function(r){
      var ss = r && r.data && r.data.session;
      if(!ss || !ss.access_token) return false;
      setSession(ss.access_token, ss.refresh_token || rt);
      return true;
    }).catch(function(){ return false; });
  }

  function api(path, opts){
    return rawApi(path, opts).catch(function(e){
      /* Only an auth refusal is worth retrying, and only when we were travelling
         on a token in the first place. A 400 means the request was wrong, not us. */
      if(!(e.status === 403 || e.message === "no") || !token()) throw e;
      return refreshSession().then(function(ok){
        if(ok) return rawApi(path, opts);
        setSession("", "");
        if(key()) return rawApi(path, opts);
        askKey("Your sign-in ran out. Sign in again.");
        var er = new Error("signed out"); er.handled = true; throw er;
      });
    });
  }
  function out(id, text, bad){
    var el=$(id); el.textContent=text; el.classList.add("show");
    el.classList.toggle("bad", !!bad);
  }

  /* ---------------------------------------------------------- signing in ----
     Mobile first, because that is what staff will use every day, with the shared
     key underneath it for the first person in and for the day somebody's phone is
     flat. Supabase sends the code; this page never sees a password. */
  var sbClient = null;
  function supa(){
    if(!sbClient && window.supabase) sbClient = window.supabase.createClient(PPConfig.SUPA_URL, PPConfig.SUPA_ANON);
    return sbClient;
  }
  function token(){ try{ return localStorage.getItem("ppAdminTok") || ""; }catch(e){ return ""; } }
  function setToken(v){ try{ v ? localStorage.setItem("ppAdminTok", v) : localStorage.removeItem("ppAdminTok"); }catch(e){} }
  /* The refresh token is what buys a new hour without another text message. It was
     thrown away before, which is why a session could only ever last one hour. */
  function refreshTok(){ try{ return localStorage.getItem("ppAdminRef") || ""; }catch(e){ return ""; } }
  function setSession(access, refresh){
    setToken(access || "");
    try{ refresh ? localStorage.setItem("ppAdminRef", refresh) : localStorage.removeItem("ppAdminRef"); }catch(e){}
  }

  function askKey(msg){
    $("forget").hidden = true;
    $("app").innerHTML =
      '<section><h2>Sign in</h2>'+
      '<p>Your mobile, and we will text you a code. Ask whoever set this up to add your number first.</p>'+
      '<div class="row"><input type="tel" id="mob" inputmode="tel" autocomplete="tel" placeholder="04xx xxx xxx"></div>'+
      '<button id="mgo">Text me a code</button>'+
      '<div class="out" id="mout"></div>'+
      '<div class="note"><p>No password. The code lasts a few minutes and is good once.</p></div>'+
      (msg?'<div class="out show bad">'+esc(msg)+'</div>':'')+
      /* The shared key is no longer the way in, but it is still the way BACK in:
         a flat phone, a Supabase outage, or a fresh Worker with nobody in the
         allow-list yet. Folded away rather than deleted, because a locked-out
         support console at 9pm on a Saturday is a worse problem than a tidier
         screen. */
      '<p class="tiny"><a href="#" id="showkey">Phone not working?</a></p>'+
      '</section>'+
      '<section id="keybox" hidden><h2>The shared key</h2>'+
      '<p>Only for when the phone cannot get you in. Set on the Worker as ADMIN_KEY.</p>'+
      '<div class="row"><input type="password" id="k" autocomplete="off"></div>'+
      '<button class="sec" id="kgo">Unlock with the key</button></section>';

    $("showkey").addEventListener("click", function(e){
      e.preventDefault(); $("keybox").hidden = false; $("k").focus();
    });

    $("kgo").addEventListener("click", function(){
      var v=($("k").value||"").trim(); if(!v) return;
      setSession("", ""); setKey(v); boot();
    });
    $("k").addEventListener("keydown", function(e){ if(e.key==="Enter") $("kgo").click(); });

    $("mgo").addEventListener("click", sendCode);
    $("mob").addEventListener("keydown", function(e){ if(e.key==="Enter") sendCode(); });
    $("mob").focus();
  }

  function auMobile(v){
    var d=String(v||"").replace(/[^\d+]/g,"");
    if(d.indexOf("+61")===0) d="0"+d.slice(3);
    else if(d.indexOf("61")===0 && d.length===11) d="0"+d.slice(2);
    return /^04\d{8}$/.test(d) ? "+61"+d.slice(1) : null;
  }

  function sendCode(){
    var mob=auMobile($("mob").value);
    if(!mob){ out("mout","That does not look like an Australian mobile. Try 04xx xxx xxx.",true); return; }
    var c=supa(); if(!c){ out("mout","Could not reach the sign-in service. Use the key below.",true); return; }
    var b=$("mgo"); b.disabled=true; b.textContent="Sending...";
    c.auth.signInWithOtp({ phone: mob }).then(function(r){
      b.disabled=false; b.textContent="Text me a code";
      if(r && r.error){ out("mout", r.error.message || "Could not send the code.", true); return; }
      askCode(mob);
    }).catch(function(e){
      b.disabled=false; b.textContent="Text me a code";
      out("mout", e.message || "Could not send the code.", true);
    });
  }

  function askCode(mob){
    $("app").innerHTML =
      '<section><h2>Check your phone</h2>'+
      '<p>We sent a six digit code to '+esc(mob)+'.</p>'+
      '<div class="row"><input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="------"></div>'+
      '<button id="ogo">Sign in</button>'+
      '<div class="out" id="oout"></div>'+
      '<div class="row" style="margin-top:14px"><button class="sec" id="oback">Use a different number</button></div>'+
      '</section>';
    $("oback").addEventListener("click", function(){ askKey(""); });
    $("otp").addEventListener("keydown", function(e){ if(e.key==="Enter") $("ogo").click(); });
    $("ogo").addEventListener("click", function(){
      var code=($("otp").value||"").replace(/\D/g,"");
      if(code.length<6){ out("oout","Six digits.",true); return; }
      var b=$("ogo"); b.disabled=true; b.textContent="Checking...";
      supa().auth.verifyOtp({ phone: mob, token: code, type: "sms" }).then(function(r){
        if(r && r.error){ b.disabled=false; b.textContent="Sign in"; out("oout", r.error.message||"That code did not work.", true); return; }
        var sess = r && r.data && r.data.session;
        var tok = sess && sess.access_token;
        if(!tok){ b.disabled=false; b.textContent="Sign in"; out("oout","Signed in, but no session came back. Try the key.",true); return; }
        setKey(""); setSession(tok, sess.refresh_token || ""); boot();
      }).catch(function(e){
        b.disabled=false; b.textContent="Sign in"; out("oout", e.message||"That code did not work.", true);
      });
    });
    $("otp").focus();
  }

  function screen(){
    $("forget").hidden = false;
    $("app").innerHTML =
      '<section><h2>The numbers</h2>'+
      '<p>Sold is when money changed hands. Ran is when somebody actually pressed start. They are often different months.</p>'+
      '<div id="stats">Loading...</div></section>'+

      '<section><h2>Find a party</h2>'+
      '<p>A code, or any part of an email. Everything you need to help somebody is on one screen: what state they are in, what they built, who is in the room, and the links to hand them.</p>'+
      '<div class="row two"><div><label for="q">Code or email</label><input id="q" placeholder="ACDEFG or sam@"></div>'+
      '<div style="align-self:end"><button id="findgo">Look it up</button></div></div>'+
      '<div id="found"></div></section>'+

      '<section><h2>Comp a party</h2>'+
      '<p>A real licence that was never paid for. Competition winners, or making something right.</p>'+
      '<div class="row two"><div><label for="cn">Their name</label><input id="cn"></div>'+
      '<div><label for="ce">Their email</label><input id="ce" type="email"></div></div>'+
      '<div class="row three"><div><label for="cp">What is the party</label><input id="cp" placeholder="optional"></div>'+
      '<div><label for="cd">How long</label><select id="cd"><option value="3">3 days</option><option value="1">24 hours</option></select></div>'+
      '<div><label for="cr">Why</label><input id="cr" placeholder="e.g. August competition"></div></div>'+
      '<button id="compgo">Issue it</button><div class="out" id="compout"></div></section>'+

      '<section><h2>Jobs</h2>'+
      '<p>Safe to run any time. Each one is idempotent, so running it twice sends nothing twice.</p>'+
      '<div class="jobs">'+
      '<button class="sec" data-job="followups">Send "how was it" emails</button>'+
      '<button class="sec" data-job="send-albums">Send album links</button>'+
      '<button class="sec" data-job="sweep-photos">Delete expired photos</button>'+
      '</div><div class="out" id="jobout"></div>'+
      '<div class="note"><p>These want to run daily. Once you are happy with them, put a Cloudflare Cron Trigger on the Worker so nobody has to remember.</p></div></section>'+
      '<section id="staff"><h2>Who can get in</h2><p>Loading...</p></section>';

    api("/admin/stats?months=12").then(function(d){
      var n = d.now || {}, months = d.months || [], quarters = d.quarters || [], exp = d.expiring || [];

      /* The numbers you actually want at a glance, before any table: what is on
         right now, what is coming, and who is about to lose what they paid for. */
      function tile(big, label, cls){
        return '<div class="tile'+(cls?' '+cls:'')+'"><b>'+big+'</b><span>'+label+'</span></div>';
      }
      var tiles =
        '<div class="tiles">'+
        tile(n.runningNow||0, 'on right now', (n.runningNow?'live':''))+
        tile(n.upcoming||0, 'bought, not started')+
        tile(n.upcomingPaid||0, 'of those, paid')+
        tile(n.upcomingComp||0, 'of those, comped')+
        tile(n.ranTotal||0, 'parties run, all time')+
        tile(n.expiring30||0, 'expiring in 30 days', (n.expiring30?'warn':''))+
        '</div>';

      function moneyTable(title, rows, periodLabel){
        if(!rows.length) return '';
        return '<h3>'+title+'</h3><table><tr><th>'+periodLabel+'</th><th>Sold</th><th>Revenue</th>'+
          '<th>Refunds</th><th>Net</th><th>Comps</th><th>Ran</th><th>24h</th><th>3 day</th></tr>'+
          rows.map(function(m){
            return '<tr><td>'+esc(m.period)+'</td><td>'+m.sold+'</td><td>'+esc(m.revenue)+'</td>'+
              '<td>'+(m.refunds? m.refunds+' &middot; '+esc(m.refunded) : '&mdash;')+'</td>'+
              '<td><b>'+esc(m.net)+'</b></td><td>'+m.comps+'</td><td>'+m.ran+'</td>'+
              '<td>'+m.oneDay+'</td><td>'+m.threeDay+'</td></tr>';
          }).join("")+'</table>';
      }

      var expiringBlock = '';
      if(exp.length){
        expiringBlock =
          '<h3>Running out in the next 30 days</h3>'+
          '<p>Bought, never started, and the 12 months is nearly up. '+
          (n.neverNudged ? '<b>'+n.neverNudged+'</b> of them have not been chased yet.' : 'All of them have been chased already.')+'</p>'+
          '<table><tr><th>Code</th><th>Who</th><th>Party</th><th>Days left</th><th>Chased</th></tr>'+
          exp.map(function(r){
            return '<tr><td><b>'+esc(r.code)+'</b></td><td>'+esc(r.name)+'<br><small>'+esc(r.email)+'</small></td>'+
              '<td>'+(r.party? esc(r.party) : "&mdash;")+'</td><td'+(r.daysLeft<8?' class="warn"':'')+'>'+r.daysLeft+'</td>'+
              '<td>'+(r.nudgedAt? new Date(r.nudgedAt).toLocaleDateString("en-AU") : '<i>not yet</i>')+'</td></tr>';
          }).join("")+'</table>'+
          (n.neverNudged
            ? '<div class="row"><button class="sec" id="nudgeBtn">Email the '+n.neverNudged+' who have not been chased</button></div>'+
              '<div class="out" id="nudgeout"></div>'+
              '<div class="note"><p>One email each, once. Anyone already chased is skipped, so pressing this twice cannot pester the same person.</p></div>'
            : '');
      }

      $("stats").innerHTML = tiles +
        moneyTable('By month', months, 'Month') +
        moneyTable('By quarter', quarters, 'Quarter') +
        expiringBlock +
        (months.length ? '' : '<p>Nothing yet.</p>');

      var nb = $("nudgeBtn");
      if(nb) nb.addEventListener("click", function(){
        nb.disabled = true; nb.textContent = "Sending...";
        api("/admin/nudge-expiring", { method:"POST", body:"{}" })
          .then(function(r){
            $("nudgeout").textContent = "Sent " + r.sent + " of " + r.due +
              (r.failed && r.failed.length ? ". Failed: " + r.failed.join(", ") : ".");
            nb.textContent = "Done";
          })
          .catch(function(e){ nb.disabled=false; nb.textContent="Try again"; $("nudgeout").textContent=e.message; });
      });
    }).catch(function(e){
      if(/^HTTP 403/.test(e.message)||e.message==="no"){ setKey(""); setSession("", ""); askKey("That did not get you in. Sign in again."); return; }
      $("stats").innerHTML='<p>'+esc(e.message)+'</p>';
    });

    /* ------------------------------------------------------ who can get in --- */
    api("/admin/whoami").then(function(me){
      var who = me.viaKey
        ? 'Signed in with the <b>shared key</b>. Add your mobile below and use that from now on, so the log can tell you apart.'
        : 'Signed in as <b>' + esc(me.name) + '</b>.';
      return api("/admin/staff").then(function(d){
        var staff = d.staff || [];
        var rows = staff.length
          ? '<table><tr><th>Name</th><th>Mobile</th><th>Last in</th><th></th></tr>' +
            staff.map(function(a){
              var isYou = a.mobile === d.you;
              return '<tr' + (a.active ? '' : ' style="opacity:.5"') + '>' +
                '<td>' + esc(a.name) + (isYou ? ' <b>(you)</b>' : '') + '</td>' +
                '<td class="mono">' + esc(a.mobile) + '</td>' +
                '<td>' + (a.last_seen_at ? new Date(a.last_seen_at).toLocaleDateString("en-AU") : '<i>never</i>') + '</td>' +
                '<td>' + (a.active
                   ? (isYou ? '' : '<button class="sec sm" data-off="' + esc(a.mobile) + '">Remove</button>')
                   : '<i>removed</i>') + '</td></tr>';
            }).join("") + '</table>'
          : '<p>Nobody has a phone login yet. Add yours and you will not need the shared key again.</p>';

        $("staff").innerHTML =
          '<h2>Who can get in</h2><p>' + who + '</p>' + rows +
          '<div class="row" style="margin-top:14px">' +
          '<input id="sName" placeholder="Their name" maxlength="60">' +
          '<input id="sMob" type="tel" inputmode="tel" placeholder="04xx xxx xxx">' +
          '<button class="sec" id="sAdd">Add</button></div>' +
          '<div class="out" id="sout"></div>' +
          '<div class="note"><p>They sign in with that mobile and a texted code. Removing somebody switches them off rather than deleting them, so the log still says who did what.</p></div>';

        $("sAdd").addEventListener("click", function(){
          var name=($("sName").value||"").trim(), mob=($("sMob").value||"").trim();
          if(!name || !mob){ out("sout","Both a name and a mobile.",true); return; }
          api("/admin/staff/add",{ method:"POST", body:JSON.stringify({ name:name, mobile:mob }) })
            .then(function(){ screen(); })
            .catch(function(e){ if(!e.handled) out("sout", e.message, true); });
        });
        $("staff").addEventListener("click", function(e){
          var b=e.target.closest("[data-off]"); if(!b) return;
          api("/admin/staff/off",{ method:"POST", body:JSON.stringify({ mobile:b.getAttribute("data-off") }) })
            .then(function(){ screen(); })
            .catch(function(err){ if(!err.handled) out("sout", err.message, true); });
        });
      });
    }).catch(function(e){
      /* An older Worker has none of these routes. Say so plainly rather than
         leaving an empty box: the page still works on the shared key. */
      $("staff").innerHTML = '<h2>Who can get in</h2><p>Phone logins need the newer Worker. ' +
        'Paste the latest one and this will fill in. (' + esc(e.message) + ')</p>';
    });

    /* ------------------------------------------------ the support console --- */
    function copyBtn(label, value){
      return '<button class="sec cpy" data-cp="'+esc(value)+'">'+esc(label)+'</button>';
    }
    function showParty(p){
      var warn = p.status !== "paid"
        ? '<div class="note"><p>This one is <b>'+esc(p.status)+'</b>, not paid. A pending row is usually somebody who started checkout and never finished.</p></div>' : '';
      return '<div class="party">'+
        '<div class="phead"><b>'+esc(p.code)+'</b>'+
          '<span>'+esc(p.party || "no party name")+'</span>'+
          '<i class="'+(p.clock.indexOf("running")===0?"live":"")+'">'+esc(p.clock)+'</i></div>'+
        warn+
        '<table>'+
        '<tr><td>Who</td><td>'+esc(p.buyer.name)+' &middot; '+esc(p.buyer.email)+
          (p.buyer.mobile?' &middot; '+esc(p.buyer.mobile):'')+'</td></tr>'+
        '<tr><td>Bought</td><td>'+esc(p.plan)+(p.isComp?' <b>(comp'+(p.compReason?': '+esc(p.compReason):'')+')</b>':'')+
          ' &middot; '+new Date(p.boughtAt).toLocaleString("en-AU")+'</td></tr>'+
        '<tr><td>Games</td><td>'+(p.games.length
          ? p.games.map(function(g){ return esc(g.title||g.format)+(g.items?' ('+g.items+')':''); }).join(", ")
          : '<i>none built yet</i>')+'</td></tr>'+
        '<tr><td>In the room</td><td>'+p.playerCount+(p.players.length?' &middot; '+esc(p.players.slice(0,12).join(", ")):'')+'</td></tr>'+
        '<tr><td>Album</td><td>'+p.albumPhotos+' photos, '+p.megabytes+' MB'+
          (p.gamePhotos?' &middot; '+p.gamePhotos+' game photos':'')+
          (p.guestsWantingAlbum?' &middot; '+p.guestsWantingAlbum+' guests want a copy':'')+'</td></tr>'+
        '</table>'+
        '<div class="links">'+
          copyBtn("Copy host link", p.hostLink)+
          copyBtn("Copy run link", p.runLink)+
          copyBtn("Copy TV link", p.tvLink)+
          copyBtn("Copy album link", p.albumLink)+
        '</div>'+
        '<div class="acts">'+
          '<button class="sec" data-do="resend" data-code="'+esc(p.code)+'">Resend their email</button>'+
          '<button class="sec" data-do="unstart" data-code="'+esc(p.code)+'">Put the clock back</button>'+
          '<button class="sec" data-do="extend" data-code="'+esc(p.code)+'">Give them 24h more</button>'+
          '<button class="sec" data-do="clear-players" data-code="'+esc(p.code)+'">Empty the room</button>'+
        '</div><div class="out" id="act-'+esc(p.code)+'"></div></div>';
    }

    function lookup(){
      var q = ($("q").value||"").trim();
      if(!q) return;
      $("found").innerHTML = '<p>Looking...</p>';
      api("/admin/party?q="+encodeURIComponent(q))
        .then(function(d){
          $("found").innerHTML = (d.parties||[]).map(showParty).join("") ||
            '<p>Nothing found.</p>';
        })
        .catch(function(e){ $("found").innerHTML = '<p>'+esc(e.message)+'</p>'; });
    }
    $("findgo").addEventListener("click", lookup);
    $("q").addEventListener("keydown", function(e){ if(e.key==="Enter") lookup(); });

    document.addEventListener("click", function(ev){
      var b = ev.target.closest ? ev.target.closest("[data-cp],[data-do]") : null;
      if(!b) return;
      if(b.hasAttribute("data-cp")){
        var v = b.getAttribute("data-cp");
        if(navigator.clipboard) navigator.clipboard.writeText(v).then(function(){
          var t=b.textContent; b.textContent="Copied"; setTimeout(function(){ b.textContent=t; },1200); });
        else window.prompt("Copy this", v);
        return;
      }
      var act = b.getAttribute("data-do"), code = b.getAttribute("data-code");
      /* Every one of these changes somebody's paid-for thing, so it asks why and
         the answer goes in the log. Nobody should be able to give away a day and
         leave no trace. */
      var why = window.prompt("Why? (goes in the log)\n\n" + act + " on " + code);
      if(why === null) return;
      var out = $("act-"+code);
      out.className = "out show"; out.textContent = "Working...";
      api("/admin/party/do", { method:"POST",
        body: JSON.stringify({ code:code, action:act, why:why, hours:24 }) })
        .then(function(j){ out.textContent = j.did; setTimeout(lookup, 600); })
        .catch(function(e){ out.className = "out show bad"; out.textContent = e.message; });
    });

    $("compgo").addEventListener("click", function(){
      var b={ name:($("cn").value||"").trim(), email:($("ce").value||"").trim(),
              party:($("cp").value||"").trim()||null, days:parseInt($("cd").value,10),
              reason:($("cr").value||"").trim()||null };
      if(!b.name||!b.email){ out("compout","Name and email, please.",true); return; }
      $("compgo").disabled=true;
      api("/admin/comp",{method:"POST",body:JSON.stringify(b)})
        .then(function(j){ out("compout","Done. Code "+j.code+"\nThey have been emailed their link."); 
          $("cn").value=$("ce").value=$("cp").value=$("cr").value=""; })
        .catch(function(e){ out("compout",e.message,true); })
        .then(function(){ $("compgo").disabled=false; });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-job]"), function(btn){
      btn.addEventListener("click", function(){
        var job=btn.getAttribute("data-job");
        btn.disabled=true; out("jobout","Running "+job+"...");
        api("/admin/"+job,{method:"POST",body:JSON.stringify({})})
          .then(function(j){ out("jobout", job+": "+JSON.stringify(j,null,1)); })
          .catch(function(e){ out("jobout", job+": "+e.message, true); })
          .then(function(){ btn.disabled=false; });
      });
    });
  }

  $("forget").addEventListener("click", function(){
    setKey(""); setSession("", "");
    try{ if(supa()) supa().auth.signOut(); }catch(e){}
    askKey();
  });
  function boot(){ if(!key() && !token()) askKey(); else screen(); }
  boot();
})();
</script>
</body>
</html>
