<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The album | PartyPlay</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/logos/partyplay-appicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#12101A;--ink2:#1B1826;--ink3:#262234;--paper:#FFF1E6;--mute:#B6ADC2;--faint:#847A98;
    --pink:#FF1F8E;--teal:#17C4B4;--yellow:#FFD23F;--line:rgba(255,241,230,.14)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:Manrope,system-ui,sans-serif;font-size:17px;line-height:1.55}
  .wrap{max-width:900px;margin:0 auto;padding:30px 18px 90px}
  h1{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:clamp(26px,6vw,38px);letter-spacing:-.02em;margin:0 0 6px}
  .mark{width:46px;height:40px;margin-bottom:14px}
  p{color:var(--mute);margin:0 0 8px}
  .warn{background:var(--ink2);border-left:3px solid var(--yellow);border-radius:0 12px 12px 0;
    padding:14px 17px;margin:20px 0}
  .warn p{margin:0;color:var(--paper);font-size:16px}
  .grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));margin-top:20px}
  .grid a{display:block;aspect-ratio:1;border-radius:11px;overflow:hidden;background:var(--ink2);border:1px solid var(--line)}
  .grid img{width:100%;height:100%;object-fit:cover;display:block}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .btn{background:var(--pink);color:#fff;text-decoration:none;border:0;border-radius:12px;padding:14px 22px;
    font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:16px;cursor:pointer}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--paper)}
  .state{text-align:center;padding:60px 20px;color:var(--mute)}
  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:14.5px}
  footer a{color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <img class="mark" src="/logos/partyplay-mark.svg" alt="">
  <div id="app"><div class="state">Loading...</div></div>
  <footer>Made with <a href="/">PartyPlay</a>. In one of these and want it gone?
    <a href="mailto:hello@partyplay.com.au">Tell us</a> and we will remove it.</footer>
</div>
<script src="/lib/pp-config.js"></script>
<script>
(function(){
  "use strict";
  var $=function(i){return document.getElementById(i);};
  var SHARE=(new URLSearchParams(location.search).get("share")||"").trim();
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

  if(!SHARE){ $("app").innerHTML='<div class="state">This link is missing something.</div>'; return; }

  fetch(PPConfig.API+"/album?share="+encodeURIComponent(SHARE))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.error) throw new Error(d.error);
      if(!d.count){ $("app").innerHTML='<h1>'+esc(d.party||"The album")+'</h1><p>Nobody took any photos.</p>'; return; }
      var gone = d.deleteAfter ? new Intl.DateTimeFormat("en-AU",{weekday:"long",day:"numeric",month:"long"})
        .format(new Date(d.deleteAfter)) : null;
      var days = d.deleteAfter ? Math.ceil((Date.parse(d.deleteAfter)-Date.now())/86400000) : null;

      var h='<h1>'+esc(d.party||"The album")+'</h1>'+
        '<p>'+d.count+(d.count===1?" photo":" photos")+'. Tap any of them to save it.</p>';
      /* The countdown is the honest bit AND the useful bit. Nobody's party photos
         should live on somebody else's server forever, and saying when they go is
         what makes people actually save the ones they want. */
      if(gone){
        h+='<div class="warn"><p><b>These are deleted on '+esc(gone)+'</b>'+
           (days!=null && days>0 ? ', which is '+days+(days===1?" day":" days")+' away' : '')+
           '. Save anything you want to keep before then.</p></div>';
      }
      h+='<div class="bar"><button class="btn" id="print">Get prints</button>'+
         '<a class="btn ghost" href="/">What is PartyPlay?</a></div><div class="grid">';
      d.photos.forEach(function(p){
        var u=PPConfig.API+"/album/photo?share="+encodeURIComponent(SHARE)+"&id="+encodeURIComponent(p.id);
        h+='<a href="'+u+'" target="_blank" rel="noopener"><img loading="lazy" src="'+u+
           '" alt="'+(p.by?"Taken by "+esc(p.by):"Party photo")+'"></a>';
      });
      h+='</div>';
      $("app").innerHTML=h;
      $("print").addEventListener("click", function(){
        // TODO: hand off to the print partner once one is chosen. Deliberately not
        // a dead link in the meantime.
        alert("Printing is coming very soon. Save the ones you want in the meantime, and they are yours to print anywhere.");
      });
    })
    .catch(function(e){
      $("app").innerHTML='<div class="state">'+esc(e.message)+'</div>';
    });
})();
</script>
</body>
</html>
