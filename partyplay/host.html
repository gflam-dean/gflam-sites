<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build your games | PartyPlay</title>
<link rel="icon" href="/logos/partyplay-appicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#12101A;--ink2:#1B1826;--ink3:#262234;--paper:#FFF1E6;--mute:#B6ADC2;--faint:#847A98;
    --pink:#FF1F8E;--teal:#17C4B4;--yellow:#FFD23F;--line:rgba(255,241,230,.14)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:Manrope,system-ui,sans-serif;
    font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:26px 20px 120px}
  h1,h2,h3{font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
  a{color:var(--pink)}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .top img{width:44px;height:38px}
  .top b{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:21px}

  .party{background:var(--ink2);border:1px solid var(--line);border-radius:15px;padding:20px 22px;margin-bottom:14px}
  .party .when{color:var(--mute);font-size:15.5px;margin:6px 0 0}
  .pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    padding:4px 10px;border-radius:20px;margin-bottom:8px}
  .pill.up{background:rgba(23,196,180,.16);color:var(--teal)}
  .pill.live{background:var(--pink);color:#fff}
  .pill.done{background:var(--ink3);color:var(--faint)}
  .codebox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:14px;
    border-top:1px solid var(--line)}
  .codebox .lbl{font-size:13px;color:var(--faint)}
  .codebox .code{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:30px;letter-spacing:.1em}

  .bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:30px 0 12px}
  h2{font-size:21px}
  .hint{color:var(--faint);font-size:14.5px;margin:2px 0 0}

  .game{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;
    display:flex;align-items:center;gap:14px}
  .game .ico{width:38px;height:38px;border-radius:10px;background:var(--ink3);display:grid;place-items:center;
    font-size:19px;flex:0 0 auto}
  .game .meta{flex:1 1 auto;min-width:0}
  .game .meta b{display:block;font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:16.5px}
  .game .meta span{color:var(--faint);font-size:14px}
  .game button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:9px;
    padding:8px 13px;font:inherit;font-size:14px;cursor:pointer}
  .game button:hover{color:var(--paper);border-color:var(--faint)}
  .game button.del:hover{color:#FF8FA3;border-color:#FF8FA3}

  .runbtn{display:block;text-align:center;text-decoration:none;background:none;border:1px solid var(--line);
    color:var(--mute);border-radius:13px;padding:15px;font-family:'Hanken Grotesk',sans-serif;
    font-weight:800;font-size:16px;margin-bottom:14px}
  .runbtn.live{background:var(--pink);border-color:var(--pink);color:#fff}
  .add{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));margin-top:12px}
  .add button{background:var(--ink2);border:1px dashed var(--line);color:var(--paper);border-radius:13px;
    padding:16px 12px;font:inherit;cursor:pointer;text-align:left}
  .add button:hover{border-color:var(--pink);border-style:solid}
  .add button b{display:block;font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:15.5px}
  .add button span{color:var(--faint);font-size:13px;display:block;margin-top:2px}

  dialog{background:var(--ink2);color:var(--paper);border:1px solid var(--line);border-radius:18px;
    padding:0;max-width:640px;width:calc(100% - 32px)}
  dialog::backdrop{background:rgba(6,4,10,.72)}
  .dhd{padding:20px 22px 0}
  .dbd{padding:14px 22px;max-height:60vh;overflow:auto}
  .dft{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line)}
  label{display:block;font-weight:700;font-size:14px;margin:0 0 5px}
  input[type=text],textarea{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--line);
    background:var(--ink);color:var(--paper);font:inherit;font-size:16px}
  textarea{min-height:74px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--pink);outline-offset:1px}
  .qrow{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px}
  .qrow .n{font-size:12px;color:var(--faint);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
  .qrow .n button{background:none;border:0;color:var(--faint);cursor:pointer;font:inherit;font-size:13px}
  .qrow .n button:hover{color:#FF8FA3}
  .qrow .two{display:grid;gap:9px}
  .pickgrid{display:grid;gap:7px;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));margin-bottom:12px}
  .pickgrid button{padding:0;border:2px solid var(--line);border-radius:10px;overflow:hidden;
    background:var(--ink);aspect-ratio:1;cursor:pointer}
  .pickgrid button.on{border-color:var(--pink)}
  .pickgrid img{width:100%;height:100%;object-fit:cover;display:block}
  .qrow .shot{width:64px;height:64px;border-radius:9px;object-fit:cover;float:right;margin-left:10px}
  .upbtn{display:block;text-align:center;border:1px dashed var(--line);border-radius:12px;padding:15px;
    color:var(--paper);font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:15.5px;
    cursor:pointer;margin-bottom:12px}
  .upbtn:hover{border-color:var(--pink);border-style:solid}
  .upnote{color:var(--faint);font-size:14px;margin:-6px 0 10px;min-height:18px}
  @media(min-width:520px){.qrow .two{grid-template-columns:1fr 1fr}}
  button.primary{background:var(--pink);border:0;color:#fff;border-radius:11px;padding:12px 20px;
    font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:16px;cursor:pointer}
  button.ghost{background:none;border:1px solid var(--line);color:var(--mute);border-radius:11px;
    padding:12px 18px;font:inherit;cursor:pointer}
  button.addq{background:none;border:1px dashed var(--line);color:var(--mute);border-radius:11px;
    padding:11px;width:100%;font:inherit;cursor:pointer}

  .saved{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink3);
    border:1px solid var(--line);border-radius:22px;padding:10px 20px;font-size:14.5px;
    opacity:0;transition:opacity .18s;pointer-events:none}
  .saved.show{opacity:1}
  .state{text-align:center;padding:60px 20px;color:var(--mute)}
  .err{background:rgba(255,90,110,.12);border:1px solid rgba(255,90,110,.4);border-radius:12px;
    padding:14px 16px;color:#FFC2CC;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="/logos/partyplay-mark.svg" alt=""><b>PartyPlay</b></div>
  <div id="app"><div class="state">Loading your party...</div></div>
</div>

<dialog id="dlg">
  <form method="dialog" id="dform">
    <div class="dhd"><h3 id="dTitle">Game</h3><p class="hint" id="dHint"></p></div>
    <div class="dbd" id="dBody"></div>
    <div class="dft">
      <button type="button" class="ghost" id="dCancel">Cancel</button>
      <button type="button" class="primary" id="dSave">Save game</button>
    </div>
  </form>
</dialog>
<div class="saved" id="toast"></div>

<script src="/lib/pp-config.js"></script>
<script src="/lib/pp-photo.js"></script>
<script>
(function(){
  "use strict";
  var API = PPConfig.API;
  var $ = function(id){ return document.getElementById(id); };
  var qs = new URLSearchParams(location.search);
  var CODE = (qs.get("code")||"").toUpperCase(), KEY = qs.get("key")||"";

  /* Every game type in one table, so adding another is one entry rather than a
     new screen. `fields` describes the builder; a type with none needs no content
     at all and can just be added. */
  /* `ready` is the honest bit. Offering a game that does nothing when the host
     presses Start on the night is exactly the sort of thing that becomes a support
     email, so the ones that are not finished say so and cannot be added. */
  var TYPES = {
    bingo90:    { icon:"\u{1F3B1}", name:"Bingo",            blurb:"90 ball. Nothing to set up.", ready:true },
    trivia:     { icon:"\u{1F9E0}", name:"Trivia",           blurb:"Your own questions", ready:true,
                  q:"Question", a:"Answer", addLabel:"Add a question" },
    howwell:    { icon:"\u{1F382}", name:"How well do you know...",  blurb:"About the guest of honour", ready:true,
                  q:"Question about them", a:"The real answer", addLabel:"Add a question" },
    truths:     { icon:"\u{1F914}", name:"Two truths and a lie", ready:true,
                  blurb:"Nothing to set up. Each guest types their own three on their phone when you start it" },
    headstails: { icon:"\u{1FA99}", name:"Heads or tails",    blurb:"Ninety seconds. Nothing to set up.", ready:true },
    whohere:    { icon:"\u{1F465}", name:"Who here has ever", ready:true, blurb:"Prompts to get people talking",
                  q:"Find someone who...", a:null, addLabel:"Add a prompt" },
    photos:     { icon:"\u{1F5BC}", name:"Guess the photo",   ready:true, picker:true,
                  blurb:"Baby photos, holiday photos, whatever you have",
                  q:"Clue", a:"Who is it?", addLabel:"Add a photo" },
    /* RETIRED, not deleted. A host cannot add a new one, because there is no way
       to bring your own music to it and a queue nobody can play is a let-down
       rather than a game. Parties that already have one keep working: the
       renderer looks the format up here, so removing the entry outright would
       leave those hosts with a nameless row. */
    playlist:   { icon:"\u{1F3B5}", name:"The playlist",      ready:true, retired:true,
                  blurb:"Guests add songs from their phones on the night" },
    draw:       { icon:"\u{1F3AB}", name:"Prize draw",        ready:true, blurb:"Nothing to set up." },

    /* The two games where a screen is a problem rather than a help. `screenOff`
       puts the warning in front of the host before the first round, because the
       whole game is ruined the moment the person guessing glances at the telly. */
    charades:   { icon:"\u{1F3AD}", name:"Charades",         ready:true, screenOff:"actor",
                  blurb:"The word goes to one phone only",
                  q:"Word or phrase to act out", a:null, addLabel:"Add a word" },
    guesswho:   { icon:"\u{1F914}", name:"Who am I?",        ready:true, screenOff:"guesser",
                  blurb:"They ask, everyone else can see the answer",
                  q:"Person or thing", a:null, addLabel:"Add one" }
  };

  var PARTY = null, GAMES = [], editing = null;

  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function api(path, opts){
    return fetch(API + path, Object.assign({ headers:{ "content-type":"application/json" } }, opts||{}))
      .then(function(r){ return r.json().then(function(j){
        if(!r.ok) throw new Error(j && j.error ? j.error : "Something went wrong");
        return j; }); });
  }

  function load(){
    if(!CODE || !KEY){
      $("app").innerHTML = '<div class="err">This link is missing something. Open the link from your confirmation email, ' +
        'which has both your code and your host key in it.</div>';
      return;
    }
    api("/games?code=" + encodeURIComponent(CODE) + "&key=" + encodeURIComponent(KEY))
      .then(function(d){ PARTY = d.party; GAMES = d.games || []; render(); })
      .catch(function(e){
        $("app").innerHTML = '<div class="err">' + esc(e.message) + '</div>';
      });
  }

  function whenText(){
    var st = PARTY.status;   // ready | live | finished
    return st === "ready"
      ? { state:"up",   label:"Ready when you are",
          when:"Nothing is ticking. Your " + (PARTY.days === 3 ? "3 days" : "24 hours") +
               " starts only when you press start on the night." }
      : st === "live"
        ? { state:"live", label:"Running", when:PARTY.timeLeft + "." }
        : { state:"done", label:"Finished", when:"This party has run its course. Hope it was a good one." };
  }

  function loadAlbum(){
    api("/photos?code=" + encodeURIComponent(CODE) + "&key=" + encodeURIComponent(KEY))
      .then(function(d){
        var el = $("album"); if(!el) return;
        if(!d.count){
          el.innerHTML = '<p class="hint">Nothing yet.</p>';
          return;
        }
        /* Say when it goes, plainly and early. "We delete it after 30 days" is a
           reason to trust us, not a limitation to bury at the bottom. */
        var gone = d.deleteAfter ? new Intl.DateTimeFormat("en-AU",
          { day:"numeric", month:"long" }).format(new Date(d.deleteAfter)) : null;
        var share = location.origin + "/album?share=" + encodeURIComponent(d.shareKey || "");
        el.innerHTML =
          '<div class="game"><div class="ico">&#128247;</div><div class="meta">' +
          '<b>' + d.count + (d.count === 1 ? " item" : " items") +
          (d.videos ? ' <span style="font-weight:400;color:var(--faint)">(' + d.videos +
            (d.videos === 1 ? " clip" : " clips") + ')</span>' : '') + '</b>' +
          '<span>' + d.megabytes + ' MB' + (gone ? ' &middot; deleted on ' + esc(gone) : '') +
          (d.guestsWaiting ? ' &middot; ' + d.guestsWaiting + ' guests want a copy' : '') + '</span></div>' +
          '<button id="dlAll">Download</button></div>' +
          /* The share link is safe to hand out: it shows the album and can do
             nothing else. Never give anyone the host key, which can delete games. */
          '<div class="game"><div class="ico">&#128279;</div><div class="meta">' +
          '<b>Share the album</b><span>Anyone with this link can see and save the photos. ' +
          'They cannot change anything.</span></div>' +
          '<button id="copyShare">Copy link</button></div>';
        el.setAttribute("data-share", share);
      })
      .catch(function(){ /* the album is a bonus, never the reason a page fails */ });
  }

  function downloadAll(){
    api("/photos?code=" + encodeURIComponent(CODE) + "&key=" + encodeURIComponent(KEY))
      .then(function(d){
        if(!d.photos || !d.photos.length){ toast("Nothing to download yet."); return; }
        toast("Opening " + d.photos.length + ". Your browser may ask to allow it.");
        /* One tab each, spaced out. A zip would be nicer and needs a library and
           a lot of memory on a phone; this works everywhere today. */
        d.photos.forEach(function(p, i){
          setTimeout(function(){
            window.open(PPConfig.API + "/photo?code=" + encodeURIComponent(CODE) +
              "&key=" + encodeURIComponent(KEY) + "&id=" + encodeURIComponent(p.id), "_blank");
          }, i * 350);
        });
      })
      .catch(function(e){ toast(e.message); });
  }

  function render(){
    var w = whenText();
    var h = '<div class="party">' +
      '<span class="pill ' + w.state + '">' + w.label + '</span>' +
      '<h1 style="font-size:26px">Your party</h1>' +
      '<p class="when">' + esc(w.when) + '</p>' +
      '<div class="codebox"><span class="lbl">Guests join with</span>' +
      '<span class="code">' + esc(PARTY.code) + '</span></div></div>';

    /* Without this there is no way to reach the console that actually runs the
       night: the email links here, and here linked nowhere. */
    var runHref = "/run?code=" + encodeURIComponent(PARTY.code) + "&key=" + encodeURIComponent(KEY);
    h += '<a class="runbtn' + (w.state === "live" ? " live" : "") + '" href="' + runHref + '">' +
         (w.state === "live" ? "Run the night" :
          w.state === "up"   ? "Open the night console" : "Look back at the night") + '</a>';

    h += '<div class="bar"><div><h2>Your games</h2>' +
         '<p class="hint">Build these whenever you like. There is no rush and no extra cost.</p></div></div>';

    if(!GAMES.length){
      h += '<p class="hint" style="margin-bottom:10px">Nothing yet. Add your first below.</p>';
    }
    GAMES.forEach(function(g){
      var t = TYPES[g.format] || { icon:"\u{1F3AE}", name:g.format };
      var n = (g.config && g.config.items && g.config.items.length) || 0;
      h += '<div class="game"><div class="ico">' + t.icon + '</div><div class="meta">' +
           '<b>' + esc(g.title || t.name) + '</b><span>' + esc(t.name) +
           (t.q ? " &middot; " + n + (n === 1 ? " item" : " items") : "") + '</span></div>' +
           (t.q ? '<button data-edit="' + esc(g.id) + '">Edit</button>' : '') +
           '<button class="del" data-del="' + esc(g.id) + '">Remove</button></div>';
    });

    h += '<div class="bar"><div><h2>Add a game</h2></div></div><div class="add">';
    Object.keys(TYPES).filter(function(k){ return TYPES[k].ready && !TYPES[k].retired; }).forEach(function(k){
      var t = TYPES[k];
      h += '<button data-add="' + k + '"><b>' + t.icon + " " + esc(t.name) + '</b><span>' + esc(t.blurb) + '</span></button>';
    });
    h += '</div>';
    h += '<div class="bar"><div><h2>The album</h2>' +
         '<p class="hint" id="albumHint">Guests can add photos all night from the camera button on their phone.</p></div></div>' +
         '<div id="album"></div>';

    var soon = Object.keys(TYPES).filter(function(k){ return !TYPES[k].ready && !TYPES[k].retired; });
    if(soon.length){
      h += '<p class="hint" style="margin-top:16px">On the way: ' +
           soon.map(function(k){ return esc(TYPES[k].name); }).join(", ") + '.</p>';
    }
    $("app").innerHTML = h;
    loadAlbum();
  }

  /* ------------------------------------------------------------ the builder -- */
  function openBuilder(format, game){
    var t = TYPES[format];
    if(format === "trivia" && !TRIVIA_INDEX){
      fetch("/data/trivia/index.json").then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){ if(d){ TRIVIA_INDEX = d; if($("dlg").open) drawItems(); } })
        .catch(function(){});
    }
    if(WORDY[format] && !WORD_INDEX[format]){
      wordIndexFor(format).then(function(d){ if(d && $("dlg").open) drawItems(); }).catch(function(){});
    }
    editing = { format:format, id: game ? game.id : null,
                title: game ? game.title : "",
                items: (game && game.config && game.config.items) ? game.config.items.slice() : [] };
    if(!editing.items.length) editing.items.push({ q:"", a:"" });
    $("dTitle").textContent = game ? "Edit " + t.name : t.name;
    $("dHint").textContent = t.blurb;
    drawItems();
    $("dlg").showModal();
  }

  /* ------------------------------------------------------- ready made rounds --
     A host who bought this an hour before people arrive has not got forty
     questions in them. Pick a category, get ten, edit any you do not like.

     Ten at a time on purpose: that is a round. Press it four times with four
     different categories and you have the four rounds of ten a quiz night
     actually looks like.

     The questions come from the same bank VenuePlay uses, which is CC BY-SA
     with named attributions. Each pack carries its own copy of the licence and
     the credits travel with them into the dialog, because using the questions
     and dropping the attribution is not a thing we get to do. */
  var TRIVIA_INDEX = null;
  var PACKS = {};
  /* Charades and Who am I have the same problem as trivia: a host staring at an
     empty box trying to think of twenty words. Same shape of answer, different
     content, so they share the machinery and differ only in where the list
     comes from and what a "batch" is. Ten words rather than ten questions,
     because ten is about one turn each around a room. */
  var WORD_INDEX = {};        // by format
  var WORD_PACKS = {};        // by format + slug
  var WORDY = { charades: "charades", guesswho: "guesswho" };

  function wordIndexFor(fmt){
    if(WORD_INDEX[fmt]) return Promise.resolve(WORD_INDEX[fmt]);
    return fetch("/data/words/" + WORDY[fmt] + "-index.json")
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){ if(d) WORD_INDEX[fmt] = d; return d; });
  }

  function fillWords(fmt, slug, howMany){
    var key = fmt + ":" + slug;
    var got = WORD_PACKS[key]
      ? Promise.resolve(WORD_PACKS[key])
      : fetch("/data/words/" + WORDY[fmt] + "-" + encodeURIComponent(slug) + ".json")
          .then(function(r){ if(!r.ok) throw new Error("Could not load that category."); return r.json(); })
          .then(function(d){ WORD_PACKS[key] = d; return d; });
    return got.then(function(pack){
      var used = {};
      editing.items.forEach(function(it){ if(it.q) used[it.q.trim().toLowerCase()] = 1; });
      GAMES.forEach(function(g){
        ((g.config && g.config.items) || []).forEach(function(it){
          if(it && it.q) used[String(it.q).trim().toLowerCase()] = 1; });
      });
      var pool = pack.words.filter(function(w){ return !used[w.trim().toLowerCase()]; });
      if(!pool.length) throw new Error("You have used every word in that category.");
      for(var i = pool.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
      }
      if(editing.items.length === 1 && !editing.items[0].q && !editing.items[0].a) editing.items = [];
      pool.slice(0, howMany).forEach(function(w){ editing.items.push({ q:w, a:"" }); });
      return pool.length;
    });
  }

  function packFor(slug){
    if(PACKS[slug]) return Promise.resolve(PACKS[slug]);
    return fetch("/data/trivia/" + encodeURIComponent(slug) + ".json")
      .then(function(r){ if(!r.ok) throw new Error("Could not load that category."); return r.json(); })
      .then(function(d){ PACKS[slug] = d; return d; });
  }

  function fillFromCategory(slug, howMany){
    return packFor(slug).then(function(pack){
      // Never repeat a question already in this round, and never repeat one the
      // host has in another round of the same party either.
      var used = {};
      editing.items.forEach(function(it){ if(it.q) used[it.q.trim().toLowerCase()] = 1; });
      GAMES.forEach(function(g){
        ((g.config && g.config.items) || []).forEach(function(it){
          if(it && it.q) used[String(it.q).trim().toLowerCase()] = 1; });
      });
      var pool = pack.questions.filter(function(q){ return !used[q.q.trim().toLowerCase()]; });
      if(!pool.length) throw new Error("You have used every question in that category.");
      // Shuffle so two parties on the same category do not get the same ten.
      for(var i = pool.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
      }
      // Drop the blank starter row if nothing has been typed into it.
      if(editing.items.length === 1 && !editing.items[0].q && !editing.items[0].a) editing.items = [];
      pool.slice(0, howMany).forEach(function(q){
        editing.items.push({ q:q.q, a:q.answer, options:q.options.slice(), src:pack.category });
      });
      editing.credit = pack;
      return pool.length;
    });
  }

  function categoryStrip(){
    var fmt = editing.format, idx = null, thing = "questions", noun = "question";
    if(fmt === "trivia"){ idx = TRIVIA_INDEX; }
    else if(WORDY[fmt]){ idx = WORD_INDEX[fmt]; thing = "words"; noun = "word"; }
    else return "";
    var opts = (idx ? idx.categories : []).map(function(c){
      return '<option value="' + esc(c.slug) + '">' + esc(c.category) + '</option>'; }).join("");
    if(!opts) return "";
    return '<div class="qrow" style="background:rgba(255,255,255,.03)">' +
      '<label style="margin-bottom:8px">Not got ' + thing + ' ready?</label>' +
      '<p class="hint" style="margin:0 0 10px">Pick a category and we will put ten in. ' +
      'Edit any you do not like, or press it again with another category for more.</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<select id="catPick" style="flex:1 1 180px">' + opts + '</select>' +
      '<button type="button" class="addq" id="catFill" style="margin:0;flex:0 0 auto">Add ten</button>' +
      '</div><p class="hint" id="catNote" style="margin:8px 0 0"></p></div>';
  }

  function creditLine(){
    var c = editing.credit;
    if(!c) return "";
    var who = (c.attributions || []).map(function(a){
      return typeof a === "string" ? a : (a.name || a.source || ""); }).filter(Boolean).join(", ");
    return '<p class="hint" style="margin-top:14px">Questions from ' + esc(who || "the open trivia bank") +
           ', used under ' + esc(c.license || "CC BY-SA 4.0") + '.</p>';
  }

  function drawItems(){
    var t = TYPES[editing.format];
    if(t.picker) return drawPicker(t);
    /* "Give it a name" told the host nothing about what the name was for or
       what happens if they leave it, and the placeholder repeating the game's
       own name made it look like it had already been filled in. */
    var h = '<label for="gTitle">Name this round</label>' +
            '<p class="hint" style="margin:-2px 0 8px">Goes on the big screen when it starts. ' +
            'Leave it blank and we will just call it ' + esc(t.name) + '.</p>' +
            '<input type="text" id="gTitle" value="' + esc(editing.title || "") + '" placeholder="' + esc(t.name) + '">' +
            '<div style="height:16px"></div>' + categoryStrip();
    editing.items.forEach(function(it, i){
      h += '<div class="qrow"><div class="n"><span>' + (i+1) + '</span>' +
           (editing.items.length > 1 ? '<button type="button" data-rm="' + i + '">Remove</button>' : '') +
           '</div><div class="two">' +
           '<div><label>' + esc(t.q) + '</label><textarea data-q="' + i + '">' + esc(it.q) + '</textarea></div>' +
           (t.a ? '<div><label>' + esc(t.a) + '</label><textarea data-a="' + i + '">' + esc(it.a) + '</textarea></div>' : '') +
           '</div></div>';
    });
    h += '<button type="button" class="addq" id="addItem">+ ' + esc(t.addLabel) + '</button>';
    h += creditLine();
    $("dBody").innerHTML = h;

    var fill = $("catFill");
    if(fill) fill.addEventListener("click", function(){
      var sel = $("catPick"); if(!sel || !sel.value) return;
      harvest();                         // keep anything typed before this click
      fill.disabled = true; fill.textContent = "Adding...";
      (editing.format === "trivia" ? fillFromCategory(sel.value, 10)
                                   : fillWords(editing.format, sel.value, 10))
        .then(function(left){
          drawItems();
          var n = $("catNote");
          if(n) n.textContent = "Ten added. " + (left - 10) + " more left in that category.";
        })
        .catch(function(e){ fill.disabled = false; fill.textContent = "Add ten"; toast(e.message); });
    });
  }

  /* Guess the Photo is built FROM the album rather than typed from nothing. The
     host picks faces the room already photographed tonight, which is the whole
     appeal and means there is nothing to prepare in advance. */
  function drawPicker(t){
    var body = $("dBody");
    body.innerHTML = '<label for="gTitle">Give it a name</label>' +
      '<input type="text" id="gTitle" value="' + esc(editing.title || "") + '" placeholder="' + esc(t.name) + '">' +
      '<div style="height:14px"></div><p class="hint" id="pickHint">Loading your album...</p><div id="pickWrap"></div>';
    api("/photos/pick?code=" + encodeURIComponent(CODE) + "&key=" + encodeURIComponent(KEY))
      .then(function(d){
        /* Two sources. What the host brought (baby photos, usually, uploaded days
           earlier) and what the room has taken tonight. The first is the game
           people actually want; the second is a bonus once a party is running. */
        var mine = d.mine || [], party = d.party || [];
        var pics = mine.concat(party);
        $("pickHint").innerHTML =
          'Upload your own photos, then say who is in each. Baby photos work best.' +
          (party.length ? ' Photos your guests have taken tonight are down the bottom.' : '');
        var chosen = {};
        editing.items.forEach(function(it){ if(it.id) chosen[it.id] = it; });
        /* Two different URLs on purpose.
           thumb() is for THIS screen only and carries the host key, which is fine
           because only the host is looking at it.
           shown() is what gets SAVED into the game and later broadcast to the
           whole room, so it must never contain a key. It is the photo id alone,
           which is an unguessable UUID and reaches nothing but game photos. */
        function thumb(id){ return PPConfig.API + "/photo?code=" + encodeURIComponent(CODE) +
          "&key=" + encodeURIComponent(KEY) + "&id=" + encodeURIComponent(id); }
        function shown(id){ return PPConfig.API + "/game/photo?id=" + encodeURIComponent(id); }
        var url = thumb;
        function paint(){
          var h = '<label class="upbtn" for="gamePhotos">' +
                  (mine.length ? "Add more photos" : "Upload your photos") +
                  '</label><input type="file" id="gamePhotos" accept="image/*" multiple hidden>' +
                  '<div class="upnote" id="upnote"></div>';
          h += '<div class="pickgrid">' + pics.map(function(p){
            return '<button type="button" class="' + (chosen[p.id] ? "on" : "") + '" data-pick="' + esc(p.id) + '">' +
                   '<img loading="lazy" src="' + url(p.id) + '" alt=""></button>'; }).join("") + '</div>';
          var picked = Object.keys(chosen);
          if(picked.length){
            h += picked.map(function(id, i){
              var it = chosen[id];
              return '<div class="qrow"><div class="n"><span>' + (i+1) + '</span>' +
                '<button type="button" data-unpick="' + esc(id) + '">Remove</button></div>' +
                '<img class="shot" src="' + url(id) + '" alt="">' +
                '<div><label>Who is it?</label><textarea data-who="' + esc(id) + '">' + esc(it.a || "") + '</textarea></div>' +
                '<div><label>Clue (optional)</label><textarea data-clue="' + esc(id) + '">' + esc(it.q || "") + '</textarea></div>' +
                '</div>'; }).join("");
          }
          $("pickWrap").innerHTML = h;
          var f = $("gamePhotos");
          if(f) f.addEventListener("change", function(ev){
            var files = Array.prototype.slice.call(ev.target.files || []);
            ev.target.value = "";
            if(!files.length) return;
            var note = $("upnote"), done = 0;
            note.textContent = "Sending 1 of " + files.length + "...";
            /* One at a time and shrunk first, same as the guests. A host on a
               phone adding twenty baby photos is the same upload problem. */
            files.reduce(function(chain, file){
              return chain.then(function(){
                return PPPhoto.shrink(file).then(function(blob){
                  return fetch(PPConfig.API + "/photos/host?code=" + encodeURIComponent(CODE) +
                               "&key=" + encodeURIComponent(KEY), {
                    method:"POST", headers:{ "content-type":"image/jpeg" }, body: blob
                  }).then(function(r){
                    if(!r.ok) return r.json().then(function(j){ throw new Error(j.error||"That did not send."); });
                    return r.json();
                  }).then(function(j){
                    done++; mine.push({id:j.id}); pics.unshift({id:j.id});
                    chosen[j.id] = { id:j.id, q:"", a:"", url:shown(j.id) };
                    note.textContent = done < files.length
                      ? "Sending " + (done+1) + " of " + files.length + "..." : "";
                  });
                }).catch(function(e){ note.textContent = e.message; });
              });
            }, Promise.resolve()).then(function(){ paint(); });
          });
        }
        function grab(){
          Array.prototype.forEach.call($("pickWrap").querySelectorAll("[data-who]"), function(el){
            var id = el.getAttribute("data-who"); if(chosen[id]) chosen[id].a = el.value; });
          Array.prototype.forEach.call($("pickWrap").querySelectorAll("[data-clue]"), function(el){
            var id = el.getAttribute("data-clue"); if(chosen[id]) chosen[id].q = el.value; });
        }
        $("pickWrap").addEventListener("click", function(ev){
          var b = ev.target.closest ? ev.target.closest("[data-pick],[data-unpick]") : null;
          if(!b) return;
          grab();
          if(b.hasAttribute("data-pick")){
            var id = b.getAttribute("data-pick");
            if(chosen[id]) delete chosen[id];
            else chosen[id] = { id:id, q:"", a:"", url:shown(id) };
          } else { delete chosen[b.getAttribute("data-unpick")]; }
          paint();
        });
        editing._collect = function(){
          grab();
          return Object.keys(chosen).map(function(id){
            return { id:id, q:chosen[id].q, a:chosen[id].a, url:shown(id) };
          }).filter(function(x){ return (x.a||"").trim(); });
        };
        paint();
      })
      .catch(function(e){ $("pickHint").textContent = e.message; });
  }

  function harvest(){
    editing.title = ($("gTitle") && $("gTitle").value.trim()) || "";
    Array.prototype.forEach.call($("dBody").querySelectorAll("[data-q]"), function(el){
      editing.items[+el.getAttribute("data-q")].q = el.value;
    });
    Array.prototype.forEach.call($("dBody").querySelectorAll("[data-a]"), function(el){
      editing.items[+el.getAttribute("data-a")].a = el.value;
    });
  }

  function saveGame(){
    var items;
    if(editing._collect){
      // the picker knows its own shape: what matters is WHO, not the clue
      editing.title = ($("gTitle") && $("gTitle").value.trim()) || "";
      items = editing._collect();
      if(!items.length){ toast("Pick a photo and say who is in it."); return; }
    } else {
      harvest();
      items = editing.items.filter(function(it){ return (it.q||"").trim(); });
      if(!items.length){ toast("Add at least one before saving."); return; }
    }
    $("dSave").disabled = true; $("dSave").textContent = "Saving...";
    api("/games", { method:"POST", body: JSON.stringify({
      code:CODE, key:KEY, id:editing.id, format:editing.format,
      title: editing.title || null, config:{ items:items }
    })}).then(function(){
      $("dlg").close(); toast("Saved");
      return api("/games?code=" + encodeURIComponent(CODE) + "&key=" + encodeURIComponent(KEY));
    }).then(function(d){ if(d){ GAMES = d.games || []; render(); } })
      .catch(function(e){ toast(e.message); })
      .then(function(){ $("dSave").disabled = false; $("dSave").textContent = "Save game"; });
  }

  /* ------------------------------------------------------------- listeners --- */
  document.addEventListener("click", function(ev){
    var el = ev.target.closest ? ev.target.closest("[data-add],[data-edit],[data-del],[data-rm],#addItem") : null;
    if(!el) return;

    if(el.hasAttribute("data-add")){
      var fmt = el.getAttribute("data-add");
      if(!TYPES[fmt].q){
        /* Nothing to build. Add it and get out of the way.

           ONE CLICK, ONE GAME. Every tap used to fire its own POST, and the
           list does not redraw until the round trip comes back, so an
           impatient double tap on a phone added the game twice and the host
           was left deleting one. Games with a builder are safe because the
           builder opens instantly; these instant ones were not.

           The button is disabled for the whole round trip, and re-enabled on
           failure so a dropped connection does not leave a dead button. */
        if(el.disabled) return;
        el.disabled = true;
        api("/games", { method:"POST", body: JSON.stringify({ code:CODE, key:KEY, format:fmt, config:{} }) })
          .then(function(){ toast(TYPES[fmt].name + " added");
            return api("/games?code=" + encodeURIComponent(CODE) + "&key=" + encodeURIComponent(KEY)); })
          .then(function(d){ GAMES = d.games || []; render(); })
          .catch(function(e){ el.disabled = false; toast(e.message); });
      } else openBuilder(fmt, null);
      return;
    }
    if(el.hasAttribute("data-edit")){
      var g = GAMES.filter(function(x){ return String(x.id) === el.getAttribute("data-edit"); })[0];
      if(g) openBuilder(g.format, g);
      return;
    }
    if(el.hasAttribute("data-del")){
      var id = el.getAttribute("data-del");
      var g2 = GAMES.filter(function(x){ return String(x.id) === id; })[0];
      var n = (g2 && g2.config && g2.config.items && g2.config.items.length) || 0;
      // Only ask when there is something to lose. Confirming a game with no
      // content in it is friction for nothing.
      if(n && !window.confirm("Remove this game? It has " + n + (n===1?" item":" items") + " in it.")) return;
      api("/games/delete", { method:"POST", body: JSON.stringify({ code:CODE, key:KEY, id:id }) })
        .then(function(){ GAMES = GAMES.filter(function(x){ return String(x.id) !== id; }); render(); toast("Removed"); })
        .catch(function(e){ toast(e.message); });
      return;
    }
    if(el.id === "dlAll"){ downloadAll(); return; }
    if(el.id === "copyShare"){
      var link = $("album").getAttribute("data-share") || "";
      if(navigator.clipboard) navigator.clipboard.writeText(link).then(function(){ toast("Link copied"); },
        function(){ window.prompt("Copy this link", link); });
      else window.prompt("Copy this link", link);
      return;
    }
    if(el.id === "addItem"){ harvest(); editing.items.push({ q:"", a:"" }); drawItems(); return; }
    if(el.hasAttribute("data-rm")){ harvest(); editing.items.splice(+el.getAttribute("data-rm"),1); drawItems(); return; }
  });
  $("dCancel").addEventListener("click", function(){ $("dlg").close(); });
  $("dSave").addEventListener("click", saveGame);

  load();
})();
</script>
</body>
</html>
