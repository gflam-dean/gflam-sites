<!--
  A REAL NOT-FOUND PAGE (14 Oct 2026 audit).

  Without a 404.html at the root, Cloudflare Pages treats the site as a single-page app and
  answers ANY unknown address with the homepage and a 200. So a mistyped link looked like the
  homepage, search engines indexed junk addresses as copies of it, and a page that failed to
  deploy could not be told from one that had. With this file present, Pages serves it with a
  real 404 status for every address it has no file for, at any depth.

  Every link and asset here is absolute (/...), because this page is served AT the missing
  address, which can be several folders deep.
-->

       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;padding:32px 26px}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:22px;color:var(--text);text-decoration:none}
  .brand span{font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:700;font-size:15px;letter-spacing:.01em}
  h1{font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:24px;line-height:1.25;margin:0 0 10px}
  p{margin:0 0 14px;color:var(--muted)}
  .go{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  .go a{display:block;padding:13px 16px;border-radius:10px;text-decoration:none;font-weight:700;text-align:center}
  .go a.main{background:var(--pink);color:#fff}
  .go a.alt{border:1px solid var(--line);color:var(--text)}
  .go a.alt:hover{border-color:rgba(255,31,142,.55)}
  .foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
  .foot a{color:var(--text)}
</style>
