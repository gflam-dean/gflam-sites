<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VenuePlay Raffle: Big Screen</title>
<link rel="icon" type="image/png" href="/logos/venueplay_appicon_rebuilt.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@500;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A0B; --ink-2:#121214; --ink-3:#17171A;
    --pink:#FF1F8E; --pink-deep:#C70F69;
    --gold:#FFC24B; --win:#35D07F; --roll:#F5A524;
    --white:#FFFFFF; --text:#E7E7EC; --muted:#9A9AA4; --faint:#6C6C76;
    --line:rgba(255,255,255,0.10); --line-2:rgba(255,255,255,0.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow-x:clip}
  body{background:#050506;color:var(--text);font-family:'Manrope',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}

  .tv{position:fixed;inset:0;container-type:inline-size;background:radial-gradient(1200px 700px at 80% -10%, rgba(255,31,142,.12), transparent 60%), #050506;overflow:hidden}
  .layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4% 6%}
  .hidden{display:none!important}

  .tv-corner{position:absolute;top:2cqw;right:2.4cqw;display:flex;align-items:center;gap:.8cqw;opacity:.92;z-index:6}
  .tv-corner .vn{font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:clamp(11px,1.5cqw,20px);color:var(--text)}
  .tv-corner svg{filter:drop-shadow(0 0 3px rgba(255,31,142,.9))}
  .tv-status{position:absolute;top:2cqw;left:2.4cqw;display:flex;align-items:center;gap:.7cqw;z-index:6;font-family:'Hanken Grotesk',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:clamp(8px,1.1cqw,13px);color:var(--muted)}
  .sdot{width:.8cqw;height:.8cqw;min-width:8px;min-height:8px;border-radius:50%;background:var(--roll);box-shadow:0 0 8px var(--roll)}
  .sdot.on{background:var(--win);box-shadow:0 0 8px var(--win)}

  .eyebrow{font-family:'Hanken Grotesk',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.22em;font-size:clamp(10px,1.9cqw,15px);color:var(--muted)}
  .jsub{font-family:'JetBrains Mono',monospace;font-size:clamp(11px,2cqw,16px);color:var(--muted);margin-top:2cqw;letter-spacing:.02em}
  .jsub b{color:var(--gold)}

  /* idle promo */
  /* The idle "Get your tickets" call-to-action, a touch bigger than a prize name so it reads across
     the room, with the prizes listed under it so people can see what they are playing for. */
  #idlePrize{font-size:clamp(40px,10.5cqw,158px)}
  .prizemenu{display:flex;flex-direction:column;align-items:center;gap:.6cqw;margin-top:2.2cqw}
  .prizemenu .pmh{font-family:'Hanken Grotesk',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.16em;font-size:clamp(11px,2cqw,20px);color:var(--gold);margin-bottom:.3cqw}
  .prizemenu .pmi{font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:clamp(17px,3.4cqw,40px);color:#fff;line-height:1.12}
  .prizebig{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(30px,8cqw,120px);line-height:.98;margin:1.4cqw 0 .4cqw;
    background:linear-gradient(100deg,#E9A93A 0%,#FFC24B 30%,#FFF0C6 48%,#FFC24B 66%,#E9A93A 100%);background-size:220% auto;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 0 22px rgba(255,194,75,.3));animation:shimmer 4.5s linear infinite}
  @keyframes shimmer{to{background-position:220% center}}

  /* persistent host line (idle only) */
  .hostline{position:absolute;left:2cqw;bottom:2cqw;right:2cqw;display:flex;align-items:center;justify-content:center;gap:1cqw;z-index:6;
    background:rgba(0,0,0,.42);border:1px solid var(--line-2);border-radius:1.2cqw;padding:1cqw 1.6cqw;backdrop-filter:blur(4px);
    font-family:'JetBrains Mono',monospace;font-size:clamp(10px,1.7cqw,16px);color:var(--faint);flex-wrap:wrap;text-align:center}
  .hostline b{color:var(--pink)}
  .hostline .code{color:var(--gold);font-weight:700;letter-spacing:.08em;background:rgba(255,194,75,.1);border:1px solid rgba(255,194,75,.3);border-radius:.7cqw;padding:.2cqw 1cqw}

  /* draw + win */
  .prizetag{font-family:'Hanken Grotesk',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:clamp(11px,2.2cqw,22px);color:var(--gold);margin-bottom:.6cqw}
  .spin{font-family:'JetBrains Mono',monospace;font-weight:700;color:#fff;line-height:1;text-shadow:0 0 40px rgba(255,255,255,.2);white-space:nowrap}
  .drawing{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(16px,3.4cqw,40px);color:var(--pink);letter-spacing:.1em;margin-top:1.4cqw}
  .winnum{font-family:'JetBrains Mono',monospace;font-weight:700;color:#fff;line-height:.92;text-shadow:0 0 60px rgba(255,31,142,.4);white-space:nowrap}
  .winlist{display:flex;flex-wrap:wrap;justify-content:center;gap:2.2cqw;margin-top:1cqw}
  .winlist span{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(28px,9cqw,86px);color:#fff;text-shadow:0 0 40px rgba(255,31,142,.35)}
  .present{font-family:'JetBrains Mono',monospace;font-size:clamp(13px,2.8cqw,26px);color:#fff;margin-top:2cqw}
  .present b{color:var(--gold)}
  .resmsg{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(24px,6cqw,84px);line-height:1.02;margin-top:.6cqw;color:var(--win);text-shadow:0 0 34px rgba(53,208,127,.4)}

  .confetti{position:absolute;top:-2cqw;width:.7cqw;height:1.1cqw;min-width:7px;min-height:11px;border-radius:2px;opacity:.95;z-index:8;pointer-events:none;animation:confettiFall linear forwards}
  @keyframes confettiFall{0%{transform:translateY(-3vh) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(680deg);opacity:.85}}
  .winburst{position:absolute;inset:0;background:radial-gradient(closest-side, rgba(255,194,75,.13), transparent 68%);opacity:0;z-index:1;transition:opacity .7s ease}
  .winburst.show{opacity:1}
  .pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
</style>
</head>
<body>
<div class="tv" id="tv">
  <div class="winburst" id="winBurst"></div>

  <div class="tv-status"><span class="sdot" id="statusDot"></span><span id="statusText">Connecting</span></div>
  <div class="tv-corner">
    <svg width="18" height="21" viewBox="0 0 26 30" fill="none"><path d="M2 3 L24 15 L2 27 Z" fill="none" stroke="#FF1F8E" stroke-width="2.6" stroke-linejoin="round"/></svg>
    <span class="vn">VenuePlay</span>
  </div>

  <!-- idle -->
  <div class="layer" id="tvIdle">
    <div class="eyebrow" id="idleEye">Raffle tonight</div>
    <div class="prizebig" id="idlePrize">Get your tickets</div>
    <div class="jsub" id="idleSub">Drawn tonight</div>
    <div class="prizemenu" id="idlePrizes"></div>
  </div>

  <!-- drawing -->
  <div class="layer hidden" id="tvDraw">
    <div class="prizetag" id="tvDrawPrize">Meat Tray</div>
    <div class="eyebrow">Drawing now</div>
    <div class="spin" id="tvSpin">0</div>
    <div class="drawing pulse">Good luck&hellip;</div>
  </div>

  <!-- winner -->
  <div class="layer hidden" id="tvWin">
    <div class="prizetag" id="tvWinPrize">Meat Tray</div>
    <div class="eyebrow" id="tvWinEye">Winning ticket</div>
    <div class="winnum" id="tvWinNum">0</div>
    <div class="winlist hidden" id="tvWinList"></div>
    <div class="present" id="tvPresent">Bring your winning ticket to claim</div>
  </div>

  <!-- result / claimed -->
  <div class="layer hidden" id="tvResult">
    <div class="eyebrow">&#127881; We have a winner</div>
    <div class="resmsg" id="tvResMsg">Ticket 0 wins!</div>
    <div class="prizetag" id="tvResPrize" style="color:var(--gold);margin-top:.8cqw">Meat Tray</div>
  </div>

  <!-- persistent host connect line (idle only) -->
  <div class="hostline" id="hostLine">
    Host: open <b>venueplay.com.au/app/raffle/host</b> and enter code <span class="code" id="hostLineCode">------</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/app/vp-sign.js"></script>
<script src="/app/vp-screen-router.js"></script>
<script>
(function(){
  "use strict";
  var VP_SCREEN_API='https://venueplay-game.dean-tindale.workers.dev';
  function $(id){ return document.getElementById(id); }
  function cryptoInt(max){ var a=new Uint32Array(1),lim=Math.floor(4294967296/max)*max,x; do{ crypto.getRandomValues(a); x=a[0]; }while(x>=lim); return x%max; }

  var CODE_ALPHABET="ACDEFGHJKMNPQRSTUVWXYZ2345679";
  function makeCode(){ var s=""; for(var i=0;i<6;i++) s+=CODE_ALPHABET.charAt(cryptoInt(CODE_ALPHABET.length)); return s; }

  var SUPA_URL='https://gpoolavkghnxedzrmtmc.supabase.co';
  var SUPA_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdwb29sYXZrZ2hueGVkenJtdG1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMjM3MzcsImV4cCI6MjA5Mjc5OTczN30.5si7UoInmLJqkllXNnyVn9yBw_U9GhBARDZvgR_p0DE';

  // Stable screen code, persisted so the pairing link never changes across refreshes.
  var CODE_RE=/^[ACDEFGHJKMNPQRSTUVWXYZ2345679]{6}$/;
  function venueCode(slug){
    var s=String(slug||"").toLowerCase().replace(/[^a-z0-9]/g,""), h=2166136261>>>0;
    for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
    var A="ACDEFGHJKMNPQRSTUVWXYZ2345679", out="", x=h||1;
    for(var j=0;j<6;j++){ x=(Math.imul(x,1103515245)+12345)>>>0; out+=A[x%A.length]; }
    return out;
  }
  var VENUE_SLUG=(function(){
    var q=window.location.search||"";
    var m=/[?&]venue=([^&]+)/.exec(q); var raw=m?m[1]:"";
    if(!raw){ var bare=q.replace(/^\?/,"").split("&")[0]; if(bare && bare.indexOf("=")===-1) raw=bare; }
    var v=raw?decodeURIComponent(raw).toLowerCase().replace(/[^a-z0-9-]/g,""):"";
    if(v){ try{ localStorage.setItem("vpTvVenue", v); }catch(e){} return v; }
    try{ var s=localStorage.getItem("vpTvVenue"); if(s) return s; }catch(e){}
    return "";
  })();
  var VP_GAME_API='https://venueplay-game.dean-tindale.workers.dev';
  // Verify host broadcasts (migrations 38/49): fetch this venue's PUBLIC key; vpGate drops forged
  // messages in enforce mode, and delivers as before when enforce is off or the script is absent.
  if(window.VPSign && VENUE_SLUG){ VPSign.initReceiver(VP_GAME_API, VENUE_SLUG); }
  function vpGate(payload, cb){ if(window.VPSign){ VPSign.gate(payload, cb); } else { cb(payload); } }
  // ---- divert guard: a venue screen is NEVER a landing page. The only entry is the unified /tv link,
  //      which hops here (sessionStorage vpTvHop) the moment a game goes on air. A direct or bookmarked
  //      open is bounced straight to /tv so a screen is only ever the live link. ----
  if(VENUE_SLUG){
    var _hop=""; try{ _hop=sessionStorage.getItem("vpTvHop")||""; }catch(e){}
    if(!_hop){ window.location.replace("/tv?venue="+encodeURIComponent(VENUE_SLUG)); return; }   // bounce only a genuine cold/bookmarked open; any live /tv hop leaves a marker so it never flickers
  }
  var CODE=(function(){
    if(VENUE_SLUG) return venueCode("raffle-"+VENUE_SLUG);   // auto-pair by venue (game-namespaced)
    try{ var c=localStorage.getItem("vpTvCodeRaffle"); if(c && CODE_RE.test(c)) return c; }catch(e){}
    var nc=makeCode(); try{ localStorage.setItem("vpTvCodeRaffle", nc); }catch(e){} return nc;
  })();

  // ---- screen state ----
  var S={ padW:3, min:1, max:150, prizeLabel:"", nextUp:false, hostSeen:false, prizes:[],
          spinTimer:null, countdownTimer:null, remaining:0, celebrateTimer:null };

  function pad(n){ var s=String(n); while(s.length<S.padW) s="0"+s; return s; }
  function secsToClock(s){ var m=Math.floor(s/60),r=s%60; return m+":"+(r<10?"0":"")+r; }

  // auto-fit big numbers so 6 digits never clip
  function fitBig(el, displayText, sizeText, capCqw){
    var w=($("tv").clientWidth)||600;
    var chars=Math.max(1,(sizeText||displayText||"0").length);
    var fit=(w*0.9)/(chars*0.62);
    var cap=w*capCqw/100;
    el.style.fontSize=Math.max(18,Math.min(fit,cap))+"px";
    if(displayText!=null) el.textContent=displayText;
  }

  // ---- layers ----
  var LAYERS=["tvIdle","tvDraw","tvWin","tvResult"];
  function showLayer(which){
    for(var i=0;i<LAYERS.length;i++){ $(LAYERS[i]).classList.toggle("hidden", LAYERS[i]!==which); }
    // The host link + code line is only for a screen paired by hand. A venue-linked screen
    // auto-pairs, so never show it there (it was popping up after a claim).
    $("hostLine").classList.toggle("hidden", which!=="tvIdle" || !!VENUE_SLUG || !!S.hostSeen);
  }

  // ---- spin ----
  function stopSpin(){ if(S.spinTimer){ clearInterval(S.spinTimer); S.spinTimer=null; } }
  function startSpin(){
    stopSpin();
    var el=$("tvSpin");
    fitBig(el, pad(S.max), pad(S.max), 20);
    S.spinTimer=setInterval(function(){
      var span=Math.max(1,S.max-S.min+1);
      el.textContent=pad(S.min+cryptoInt(span));
    },90);
  }

  // ---- countdown ----
  function stopCountdown(){ if(S.countdownTimer){ clearInterval(S.countdownTimer); S.countdownTimer=null; } }
  function updateCd(){ var cd=$("tvCd"); if(cd) cd.textContent=secsToClock(Math.max(0,S.remaining)); }

  // ---- confetti ----
  function stopCelebrate(){ if(S.celebrateTimer){ clearInterval(S.celebrateTimer); S.celebrateTimer=null; } $("winBurst").classList.remove("show"); }
  function spawnBurst(count){
    var tv=$("tv"), colors=["#FF1F8E","#FFC24B","#35D07F","#FFFFFF","#C70F69"];
    for(var i=0;i<count;i++){
      var c=document.createElement("div"); c.className="confetti";
      c.style.left=cryptoInt(100)+"%"; c.style.background=colors[i%colors.length];
      c.style.animationDelay=(cryptoInt(400)/1000)+"s"; c.style.animationDuration=(2.1+cryptoInt(180)/100)+"s";
      tv.appendChild(c);
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },3800); })(c);
    }
  }
  // ---- win fanfare through the venue PA (synthesised, no audio file; Fully Kiosk must allow autoplay to sound) ----
  var _ac=null;
  function unlockAudio(){ try{ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; if(!_ac) _ac=new AC(); if(_ac.state==="suspended") _ac.resume(); }catch(e){} }
  document.addEventListener("pointerdown", unlockAudio, { once:true });
  function playFanfare(){
    try{
      var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      if(!_ac) _ac=new AC(); if(_ac.state==="suspended") _ac.resume();
      var ctx=_ac, now=ctx.currentTime;
      var master=ctx.createGain(); master.gain.value=0.6;
      var comp=ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
      function tone(freq,start,dur,peak,type){
        var o=ctx.createOscillator(), g=ctx.createGain();
        o.type=type||"triangle"; o.frequency.value=freq;
        g.gain.setValueAtTime(0.0001,start); g.gain.exponentialRampToValueAtTime(peak,start+0.03); g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
        o.connect(g); g.connect(master); o.start(start); o.stop(start+dur+0.05);
      }
      var notes=[523.25,659.25,783.99,1046.50];
      for(var i=0;i<notes.length;i++){ tone(notes[i], now+i*0.12, 0.55, 0.5, "triangle"); }
      var tc=now+notes.length*0.12, chord=[523.25,1046.50,1318.51,1567.98];
      for(var j=0;j<chord.length;j++){ tone(chord[j], tc, 1.05, j===0?0.5:0.32, "sine"); }
    }catch(e){}
  }
  function celebrate(ms){
    playFanfare();
    stopCelebrate(); $("winBurst").classList.add("show"); spawnBurst(90);
    var elapsed=0; S.celebrateTimer=setInterval(function(){ elapsed+=1300; spawnBurst(46); if(elapsed>=ms) stopCelebrate(); },1300);
  }

  // ---- renders ----
  // After a win is shown, drift back to the venue ads after ~1 minute (single-draw case). Any
  // new draw activity cancels it. On a venue screen we return to /tv (the real venue ads).
  var _adsRet=null;
  function cancelAdsReturn(){ if(_adsRet){ clearTimeout(_adsRet); _adsRet=null; } }
  function scheduleAdsReturn(ms){ cancelAdsReturn(); _adsRet=setTimeout(function(){
    if(VENUE_SLUG){ window.location.href="/tv?venue="+encodeURIComponent(VENUE_SLUG); } else { renderIdle(); }
  }, (ms>0?ms:60000)); }
  function renderIdle(){
    /* Deliberately does NOT cancel the return to ads. The host's own end-of-raffle sequence is
       claimed, then t:"idle" nine seconds later, and idle lands here: cancelling meant the timer
       armed by the last prize was killed on every raffle that finished normally, so the wall sat
       on "Raffle tonight, get your tickets" instead of the venue's paid advertising. Worse, the
       parent still counts as embedded while that is up, which switches off the black-screen
       watchdog and the self-update. Anything that genuinely starts a new round (drawing, winner)
       cancels it at its own call site. */
    stopSpin(); stopCountdown(); stopCelebrate();
    var pz=S.prizeLabel||"";
    if(S.nextUp && pz){   // a prize was just drawn and there are more to come
      $("idleEye").textContent="Next prize is"; $("idlePrize").textContent=pz; $("idleSub").textContent="Drawn shortly";
    } else {
      // Keep the call-to-action prominent and list the prizes below it, so the room can see what
      // they are playing for (rather than the headline swapping to a single prize name).
      $("idleEye").textContent="Raffle tonight"; $("idlePrize").textContent="Get your tickets"; $("idleSub").textContent="Drawn tonight";
    }
    renderPrizeMenu();
    showLayer("tvIdle");
  }
  function renderPrizeMenu(){
    var box=$("idlePrizes"); if(!box) return;
    box.innerHTML="";
    var ps=(S.prizes||[]).filter(Boolean);
    if(!ps.length) return;
    // textContent, not innerHTML: prize labels arrive over the public broadcast, so a forged one
    // must never be able to inject markup onto the venue's screen.
    var head=document.createElement("div"); head.className="pmh";
    head.textContent = ps.length>1 ? "Prizes tonight" : "Tonight's prize"; box.appendChild(head);
    for(var i=0;i<ps.length;i++){ var d=document.createElement("div"); d.className="pmi"; d.textContent=String(ps[i]); box.appendChild(d); }
  }
  function renderDrawing(){
    cancelAdsReturn();
    stopCountdown(); stopCelebrate();
    $("tvDrawPrize").textContent=S.prizeLabel;
    showLayer("tvDraw");
    startSpin();
  }
  function renderWinner(nums, allowRedraw, time){
    stopSpin(); stopCountdown(); stopCelebrate();
    var multi=nums.length>1;
    $("tvWinPrize").textContent=S.prizeLabel;
    $("tvWinEye").textContent=multi?"Winning tickets":"Winning ticket";
    if(multi){
      $("tvWinNum").classList.add("hidden");
      var tl=$("tvWinList"); tl.classList.remove("hidden"); tl.innerHTML="";
      for(var i=0;i<nums.length;i++){ var sp=document.createElement("span"); sp.textContent=pad(nums[i]); tl.appendChild(sp); }
    } else {
      $("tvWinList").classList.add("hidden");
      $("tvWinNum").classList.remove("hidden");
      fitBig($("tvWinNum"), pad(nums[0]), pad(S.max), 26);
    }
    if(allowRedraw && time>0){
      S.remaining=time;
      $("tvPresent").innerHTML='Claim within <b id="tvCd">'+secsToClock(S.remaining)+'</b>';
      S.countdownTimer=setInterval(function(){ S.remaining--; updateCd(); if(S.remaining<=0){ stopCountdown(); } },1000);
    } else {
      $("tvPresent").innerHTML='<span style="color:var(--win)">Bring your winning ticket to claim</span>';
    }
    showLayer("tvWin");
    /* Outlast the CLAIM WINDOW. This was a flat 60 seconds while the default claim time is 180,
       so on every single draw the winning ticket came off the wall two minutes early and the
       screen went back to the venue's ads. It did not come back either: the parent /tv blanks the
       frame on that navigation, so the claim celebration and the next prize were never shown. */
    scheduleAdsReturn(Math.max(60000, (time||0)*1000 + 30000));
  }
  function renderClaimed(nums){
    stopSpin(); stopCountdown();
    var multi=nums.length>1;
    $("tvResMsg").textContent = multi ? (nums.length+" winning tickets!") : ("Ticket "+pad(nums[0])+" wins!");
    $("tvResPrize").textContent=S.prizeLabel;
    showLayer("tvResult");
    celebrate(30000);
    scheduleAdsReturn();
  }

  // ---- realtime ----
  /* The Realtime library comes from a CDN. On slow venue wifi it is not here yet when this runs,
     and every line below depends on it, so the page used to die silently right here. On the
     members screen that is a literally black pub TV, because the ad loop starts further down and
     .ad is opacity:0 until it does. The parent /tv watchdog cannot see it either: an embedded
     screen always counts as alive, and the iframe load event fires normally even when the inner
     script throws. Nobody is going to find the Fire Stick remote mid-service, so say something
     and get the kiosk back on its own. */
  if(typeof supabase==="undefined" || !supabase.createClient){
    var _rc=document.createElement("div");
    _rc.setAttribute("style","position:fixed;inset:0;z-index:99999;display:flex;align-items:center;"+
      "justify-content:center;background:#0A0A0B;color:#9A9AA4;text-align:center;padding:24px;"+
      "font:600 24px/1.4 system-ui,-apple-system,sans-serif");
    _rc.textContent="Reconnecting to VenuePlay\u2026";
    (document.body||document.documentElement).appendChild(_rc);
    /* Cap the retries. This reloaded every 4 seconds indefinitely, and the parent /tv marks the
       embed as loaded on each one, so its own 25 second deadline never fired: a blocked CDN meant
       a grey card flashing all night with no fallback. After three attempts go to /tv, which has
       the venue's ad loop and the real watchdog. */
    var _tries=0; try{ _tries=parseInt(sessionStorage.getItem("vpCdnTries")||"0",10)||0; }catch(e){}
    if(_tries>=3){
      try{ sessionStorage.removeItem("vpCdnTries"); }catch(e){}
      if(typeof VENUE_SLUG!=="undefined" && VENUE_SLUG){ location.replace("/tv?venue="+encodeURIComponent(VENUE_SLUG)); }
    } else {
      try{ sessionStorage.setItem("vpCdnTries", String(_tries+1)); }catch(e){}
      setTimeout(function(){ location.reload(); }, 4000);
    }
    throw new Error("VenuePlay: Realtime library not loaded yet");
  }
  try{ sessionStorage.removeItem("vpCdnTries"); }catch(e){}   // loaded: reset the retry count
  var client=supabase.createClient(SUPA_URL, SUPA_ANON);
  // Unified TV: hop to whatever OTHER game a host puts on air (and back to bingo) on the same
  // /tv link. Listen only (no tv_here ping) so two games that are both live can't ping-pong.
  /* Follow the night. The shared router is in /app/vp-screen-router.js: it hops
     on any traffic that means a game is genuinely on air, not only on t:"mode",
     which a host sends once and only once. Four copies of this had drifted apart,
     which is how a raffle came to draw its numbers with the finished quiz still
     on the wall. */
  var _router = { seen: function(){} };
  if(window.VPScreenRouter && VENUE_SLUG){
    _router = VPScreenRouter.start({
      client: client, self: "raffle", slug: VENUE_SLUG, venueCode: venueCode, gate: vpGate,
      busy: function(){ return S.phase && S.phase !== "idle"; }
    });
  }
  if(VENUE_SLUG){ var _tvs=document.querySelector(".tv-status"); if(_tvs) _tvs.style.display="none"; }   // no "connected" pill on a live venue screen
  var ch=client.channel("vp-"+CODE, { config:{ broadcast:{ self:false } } });   // match the host + the unified TV convention
  var tvSubscribed=false;
  function tvSend(obj){ if(tvSubscribed && ch){ ch.send({ type:"broadcast", event:"msg", payload:obj }); } }
  ch.on("broadcast", { event:"msg" }, function(e){ vpGate(e.payload, function(_m){
    // The venue saved a logo or a slide on the Account page. Re-read it now rather than
    // leaving the screen showing whatever it happened to load with.
    if(_m && _m.t==="screen_refresh"){ try{ reloadVenueLogo(); }catch(_){} return; }
    onMsg(_m);
  }); });
  ch.subscribe(function(status){
    if(status==="SUBSCRIBED"){ tvSubscribed=true; tvSend({ t:"tv_here", hello:true }); $("statusDot").classList.add("on"); $("statusText").textContent="Connected"; }
    else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){ tvSubscribed=false; $("statusDot").classList.remove("on"); $("statusText").textContent="Reconnecting"; }
  });

  // Host message types the screen reacts to. On any of them it marks the host seen and
  // replies tv_here so a freshly (re)loaded console re-syncs, same handshake as the trivia TV.
  var HOST_TYPES={host_here:1,state:1,idle:1,drawing:1,winner:1,claimed:1,redraw:1};
  function onMsg(m){
    _router.seen();   // our game is still talking, so it is genuinely live
    if(!m||!m.t) return;
    if(m.t==="tv_here") return;                       // ignore our own presence pings
    if(HOST_TYPES[m.t]){ S.hostSeen=true; tvSend({ t:"tv_here" }); }

    if(typeof m.prizeLabel==="string") S.prizeLabel=m.prizeLabel;
    // The host tapped "Back to ads". Go now rather than sit through the 18 second
    // wind-down: they have finished and the room should be looking at the venue again.
    if(m.t==="to_ads"){ if(VENUE_SLUG) window.location.href="/tv?venue="+encodeURIComponent(VENUE_SLUG); return; }
    if(m.t==="idle"){ S.nextUp=!!m.next; if(Array.isArray(m.prizes)) S.prizes=m.prizes.filter(Boolean).slice(0,12); }   // showing the next prize after a draw, vs the raffle's first prize; prizes = what is still to win
    // pad() loops on this. It arrives over a public broadcast channel, so an absurd value
    // (or a hostile one) used to spin the render thread forever and freeze the TV.
    if(typeof m.pad==="number" && isFinite(m.pad)) S.padW=Math.max(1, Math.min(6, m.pad|0));
    if(typeof m.min==="number") S.min=m.min;
    if(typeof m.max==="number") S.max=m.max;

    /* A passive refresh must NOT wipe a winner or a claimed result off the wall. "host_here" is
       replayed whenever a console reloads or a socket re-joins, and the host sends "state" after
       the round has been cleared, so either one used to blank the drawn number mid-announcement.
       This screen had no phase at all, so it is tracked here. An explicit "idle" is the host
       saying they have finished with this prize, and still clears. */
    /* A SPIN IS A LIVE PHASE TOO, and it was the one left out.

       G.round is null for the whole four seconds of a draw, so the host answers a
       routine tv_here with sendState() - and /tv pings tv_here on every game
       channel each time its realtime reconnects, which nobody has to touch. That
       state landed here, fell past this guard, and rendered the idle card: the
       drum roll dropped back to "get your tickets" mid-draw and the winning
       number then appeared out of nowhere. */
    if((m.t==="host_here" || m.t==="state") &&
       (S.phase==="winner" || S.phase==="result" || S.phase==="drawing")) return;
    if(m.t==="host_here"){ S.phase="idle"; renderIdle(); return; }
    if(m.t==="state" || m.t==="idle"){ S.phase="idle"; renderIdle(); if(m.t==="idle") scheduleAdsReturn(); }
    else if(m.t==="drawing"){ S.phase="drawing"; renderDrawing(); }
    else if(m.t==="winner"){ S.phase="winner"; renderWinner(m.numbers||[], !!m.allowRedraw, m.time||0); }
    else if(m.t==="claimed"){ S.phase="result"; renderClaimed(m.numbers||[]); }
    else if(m.t==="redraw"){ S.phase="drawing"; renderDrawing(); }
  }

  // ---- resize keeps big numbers fitted ----
  window.addEventListener("resize", function(){
    if(!$("tvDraw").classList.contains("hidden")) fitBig($("tvSpin"), null, pad(S.max), 20);
    if(!$("tvWin").classList.contains("hidden") && !$("tvWinNum").classList.contains("hidden")) fitBig($("tvWinNum"), $("tvWinNum").textContent, pad(S.max), 26);
  });

  // ---- init ----
  $("hostLineCode").textContent=CODE;
  renderIdle();

  /* ---- the venue's own logo, top left ----------------------------------------------------
     The main TV has carried this since the logo upload shipped; these four game screens never
     did, so the moment a host put trivia or musical bingo on air the venue's branding vanished
     from its own screen. Same source and same corner as tv.html, injected so no markup anchor
     is needed. Best effort: any failure just leaves the screen as it was. */
  /* Re-runnable on purpose. This used to fetch once at load and never again, so a venue that
     uploaded its logo while a game was on air saw it appear on the advertising loop (tv.html
     re-fetches on screen_refresh) and NOT on the game screen, which had already loaded without
     one. That reads as "the logo doesn't work in games". */
  var reloadVenueLogo=function(){};
  (function venueLogo(){
    if(!VENUE_SLUG) return;
    function paint(url){
      var el=document.getElementById("venueLogo");
      if(!url){ if(el) el.style.display="none"; return; }   // logo removed: take it off the wall
      if(!el){ el=document.createElement("img"); el.id="venueLogo";
        el.style.cssText="position:fixed;top:20px;left:22px;max-height:64px;max-width:220px;z-index:60;pointer-events:none;filter:drop-shadow(0 2px 8px rgba(0,0,0,.55))";
        document.body.appendChild(el); }
      el.src=url; el.style.display="block";
    }
    function load(){
    try{
      /* Through the Worker, not straight at Supabase. The public grant on vp_venue_screen
         answered an unfiltered request with EVERY venue, which is the customer list. */
      fetch(VP_SCREEN_API+"/screen?venue="+encodeURIComponent(VENUE_SLUG))
        .then(function(r){ return r.ok?r.json():null; })
        .then(function(d){ if(d) paint(d.logo_url||""); })   // one object now, not an array
        .catch(function(){});
    }catch(e){}
    }
    reloadVenueLogo=load;
    load();
  })();
})();
</script>
</body>
</html>
