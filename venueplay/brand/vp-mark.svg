  THE VENUEPLAY LOGO, ONCE (31 Oct 2026; the F4 logo, 1 Nov 2026). The lowercase "venueplay" wordmark with the
  pink play triangle inside the a (112%), from the 2026 logo kit (~/venue-enrich/logo-kit-1nov).

    #wordmark        the logo in every header: letters in currentColor (each page's own text colour), the
                     triangle pink. Drawn in a viewBox of -1 -729 4676 936 (font units).
    #wordmark-print  the printed signs (signage.html): the same drawing
    #mark            the triangle on its own, for the few places that show only the mark: 0 0 26 30 box
    #mark-print      the same, for paper

  This file is the SOURCE. The pages carry the drawing inline, in every <svg data-vp-mark="...">, and
  tools/sync-brand-mark.py copies it there:

    python3 tools/sync-brand-mark.py --write     after changing this file
    python3 tools/sync-brand-mark.py             check every copy matches (exit 1 if not)

  Inline rather than <use href>: measured on a slow connection, a referenced file painted after the rest of
  the header, and never if its one request failed. No single quotes and no id attributes inside the groups.
  Opened on its own (an image) this file paints #wordmark.
-->
