<title>venueplay</title>
<!-- THE SHORT SIGN-IN LINK (Dean, 6 Nov 2026): venueplay.com.au/s/AB2CD7KMNPQR. The 12 letters are never a login key.
     This page asks the billing Worker (/short/open) where to go, and goes: the NORMAL sign-in with their mobile filled
     in, or with it empty when we hold none (the letters are left for the sign-in page, which puts the number they type
     on the account's login before the code is sent), or plain sign-in once the account has been signed in to. The
     open is recorded for HQ's history. The text code to their own mobile is what signs anyone in. -->
<script>
(function () {
  var m = /^\/s\/([A-Za-z0-9]{12})\/?$/.exec(location.pathname || '');
  var code = m ? m[1].toUpperCase() : '';
  if (!/^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{12}$/.test(code)) { location.replace('/app/'); return; }
  try { sessionStorage.removeItem('vpShortAttach'); sessionStorage.removeItem('vpShortExistingOnly'); } catch (e) {}
  var done = false, go = function (u) { if (done) return; done = true; location.replace(u || '/app/'); };
  setTimeout(function () { go('/app/'); }, 8000);   // the Worker not answering: the normal sign-in, never a dead page
  fetch('https://api.venueplay.com.au/short/open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code }) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var to = (j && typeof j.go === 'string' && /^\/app\/(\?signin=sms(#m=04\d{8})?)?$/.test(j.go)) ? j.go : '/app/';
      if (j && j.attach) { try { sessionStorage.setItem('vpShortAttach', code); } catch (e) {} }
      go(to);
    }, function () { go('/app/'); });
})();
</script>
