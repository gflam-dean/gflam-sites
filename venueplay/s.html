<title>venueplay</title>
<!-- THE SHORT SIGN-IN LINK IN A TEXT (Dean, 6 Nov 2026): venueplay.com.au/s/AB12CD7K. The 8 letters are a one-tap
     sign-in token (the billing Worker keeps only its hash, the same expiry and single use as every sign-in link).
     This page does one thing: it moves the code out of the address into /app/go's fragment, which is never sent to
     a server, and /app/go signs them in exactly as the long link does. Anything that is not a code goes to /app. -->
<script>
(function () {
  var m = /^\/s\/([A-Za-z0-9]{8})\/?$/.exec(location.pathname || '');
  var code = m ? m[1].toUpperCase() : '';
  if (!/^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{8}$/.test(code)) { location.replace('/app/'); return; }
  location.replace('/app/go#t=' + code);
})();
</script>
