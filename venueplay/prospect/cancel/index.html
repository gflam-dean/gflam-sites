<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VenuePlay · Cancel your account</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  THE CANCEL LINK IN A PROSPECT'S EMAILS LANDS HERE, ON venueplay.com.au (31 Oct 2026).

  It used to go straight to the billing Worker on its old Cloudflare address, and the welcome to a
  venue on Ozemail bounced: "550 5.7.1 Policy-DT510: Rejected content policy violation". A plain reply
  with only venueplay.com.au links went through. So no email a venue or a player gets carries that
  address, and this page does the asking. Old links (to the Worker) still work there. The page asks
  the Worker on its own name, api.venueplay.com.au (31 Oct 2026).

  OPENING THIS PAGE NEVER CANCELS ANYTHING. Mail scanners open every link in an email, and
  Microsoft's run the page's JavaScript too. On load the page only ASKS the Worker (a GET, which
  never writes) what to say: the venue's name, or that it is already done, or that the link has not
  worked. Only the button POSTs, and the Worker checks the signed token on that POST exactly as it
  always has. The words come from the Worker, so they are the same as its own page.

  NO ANALYTICS ON THIS PAGE. The account id and its token are in the address.
-->
<style>
  :root{ --ink:#0A0A0B; --ink-2:#121214; --pink:#FF1F8E; --text:#E7E7EC; --muted:#9A9AA4;
         --line:rgba(255,255,255,0.10); }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1200px 600px at 80% -10%, rgba(255,31,142,.10), transparent 60%), var(--ink);
       color:var(--text);font-family:'Manrope',system-ui,sans-serif;line-height:1.55;min-height:100vh;
       display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .card{max-width:520px;width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:30px 26px}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:22px;font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:16px;color:#fff}
  h1{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:24px;line-height:1.25;color:#fff;margin:0 0 12px}
  p{color:var(--muted);font-size:16px;margin:0 0 14px}
  button.go{margin-top:6px;width:100%;padding:14px 20px;border:0;border-radius:10px;background:var(--pink);color:#fff;
            font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:16px;cursor:pointer}
  button.go[disabled]{opacity:.6;cursor:default}
  .err{color:#FF8FC4;font-size:14.5px;margin-top:12px}
  .foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
  a{color:var(--pink);font-weight:700;text-decoration:none}
  .hidden{display:none}
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><svg width="18" height="21" viewBox="0 0 26 30" fill="none" aria-hidden="true"><path d="M2 3 L24 15 L2 27 Z" fill="none" stroke="#FF1F8E" stroke-width="2.6" stroke-linejoin="round"/></svg>VenuePlay</div>
    <h1 id="head">Cancel VenuePlay for your venue?</h1>
    <p id="lede">No problem at all, and thanks for having a look. There is no card on your account, so nothing has been charged and nothing will be. We will switch the account off and stop the reminders.</p>
    <div id="ask">
      <button type="button" class="go" id="go">Yes, cancel it</button>
    </div>
    <p id="err" class="err hidden" role="alert"></p>
    <noscript><p class="err">This page needs JavaScript to cancel. Reply to the email with the word cancel and we will do it for you.</p></noscript>
    <p class="foot" id="foot">Questions? Email <a href="mailto:support@venueplay.com.au">support@venueplay.com.au</a>.</p>
  </main>
<script>
(function () {
  var VP_WORKER = "https://api.venueplay.com.au";
  function $(id) { return document.getElementById(id); }
  /* The same param() as /unsubscribe, letter for letter (tools/check-twins.py). */
  function param(n) {
    try {
      var m = new RegExp("[?&]" + n + "=([^&]*)").exec(location.search);
      return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
    } catch (e) { return ""; }
  }
  /* What the Worker said: { state: 'ask' | 'done' | 'bad', title, text, foot }. Only 'ask' keeps the button. */
  function show(a) {
    if (a.title) $("head").textContent = a.title;
    if (a.text) $("lede").textContent = a.text;
    if (a.foot) $("foot").textContent = a.foot;
    $("ask").className = a.state === "ask" ? "" : "hidden";
    $("err").className = "err hidden";
  }
  var f = param("f"), t = param("t");
  if (!f || !t) {
    show({ state: "bad", title: "That link is not complete",
           text: "Check you opened the whole link from your email, or reply to the email and we will sort it out for you." });
    return;
  }
  /* A GET, which never cancels: it only fills in the venue's name, or says it is already done. */
  fetch(VP_WORKER + "/prospect/cancel?f=" + encodeURIComponent(f) + "&t=" + encodeURIComponent(t) + "&reply=json",
        { method: "GET", credentials: "omit" })
    .then(function (r) { return r.json(); })
    .then(function (a) { if (a && a.state) show(a); })
    .catch(function () { /* the question is already on the page; the button still works */ });
  /* THE BUTTON is the only thing that cancels. A form post, so the browser sends it without a preflight. */
  $("go").addEventListener("click", function () {
    var go = $("go");
    go.disabled = true; go.textContent = "One moment...";
    fetch(VP_WORKER + "/prospect/cancel", { method: "POST", credentials: "omit",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "f=" + encodeURIComponent(f) + "&t=" + encodeURIComponent(t) + "&reply=json" })
      .then(function (r) { return r.json(); })
      .then(function (a) { if (!a || !a.state) throw new Error("no answer"); show(a); })
      .catch(function () {
        go.disabled = false; go.textContent = "Yes, cancel it";
        $("err").textContent = "That did not go through. Please try again in a minute, or reply to the email and we will do it for you.";
        $("err").className = "err";
      });
  });
})();
</script>
</body>
</html>
