<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>See a night on VenuePlay</title>
<meta name="description" content="Tap through a real night on VenuePlay: the big screen, the host and a player, across bingo, trivia, musical bingo, raffles, members draws and screen ads.">
<link rel="canonical" href="https://www.venueplay.com.au/see-a-night">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0A0B'/%3E%3Cpath d='M13 9 L24 16 L13 23 Z' fill='%23FF1F8E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<style>
  :root {
    --stage: #0A0A0B;
    --panel: #121214;
    --panel-2: #17171B;
    --pink: #FF1F8E;
    --pink-deep: #C70F69;
    --white: #FFFFFF;
    --grey: #9A9AA4;
    --line: rgba(255,255,255,0.08);
    /* vars used by the real .vps-* mockups copied from the live site */
    --ink: #0A0A0B;
    --ink-2: #121214;
    --ink-3: #17171B;
    --muted: #9A9AA4;
    --muted-2: #6E6E78;
    --line-2: rgba(255,255,255,0.14);
    --glow: rgba(255,31,142,0.55);
  }

  * { box-sizing: border-box; }

  .vp-wrap {
    background: var(--stage);
    color: var(--white);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100%;
    padding: clamp(18px, 4vw, 48px);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .vp-inner {
    max-width: 1120px;
    margin: 0 auto;
  }

  .vp-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--pink);
    background: rgba(255,31,142,0.08);
    border: 1px solid rgba(255,31,142,0.28);
    padding: 6px 12px;
    border-radius: 999px;
    margin-bottom: 18px;
  }

  .vp-eyebrow .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--pink);
    box-shadow: 0 0 8px 1px var(--pink);
  }

  .vp-h1 {
    font-size: clamp(28px, 5vw, 46px);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
    line-height: 1.08;
  }
  .vp-h1 .accent { color: var(--pink); }

  .vp-intro {
    font-size: clamp(15px, 2.2vw, 18px);
    color: var(--grey);
    max-width: 640px;
    margin: 0 0 8px;
  }

  .vp-note {
    font-size: 12.5px;
    color: var(--grey);
    opacity: 0.85;
    margin: 0 0 26px;
  }

  /* Scene */
  .vp-scene {
    position: relative;
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: 0 30px 80px -30px rgba(255,31,142,0.35), 0 0 0 1px rgba(255,255,255,0.02) inset;
  }

  .vp-scene svg { display: block; width: 100%; height: auto; }

  /* Hotspots */
  .vp-hotspot {
    position: absolute;
    transform: translate(-50%, -50%);
    cursor: pointer;
    border: none;
    background: transparent;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 3;
    transition: transform 0.18s ease;
  }
  .vp-hotspot:focus-visible { outline: 2px solid var(--white); outline-offset: 6px; border-radius: 8px; }
  .vp-hotspot:hover { transform: translate(-50%, -50%) scale(1.12); }

  .vp-ring {
    position: relative;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(255,31,142,0.16);
    border: 2px solid var(--pink);
    display: grid;
    place-items: center;
  }
  .vp-ring::before, .vp-ring::after {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    border: 2px solid var(--pink);
    animation: vp-pulse 2.2s ease-out infinite;
  }
  .vp-ring::after { animation-delay: 1.1s; }
  .vp-ring .core {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--pink);
    box-shadow: 0 0 12px 2px var(--pink);
  }
  @keyframes vp-pulse {
    0%   { transform: scale(1); opacity: 0.9; }
    100% { transform: scale(2.4); opacity: 0; }
  }

  .vp-tag {
    font-size: 12px;
    font-weight: 600;
    color: var(--white);
    background: rgba(10,10,11,0.82);
    border: 1px solid rgba(255,31,142,0.4);
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
    backdrop-filter: blur(4px);
  }

  /* Modal */
  .vp-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(5,5,6,0.72);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    z-index: 50;
  }
  .vp-backdrop.open { display: flex; }

  .vp-modal {
    position: relative;
    width: 100%;
    max-width: 380px;
    max-height: 90vh;
    overflow-y: auto;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid rgba(255,31,142,0.28);
    border-radius: 20px;
    box-shadow: 0 40px 90px -20px rgba(255,31,142,0.45);
    padding: 20px;
    animation: vp-pop 0.22s ease;
  }
  /* Each modal is sized to the device it frames */
  .vp-modal.is-tv { max-width: 820px; }
  .vp-modal.is-host { max-width: 560px; }
  .vp-modal.is-player { max-width: 340px; }
  @keyframes vp-pop {
    from { transform: translateY(14px) scale(0.98); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  .vp-modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .vp-modal-title {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--pink);
    font-weight: 700;
  }
  .vp-close {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--white);
    cursor: pointer;
    display: grid;
    place-items: center;
    flex: none;
  }
  .vp-close:hover { border-color: var(--pink); color: var(--pink); }

  @media (max-width: 480px) {
    .vp-tag { font-size: 10.5px; padding: 3px 8px; }
    .vp-ring { width: 28px; height: 28px; }
  }

  /* ============================================================
     REAL preview mockups, copied verbatim from the live
     VenuePlay site (sites/venueplay/index.html). These use the
     .vps- prefix and do not clash with the .vp- prototype styles.
     Brand display fonts (Anton, Manrope, JetBrains Mono, Hanken
     Grotesk) fall back to system fonts in this preview.
     ============================================================ */

  /* ---- TV ---- */
  .vps-tv{
    min-height:300px;border-radius:14px;
    background:linear-gradient(160deg,#101013,#0b0b0d);
    border:1px solid var(--line-2);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 7px #050506,0 0 60px -24px var(--glow);
    padding:clamp(12px,2.4vw,22px);
    display:flex;flex-direction:column;gap:clamp(8px,1.6vw,14px);
    position:relative;overflow:hidden;
  }
  .vps-tv::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(120% 80% at 30% 0%,rgba(255,255,255,.05),transparent 55%);
    pointer-events:none;
  }
  .vps-tv-top{display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:1;flex-wrap:wrap}
  .vps-tv-venue{font-family:'JetBrains Mono',monospace;font-size:clamp(9px,1.4vw,12px);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .vps-pill{
    font-family:'JetBrains Mono',monospace;font-size:clamp(8.5px,1.2vw,11px);
    letter-spacing:.08em;text-transform:uppercase;
    padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);
    color:var(--muted);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  }
  .vps-pill.vps-live{color:var(--pink);border-color:rgba(255,31,142,.45)}
  .vps-pill.vps-prize{color:#fff;background:rgba(255,31,142,.12);border-color:rgba(255,31,142,.4)}
  .vps-dot{width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 9px var(--pink)}
  @media(prefers-reduced-motion:no-preference){
    .vps-dot{animation:vps-pulse 2.4s ease-in-out infinite}
    .vps-tv.vps-inview .vps-ball{animation:vps-ballreveal 1.9s cubic-bezier(.16,1,.3,1) both,vps-ballglow 2.8s ease-in-out 1.9s infinite}
  }
  @keyframes vps-pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes vps-ballreveal{
    0%{transform:scale(.35);opacity:0}
    32%{transform:scale(2.25);opacity:1}
    58%{transform:scale(2.25);opacity:1}
    100%{transform:scale(1);opacity:1}
  }
  @keyframes vps-ballglow{
    0%,100%{box-shadow:0 0 40px -6px var(--glow),inset 0 -8px 22px rgba(0,0,0,.32)}
    50%{box-shadow:0 0 60px 0 var(--glow),inset 0 -8px 22px rgba(0,0,0,.32)}
  }
  .vps-tv-body{display:grid;grid-template-columns:auto 1fr;gap:clamp(12px,2.6vw,24px);flex:1;z-index:1;min-height:0;align-items:center}
  .vps-ball-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .vps-ball-idx{font-family:'JetBrains Mono',monospace;font-size:clamp(8.5px,1.2vw,11px);letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2)}
  .vps-ball{
    width:clamp(78px,13vw,148px);height:clamp(78px,13vw,148px);border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#ff5cae,var(--pink) 45%,var(--pink-deep));
    box-shadow:0 0 46px -4px var(--glow),inset 0 -8px 22px rgba(0,0,0,.32);
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
  }
  .vps-ball .vps-lt{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(11px,1.6vw,15px);letter-spacing:.14em;opacity:.9;line-height:1}
  .vps-ball .vps-nm{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(32px,6vw,62px);line-height:.9;letter-spacing:.01em}
  .vps-ball-chip{
    font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(11px,1.5vw,15px);
    letter-spacing:.04em;color:#fff;line-height:1;
    padding:5px 11px;border-radius:999px;display:inline-flex;align-items:center;
    background:radial-gradient(circle at 34% 30%,#ff5cae,var(--pink) 55%,var(--pink-deep));
    box-shadow:0 0 16px -5px var(--glow),inset 0 -3px 8px rgba(0,0,0,.3);white-space:nowrap;
  }
  .vps-ball-prev{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
  .vps-tv-recent{display:flex;align-items:center;gap:7px;z-index:1;flex-wrap:wrap}
  .vps-tv-recent .vps-ball-chip{font-size:clamp(9px,1.2vw,12px);padding:3px 9px}
  .vps-chip-lbl{font-family:'JetBrains Mono',monospace;font-size:clamp(8px,1.1vw,10px);letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
  .vps-board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-content:center;min-width:0}
  .vps-board .vps-col{display:flex;flex-direction:column;gap:4px}
  .vps-board .vps-h{font-family:'Anton',sans-serif;font-weight:400;text-align:center;color:var(--pink);font-size:clamp(12px,1.8vw,16px);letter-spacing:.06em;padding-bottom:3px}
  .vps-cell{
    font-family:'JetBrains Mono',monospace;font-size:clamp(8px,1.3vw,12px);
    text-align:center;padding:3px 0;border-radius:5px;
    color:var(--muted-2);background:rgba(255,255,255,.03);
  }
  .vps-cell.vps-on{
    color:#fff;background:linear-gradient(180deg,var(--pink),var(--pink-deep));
    box-shadow:0 0 10px -2px var(--glow);font-weight:600;
  }
  .vps-tv-foot{
    display:flex;align-items:center;gap:clamp(10px,2vw,16px);
    background:rgba(255,255,255,.03);border:1px solid var(--line);
    border-radius:11px;padding:clamp(8px,1.6vw,12px) clamp(10px,2vw,16px);z-index:1;
  }
  .vps-qr{width:clamp(40px,6vw,56px);height:clamp(40px,6vw,56px);border-radius:8px;background:#fff;padding:4px;flex:none}
  .vps-qr canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
  .vps-join{flex:1;min-width:0}
  .vps-join .vps-l{font-family:'JetBrains Mono',monospace;font-size:clamp(8px,1.1vw,10.5px);letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2)}
  .vps-join .vps-u{font-family:'Manrope',sans-serif;font-weight:600;font-size:clamp(11px,1.6vw,15px);margin-top:2px;color:#fff;display:flex;align-items:center;gap:7px}
  .vps-u-mark{width:11px;height:13px;flex:none;overflow:visible;filter:drop-shadow(0 0 2px rgba(255,31,142,.9))}
  .vps-code{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(16px,3vw,28px);letter-spacing:.14em;color:var(--pink);text-shadow:0 0 18px var(--glow)}

  /* ---- Phone ---- */
  .vps-phone{
    width:270px;max-width:100%;margin:0 auto;aspect-ratio:9/19;border-radius:34px;background:#0d0d10;
    border:1px solid var(--line-2);
    box-shadow:0 40px 80px -30px rgba(0,0,0,.9),0 0 0 8px #050506,0 0 50px -24px var(--glow);
    padding:14px 13px;display:flex;flex-direction:column;gap:10px;position:relative;
  }
  .vps-notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:92px;height:21px;background:#050506;border-radius:0 0 13px 13px;z-index:3}
  .vps-ph-head{display:flex;align-items:center;justify-content:space-between;padding-top:15px}
  .vps-ph-head .vps-v{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .vps-mini-mark{display:flex;align-items:center;gap:6px}
  .vps-mini-mark svg{display:block;filter:drop-shadow(0 0 6px var(--glow))}
  .vps-mini-mark .vps-w{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:13px;letter-spacing:-.02em}
  .vps-ticker{
    background:rgba(255,31,142,.1);border:1px solid rgba(255,31,142,.32);border-radius:9px;
    padding:8px 11px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#fff;
    display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;
  }
  .vps-ticker b{color:var(--pink)}
  .vps-pcard{
    background:var(--ink-2);border:1px solid var(--line);border-radius:13px;
    padding:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;
  }
  .vps-pcard .vps-h{font-family:'Anton',sans-serif;font-weight:400;text-align:center;color:var(--pink);font-size:15px;padding-bottom:2px}
  .vps-pcell{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:12.5px;border-radius:7px;
    background:rgba(255,255,255,.04);color:#e8e8ec;position:relative;
  }
  .vps-pcell.vps-free{font-family:'Anton',sans-serif;font-size:8.5px;font-weight:400;color:var(--muted-2);text-transform:uppercase;letter-spacing:.05em}
  .vps-pcell.vps-marked{color:#fff;font-weight:700}
  .vps-pcell.vps-marked::after{
    content:"";position:absolute;inset:4px;border-radius:50%;
    background:linear-gradient(180deg,var(--pink),var(--pink-deep));
    box-shadow:0 0 10px -1px var(--glow);z-index:0;
  }
  .vps-pcell.vps-marked span{position:relative;z-index:1}
  .vps-draw-chip{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;padding:2px}
  .vps-draw-chip b{color:#fff}
  .vps-bingo-btn{
    margin-top:auto;background:linear-gradient(180deg,var(--pink),var(--pink-deep));
    color:var(--ink);font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;
    letter-spacing:.06em;font-size:20px;border:0;border-radius:13px;padding:14px;
    box-shadow:0 0 30px -6px var(--glow);cursor:default;
  }

  /* ---- Host console ---- */
  .vps-console{
    border-radius:14px;background:linear-gradient(160deg,#101013,#0b0b0d);
    border:1px solid var(--line-2);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 7px #050506;
    padding:18px;display:flex;flex-direction:column;gap:14px;
  }
  .vps-con-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:13px}
  .vps-con-brand{display:flex;flex-direction:column;gap:7px;min-width:0}
  .vps-con-brand .vps-mini-mark{display:flex;align-items:center;gap:6px}
  .vps-con-brand .vps-mini-mark svg{display:block;filter:drop-shadow(0 0 6px var(--glow))}
  .vps-con-brand .vps-mini-mark .vps-w{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:13px;letter-spacing:-.02em}
  .vps-con-venue{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .vps-con-top .vps-g{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:16px;letter-spacing:.02em}
  .vps-con-top .vps-g small{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--muted-2);text-transform:none;margin-top:4px}
  .vps-con-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
  .vps-next-ball{
    display:block;width:100%;
    background:linear-gradient(180deg,var(--pink),var(--pink-deep));
    border:0;border-radius:12px;color:var(--ink);padding:22px 14px;cursor:default;
    text-align:center;box-shadow:0 0 34px -8px var(--glow);
  }
  .vps-next-ball .vps-k{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:21px;letter-spacing:.04em}
  .vps-next-ball .vps-s{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;margin-top:5px;opacity:.85}
  .vps-recent{margin-top:12px}
  .vps-recent .vps-rl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-bottom:7px}
  .vps-recent .vps-balls{display:flex;gap:6px;flex-wrap:wrap}
  .vps-rb{
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;
    padding:5px 8px;border-radius:7px;background:rgba(255,255,255,.05);
    border:1px solid var(--line);color:#e8e8ec;
  }
  .vps-rb.vps-cur{background:rgba(255,31,142,.16);border-color:rgba(255,31,142,.45);color:#fff}
  .vps-claim{background:var(--ink-3);border:1px solid rgba(47,210,122,.32);border-radius:12px;padding:14px}
  .vps-claim .vps-cl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#2FD27A;margin-bottom:8px}
  .vps-claim .vps-who{font-family:'Anton',sans-serif;font-weight:400;font-size:16px;text-transform:uppercase;letter-spacing:.02em}
  .vps-claim .vps-verdict{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#2FD27A;margin-top:6px;display:flex;align-items:center;gap:6px}
  .vps-claim .vps-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
  .vps-cbtn{font-family:'Manrope',sans-serif;font-weight:700;font-size:12.5px;border:0;border-radius:9px;padding:10px 6px;cursor:default}
  .vps-cbtn.vps-ok{background:#2FD27A;color:#04160c}
  .vps-cbtn.vps-no{background:transparent;border:1px solid #FF5A6E;color:#FF5A6E}
  .vps-con-foot{display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:13px}
  .vps-ghost{font-family:'Manrope',sans-serif;font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:9px;border:1px solid var(--line-2);color:var(--muted);background:transparent;cursor:default}

  /* Post-inject JS. The host toggle swaps the four options between

  function wireTriviaHost() {
    var toggle = document.getElementById('vps-ttoggle');
    if (!toggle) return;
    var texts = document.querySelectorAll('#vps-thost .vps-htext');
    var showingLetters = false;
    toggle.addEventListener('click', function () {
      showingLetters = !showingLetters;
      for (var i = 0; i < texts.length; i++) {
        var attr = showingLetters ? 'data-letter' : 'data-full';
        texts[i].textContent = texts[i].getAttribute(attr);
      }
      toggle.textContent = showingLetters ? 'Show answers' : 'A B C D';
    });
  }

  function buildTvBoard() {
    var board = document.getElementById('vps-board');
    if (!board) return;
    cols.forEach(function(c){
      var col = document.createElement('div'); col.className = 'vps-col';
      var h = document.createElement('div'); h.className = 'vps-h'; h.textContent = c[0]; col.appendChild(h);
      for (var n = c[1]; n <= c[2]; n++) {

        d.className = 'vps-cell' + (called[n] ? ' vps-on' : '');
        d.textContent = n;

    });

    });
    var cardCols = [

      [18, 23, 26, 29, 30],
      [31, 38, 0, 40, 44],
      [47, 50, 54, 57, 59],
      [62, 66, 70, 72, 75]
    ];
    for (var r = 0; r < 5; r++) {
      for (var ci = 0; ci < 5; ci++) {
        var cell = document.createElement('div');
        var num = cardCols[ci][r];
        if (num === 0) {
          cell.className = 'vps-pcell vps-free';

        } else {

          var sp = document.createElement('span'); sp.textContent = num; cell.appendChild(sp);
        }
        pcard.appendChild(cell);

    }

  function drawQR() {
    var qc = document.getElementById('vps-qr');
    if (!qc || !qc.getContext) return;
    var ctx = qc.getContext('2d'), N = 23, s = qc.width / N;
    var seed = 20260901;
    function rnd(){ seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
    ctx.clearRect(0, 0, qc.width, qc.height);
    ctx.fillStyle = '#0A0A0B';
    function finder(ox, oy){
      for (var yy = 0; yy < 7; yy++) for (var xx = 0; xx < 7; xx++) {
        var edge = (xx === 0 || xx === 6 || yy === 0 || yy === 6);
        var core = (xx >= 2 && xx <= 4 && yy >= 2 && yy <= 4);
        if (edge || core) ctx.fillRect((ox + xx) * s, (oy + yy) * s, s, s);
      }
    }
    for (var yy = 0; yy < N; yy++) for (var xx = 0; xx < N; xx++) {
      var inF = (xx < 7 && yy < 7) || (xx > N - 8 && yy < 7) || (xx < 7 && yy > N - 8);
      if (!inF && rnd() > 0.55) ctx.fillRect(xx * s, yy * s, s, s);
    }
    finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
  }

  function wireBingoHost(){
    var btn = document.getElementById('vps-allballs-btn');

    if(!btn || !panel) return;
    var built = false;

        panel.removeAttribute('hidden');
        if(!built && board){
          cols.forEach(function(c){
            var col=document.createElement('div');col.className='vps-col';
            var h=document.createElement('div');h.className='vps-h';h.textContent=c[0];col.appendChild(h);

            board.appendChild(col);
          });
          built=true;
        }
        btn.textContent='Hide all balls';
      } else {
        panel.setAttribute('hidden','');
        btn.textContent='See all balls';
      }
    });
  }

      else if (view === "host") { wireTriviaHost(); }
      else if (view === "player") { wireTriviaPlayer(); }
    } else if (currentMode === "musical") {
      body.innerHTML = musicalViews[view] || "";
    } else if (currentMode === "raffle") {
      body.innerHTML = raffleViews[view] || "";
    } else if (currentMode === "members") {
      body.innerHTML = membersViews[view] || "";
    } else if (currentMode === "ads") {
      body.innerHTML = adViews[view] || "";
    } else {
      body.innerHTML = placeholderView(view);
    }
    backdrop.classList.add("open");
  }
  function close() {
    backdrop.classList.remove("open");
    body.innerHTML = "";
    modal.className = "vp-modal";
  }

  var spots = document.querySelectorAll(".vp-hotspot");
  for (var i = 0; i < spots.length; i++) {
    spots[i].addEventListener("click", function () {
      open(this.getAttribute("data-view"));
    });
  }

  document.getElementById("vpClose").addEventListener("click", close);
  backdrop.addEventListener("click", function (e) {
    if (e.target === backdrop) close();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") close();
  });

  /* ---- Game mode dropdown ---- */
  var modeBar = document.querySelector(".vp-modebar");
  var modeBtn = document.getElementById("vpModeBtn");
  var modeMenu = document.getElementById("vpModeMenu");
  var modeLabelEl = document.getElementById("vpModeLabel");
  var modeOpts = Array.prototype.slice.call(modeMenu.querySelectorAll(".vp-modeopt"));

  function menuOpen() { return modeMenu.classList.contains("open"); }

  function openMenu() {
    modeMenu.classList.add("open");
    modeBtn.setAttribute("aria-expanded", "true");
    var sel = modeMenu.querySelector('[aria-selected="true"]') || modeOpts[0];
    sel.focus();
  }
  function closeMenu(focusBtn) {
    modeMenu.classList.remove("open");
    modeBtn.setAttribute("aria-expanded", "false");
    if (focusBtn) modeBtn.focus();
  }
  function selectMode(opt) {
    currentMode = opt.getAttribute("data-mode");
    currentModeLabel = opt.getAttribute("data-label");
    modeLabelEl.textContent = currentModeLabel;
    for (var i = 0; i < modeOpts.length; i++) {
      modeOpts[i].setAttribute("aria-selected", modeOpts[i] === opt ? "true" : "false");
    }
  }
  function focusOpt(idx) {
    var n = modeOpts.length;
    modeOpts[(idx + n) % n].focus();
  }

  modeBtn.addEventListener("click", function () {
    if (menuOpen()) closeMenu(false); else openMenu();
  });
  modeBtn.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" || e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      openMenu();
    }
  });

  modeOpts.forEach(function (opt, idx) {
    opt.addEventListener("click", function () {
      selectMode(opt);
      closeMenu(true);
    });
    opt.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown") { e.preventDefault(); focusOpt(idx + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); focusOpt(idx - 1); }
      else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectMode(opt); closeMenu(true); }
      else if (e.key === "Escape") { e.preventDefault(); closeMenu(true); }
      else if (e.key === "Home") { e.preventDefault(); focusOpt(0); }
      else if (e.key === "End") { e.preventDefault(); focusOpt(modeOpts.length - 1); }
    });
  });

  document.addEventListener("click", function (e) {
    if (menuOpen() && !modeBar.contains(e.target)) closeMenu(false);
  });
})();
</script>

</body>
</html>
